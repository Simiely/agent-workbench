  /* ===== 开发强度：多排方块格子热力（每排一段日期，旧→新），整块可点开全年日历 ===== */
  .gh-intensity {
    flex: none; cursor: pointer;
    display: flex; flex-direction: column; /* 头部在上，格子区 flex:1 撑满剩余高度 */
    margin: 2px 0 6px; padding: 9px 12px 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 11px;
    transition: border-color .15s;
  }
  .gh-intensity:hover { border-color: var(--border-strong); }
  .gi-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 5px; }
  .gi-label { display: flex; flex-direction: column; gap: 2px; }
  .gi-label b { font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .gi-label span { font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
  .gi-ranges { display: inline-flex; gap: 4px; margin-left: auto; }
  .gi-range {
    height: 21px; padding: 0 9px; border-radius: 6px;
    font-size: 11px; color: var(--text-3);
    background: none; border: 1px solid transparent; transition: .15s;
  }
  .gi-range:hover { color: var(--text); background: var(--panel-3); }
  .gi-range.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  /* 右侧日期标签：替代原来的「点开看全年日历」按钮（全年日历仍可点面板打开，这里只报当前区间） */
  .gi-when {
    font-size: 11px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums;
    font-weight: 500; letter-spacing: .2px; pointer-events: none;
  }
  /* 格子区：纵向堆排，每排平分剩余高度 —— 高度自适应，不写死 */
  .gi-rows { flex: 1; display: flex; flex-direction: column; gap: 5px; min-height: 0; }
  .gi-rowblock { flex: 1; display: flex; gap: 7px; min-height: 0; }
  .gi-rowlabel {
    flex: none; width: 36px; display: flex; align-items: center; justify-content: flex-end;
    font-size: 10px; color: var(--text-3); white-space: nowrap;
  }
  .gi-chart { display: flex; align-items: stretch; gap: 3px; flex: 1; min-height: 28px; }
  .gi-cell {
    flex: 1 1 0; min-width: 0; position: relative;
    border-radius: 4px; background: var(--panel-3);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .15s;
  }
  .gi-cell i {
    font-style: normal; font-weight: 600; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    font-size: var(--gi-num, 11px); /* 字号随格子尺寸自适应，由 fitGiNum() 写入 */
  }
  /* 格内小日期：钉在方块下边缘（几号），大数字保持正中 */
  .gi-cell em {
    position: absolute; left: 0; right: 0; bottom: 2px;
    font-style: normal; font-weight: 400; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    text-align: center;
    font-size: 8.5px; color: var(--text-3);
  }
  /* 未来日期：比零更新更浅，点不开的感觉 */
  .gi-cell.future { background: var(--panel); border: 1px dashed var(--border); }
  .gi-cell.future i { color: var(--text-3); font-weight: 400; }
  .gi-cell.l1 { background: color-mix(in srgb, var(--accent) 28%, var(--panel)); }
  .gi-cell.l2 { background: color-mix(in srgb, var(--accent) 48%, var(--panel)); }
  .gi-cell.l3 { background: color-mix(in srgb, var(--accent) 70%, var(--panel)); }
  .gi-cell.l4 { background: var(--accent); }
  .gi-cell.l1 i, .gi-cell.l2 i { color: var(--text); }
  .gi-cell.l3 i, .gi-cell.l4 i { color: #fff; }
  .gi-cell.l3 em, .gi-cell.l4 em { color: rgba(255, 255, 255, 0.75); }
  .gi-cell.future em { color: var(--text-3); opacity: .65; }
  .gi-empty { padding: 4px 0 2px; font-size: 11px; color: var(--text-3); }

  /* ===== 日历热力图（弹窗内）：行=周一到周日，列=周，颜色 5 档，按年展示 ===== */
  .hm-wrap { display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 2px; }
  .hm-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hm-nav { flex: none; display: inline-flex; align-items: center; gap: 8px; }
  .hm-nav b { font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
  .hm-navbtn {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--panel-3); border: 1px solid var(--border);
    font-size: 15px; line-height: 1; color: var(--text-2); transition: .15s;
  }
  .hm-navbtn:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); }
  .hm-navbtn:disabled { opacity: .35; cursor: default; }
  .hm-summary { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-2); }
  .hm-summary b { color: var(--text); font-weight: 600; }
  .hm-numtoggle {
    flex: none; height: 26px; padding: 0 12px; border-radius: 7px;
    font-size: 11.5px; color: var(--text-3);
    background: none; border: 1px solid var(--border); transition: .15s;
  }
  .hm-numtoggle:hover { color: var(--text); border-color: var(--border-strong); }
  .hm-numtoggle.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .hm-scroll { overflow-x: auto; padding-bottom: 4px; }
  .hm-months { position: relative; height: 15px; margin-left: 30px; }
  .hm-months span { position: absolute; top: 0; font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
  .hm-flex { display: flex; gap: 5px; }
  .hm-wds { flex: none; display: flex; flex-direction: column; gap: 3px; width: 25px; }
  .hm-wds span { height: 20px; font-size: 10px; line-height: 20px; color: var(--text-3); }
  .hm-grid { display: flex; gap: 3px; }
  .hm-week { display: flex; flex-direction: column; gap: 3px; }
  .hm {
    position: relative; width: 20px; height: 20px; border-radius: 4px;
    background: var(--panel-3);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .hm.blank { background: none; }
  .hm.l0 { background: var(--panel-3); }
  .hm.l1 { background: color-mix(in srgb, var(--accent) 28%, var(--panel)); }
  .hm.l2 { background: color-mix(in srgb, var(--accent) 48%, var(--panel)); }
  .hm.l3 { background: color-mix(in srgb, var(--accent) 70%, var(--panel)); }
  .hm.l4 { background: var(--accent); }
  .hm i { font-style: normal; font-size: 10px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  /* 数字配色跟随档位底色：浅底深字、深底白字（两套主题都成立） */
  .hm.l1 i, .hm.l2 i { color: var(--text); }
  .hm.l3 i, .hm.l4 i { color: #fff; }
  .hm.l0 i { color: var(--text-3); }
  .hm:not(.blank) { cursor: default; }
  .hm-legend { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-3); }
  .hm-legend .hm { width: 12px; height: 12px; border-radius: 3px; }
  .hm-tip {
    position: fixed; z-index: 90; display: none; pointer-events: none;
    padding: 5px 9px; border-radius: 7px;
    background: var(--mask-bg-solid, #1c1c1e); color: #fff;
    font-size: 11px; line-height: 1.5; white-space: nowrap;
    border: 1px solid var(--border-strong);
    box-shadow: none;
  }
  .hm-tip b { margin-right: 7px; font-variant-numeric: tabular-nums; }

  .gh-list { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; align-content: start; padding: 6px 2px 4px; }
  .gh-card { background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; transition: border-color .15s; }
  .gh-card:hover { border-color: var(--border-strong); }
  .gh-top { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; flex-wrap: wrap; }
  .gh-time { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .gh-time .sub { font-size: 10.5px; color: var(--text-3); font-weight: 400; margin-left: 7px; }
  .gh-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; }
  .gh-content { font-size: 12.5px; color: var(--text-2); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .badge.ok { color: var(--done); border-color: color-mix(in srgb, var(--done) 36%, transparent); background: var(--done-soft); }
  .badge.fail { color: #F0736F; border-color: color-mix(in srgb, #F0736F 36%, transparent); background: rgba(240,115,111,.12); }
  .badge.part { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 32%, transparent); background: rgba(240,162,46,.11); }
  .gh-ver { font-size: 10px; padding: 1px 7px; border-radius: 5px; background: var(--panel-3); border: 1px solid var(--border); color: var(--text-2); }
  .gh-ver b { color: var(--text); font-weight: 600; }

  /* 仓库卡片 */
  /* 仓库卡片：判定范围是整张卡片（跟任务看板的 .card 一致），
     所以卡片本身给 pointer 光标 + hover 时仓库名变主色，作为「可点」的视觉反馈。 */
  .repo-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 15px; display: flex; flex-direction: column; gap: 9px; min-width: 0; cursor: pointer; }
  .repo-card:hover { border-color: var(--border-strong); }
  .repo-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .repo-name {
    font-size: 14px; font-weight: 600; letter-spacing: .1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; transition: color .15s;
  }
  .repo-card:hover .repo-name { color: var(--accent); }
  /* 复制链接：独立按钮，不再藏在仓库名的 hover 提示里 */
  .repo-copy {
    flex: none; font-size: 10.5px; color: var(--text-3); white-space: nowrap;
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px;
    transition: color .15s, border-color .15s;
  }
  .repo-copy:hover { color: var(--accent); border-color: var(--accent); }
  .repo-count { margin-left: auto; flex: none; font-size: 10.5px; color: var(--text-3); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
  .repo-unsync { flex: none; font-size: 10.5px; font-weight: 500; color: var(--warn); background: var(--warn-soft); border-radius: 5px; padding: 1px 6px; }
  .repo-del {
    display: none; flex: none; font-size: 10.5px; color: var(--danger);
    border: 1px solid var(--danger-soft); background: var(--danger-soft); border-radius: 5px; padding: 1px 6px;
  }
  body.manage .repo-del { display: inline-flex; }
  .repo-del:hover { border-color: var(--danger); }
  .archtag { flex: none; font-size: 10.5px; color: var(--text-3); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
  .repo-sub { font-size: 11px; color: var(--text-3); }
  .repo-sub .sub { margin-left: 7px; }
  .repo-vers { display: flex; gap: 5px; flex-wrap: wrap; }
  .repo-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .repo-entries { display: flex; flex-direction: column; gap: 1px; border-top: 1px solid var(--border); padding-top: 7px; }
  .repo-entry { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-2); padding: 4px 0; min-width: 0; }
  .repo-entry .re-time { color: var(--text-3); flex: none; font-variant-numeric: tabular-nums; }
  /* 版本号可能一次列好几个（v0.34.0 / v0.35.0 / v0.36.0）：
     之前是 flex:none 且没有宽度上限，长版本号会直接撑出卡片、压住后面的状态标签。
     现在允许收缩 + 省略号，完整内容放在 title 里。 */
  .repo-entry .re-ver {
    color: var(--text); font-weight: 500;
    flex: 0 1 auto; min-width: 0; max-width: 38%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .repo-entry .re-res { flex: none; font-size: 10px; line-height: 15px; padding: 0 5px; border-radius: 4px; }
  .repo-entry .re-res.ok { color: var(--done); background: var(--done-soft); }
  .repo-entry .re-res.un { color: var(--warn); background: var(--warn-soft); }
  .repo-entry .re-who {
    color: var(--text-3); white-space: nowrap;
    flex: 0 1 auto; min-width: 0; max-width: 32%;
    overflow: hidden; text-overflow: ellipsis;
  }
  .repo-entry .re-content { flex: 1 1 0; min-width: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .repo-entry .re-dots { width: 18px; height: 18px; font-size: 13px; margin: 0; }
  .repo-foot { display: flex; align-items: center; gap: 12px; }
  .link-btn { font-size: 11.5px; color: var(--accent); padding: 2px 0; }
  .link-btn:hover { text-decoration: underline; }
  .repo-foot .link-btn:last-child { margin-left: auto; }

  /* ── 仓库详情弹窗里的记录列表 ──
     每行是一条同步记录，点它进编辑态（和任务详情→编辑是同一套交互）。 */
  .rd-list { display: flex; flex-direction: column; gap: 1px; }
  .rd-row {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    font-size: 11.5px; color: var(--text-2); padding: 7px 9px;
    border-radius: 7px; border: 1px solid transparent; min-width: 0;
    transition: background .13s, border-color .13s;
  }
  .rd-row:hover { background: var(--panel-3); border-color: var(--border); }
  .rd-row .rd-time { color: var(--text-3); flex: none; font-variant-numeric: tabular-nums; width: 96px; }
  .rd-row .rd-ver { color: var(--text); font-weight: 500; flex: 0 1 auto; min-width: 0; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-row .re-res { flex: none; font-size: 10px; line-height: 15px; padding: 0 5px; border-radius: 4px; }
  .rd-row .re-res.ok { color: var(--done); background: var(--done-soft); }
  .rd-row .re-res.un { color: var(--warn); background: var(--warn-soft); }
  .rd-row .rd-content { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-row .rd-chev { color: var(--text-3); flex: none; font-size: 14px; }
  .repo-name { cursor: pointer; }

  /* ===== 窗格顶部置顶：滚动时标题 / KPI / 分段 / 筛选留在栏顶 =====
     .view 是滚动容器（overflow-y:auto），.pane-top 用 sticky 钉在栏顶；
     负 margin 让它铺满栏宽、并把 .view 的上内边距也吃掉，内容不会从缝里透出来。 */
  .pane-top {
    position: sticky; top: 0; z-index: 6;
    margin: 0 -14px; padding: 12px 14px 10px;
    background: var(--bg);
  }
  /* 上内边距移到 .pane-top 里：sticky 的偏移是按滚动容器的 padding 计算的，
     容器自己留 padding-top 会让顶栏被顶下去一条缝，滚动时内容从缝里透出来。 */
  .view { padding: 0 14px 40px; }
  .pane-top .sec-title { margin-bottom: 10px; }
  .pane-top .gh-intensity { padding: 0 0 8px; }

  /* ============================================================
     暖色皮肤（默认暖黑）：只改「材质」，不动布局骨架
     原则：
       ① 去硬边框 —— 用「纸面 + 阴影 + 间距」分区，只在语义需要时用细描边（孤儿列）
       ② 两层纸面 —— 页面底 → 窗格（--panel）→ 列/仓库卡（--panel-2）→ 卡片（--panel）
       ③ 实心按钮统一走 --btn-*：暖黑亮底深字、暖白深底白字，两种主题都保证对比度
     ============================================================ */
  .topbar { border-bottom: 0; padding: 18px 26px 10px; flex-wrap: wrap; row-gap: 8px; }
  main.split { padding: 0 26px 22px; gap: 18px; }
  .view { background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); padding: 0 22px 36px; }
  .pane-top { margin: 0 -22px; padding: 18px 22px 10px; background: var(--panel); border-radius: 22px 22px 0 0; }

  .search { border: 0; background: var(--panel-2); border-radius: 99px; height: 36px; padding: 0 14px;
    width: 300px; flex: 0 1 300px; min-width: 180px; }
  /* 中等宽度：先收窄快捷指南（去掉「电脑」二字、下拉限宽），别让搜索框被压成 50px */
  @media (max-width: 1180px) {
    .ai-quick .lab { display: none; }
    .ai-quick select { max-width: 96px; }
    .ai-quick { padding-left: 9px; }
  }
  @media (max-width: 1100px) {
    .topbar #aiGuideBtn .gt { display: none; } /* 指南只留 🤖 图标，完整说明仍可开 */
    .search { min-width: 200px; }
  }
  /* 再窄：搜索整行独占一行，按钮留在上一行 —— 比把搜索压成图标 / 让「新增」单独掉一行更可用 */
  @media (max-width: 1040px) {
    .search { order: 9; flex: 1 1 100%; max-width: none; min-width: 0; }
  }
  .search:focus-within { box-shadow: inset 0 0 0 1px var(--border-strong); }
  .icon-btn { border: 0; background: var(--panel-2); border-radius: 50%; box-shadow: none; }
  .icon-btn:hover { background: var(--panel-3); border: 0; color: var(--text); }
  .ghost-btn { border: 0; background: var(--panel-2); border-radius: 99px; }
  .ghost-btn:hover { background: var(--panel-3); border: 0; }
  .ghost-btn.on { border: 0; background: var(--accent-soft); color: var(--accent); }
  .btn-primary { background: var(--btn-bg); color: var(--btn-fg); border-radius: 99px; }
  .btn-primary:hover { background: var(--btn-bg-hover); filter: none; }
  .btn-ghost { border: 0; background: var(--panel-2); border-radius: 99px; }
  .btn-ghost:hover { background: var(--panel-3); border: 0; }
  .btn-ghost.danger { background: transparent; color: var(--danger); }
  .btn-ghost.danger:hover { background: var(--danger-soft); color: var(--danger); }

  .sec-title { font-size: 13.5px; }
  .sec-title .mx { border: 0; background: var(--panel-2); }
  .brand .ver { color: var(--text-2); background: var(--panel-2); border: 0; }

  /* 顶栏快捷指南：下拉选电脑 + 复制契约，不弹窗也能用 */
  .ai-quick {
    display: inline-flex; align-items: center; gap: 6px; height: 33px; padding: 0 5px 0 11px;
    background: var(--panel-2); border-radius: 99px; white-space: nowrap;
  }
  .ai-quick .lab { font-size: 10px; letter-spacing: .4px; color: var(--text-3); }
  .ai-quick select {
    background: none; border: 0; outline: none; cursor: pointer;
    font-size: 12px; color: var(--text); max-width: 132px; padding: 0 2px;
  }
  .ai-quick select option { background: var(--panel-3); color: var(--text); }
  .ai-quick button {
    height: 23px; padding: 0 10px; border-radius: 99px; font-size: 11.5px;
    background: var(--panel); color: var(--text-2); box-shadow: var(--shadow);
  }
  .ai-quick button:hover { color: var(--text); }

  /* KPI 保留 2×2（右侧开发强度按它对齐高度），只去描边、加重数字。
     auto-fit + 148px 下限：桌面窄栏仍是 2 列，平板/堆叠后自动变 4 列，不拉出一排大空块 */
  .kpis { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .kpi { background: var(--panel-2); border: 0; border-radius: 16px; }
  .kpi:hover { background: var(--panel-3); }
  .kpi.on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .kpi .num { font-size: 22px; }
  /* 卡片右上角的小提示在窄瓦片里会被数字挤住，暖色皮肤里不再显示（语义由分段与视图本身表达） */
  .kpi .hint { display: none; }

  .tabs { background: var(--panel-2); border: 0; border-radius: 99px; }
  .tabs button { border-radius: 99px; }
  .tabs button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }

  .col { background: var(--panel-2); border: 0; border-radius: 16px; }
  .col.col-orphan { background: transparent; border: 1px dashed var(--border-strong); }
  .col-head { border-bottom: 0; }
  .acc { background: var(--panel); border: 0; border-radius: 99px; box-shadow: var(--shadow); }
  .acc .cnt { border: 0; background: var(--panel-2); }
  /* 一号多机同时登录：胶囊整颗转成告警色（不靠小图标，扫一眼就能看见） */
  .acc.conflict { background: var(--danger-soft); box-shadow: inset 0 0 0 1px var(--danger); }
  .acc.conflict .led { background: var(--danger); }
  .acc.conflict .pf, .acc.conflict .an { color: var(--danger); }
  .acc.conflict .an { font-weight: 600; }
  .acc .excl {
    width: 14px; height: 14px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 10px; font-weight: 700; line-height: 1;
    background: var(--danger); color: var(--panel);
  }
  .acc-row .tag.warn { color: var(--danger); font-weight: 600; }
  .card { background: var(--panel); border: 0; border-radius: 13px; box-shadow: var(--shadow); position: relative; }
  .card:hover { border: 0; box-shadow: 0 0 0 1px var(--border-strong); }
  .card.p0 { border-left: 0; }
  .card.p0::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--accent);
  }
  .card.sel, .repo-entry.sel { border: 0; box-shadow: inset 0 0 0 2px var(--accent); }
  .sel-box { border: 0; background: var(--panel-3); }
  .c-actions .mini, .col-empty .mini { border: 0; background: var(--panel-3); }
  .badge { border: 0; background: var(--panel-3); }
  .gh-ver { border: 0; background: var(--panel-3); border-radius: 99px; }
  .prio.p0 { color: var(--danger); background: var(--danger-soft); }
  .prio.p1 { color: var(--warn); background: var(--warn-soft); }
  .progress .box, .todo-item .box { border: 0; background: var(--panel-3); }
  .todo-item .box.on { background: var(--done); color: #12200F; }
  .inline-input { border: 0; box-shadow: inset 0 0 0 1px var(--accent); background: var(--panel-3); }

  .gh-intensity { background: transparent; border: 0; box-shadow: none; }
  .gh-filter { border: 0; background: var(--panel-2); border-radius: 99px; height: 32px; }
  .gh-kpis .kpi:hover { border: 0; background: var(--panel-2); }
  .gh-kpis .kpi.on { border: 0; background: var(--accent-soft); }
  .gi-range.on { border: 0; background: var(--accent-soft); }
  .gi-range:hover { background: var(--panel-3); }
  .gi-cell.future { border: 0; box-shadow: inset 0 0 0 1px var(--border); }

  .repo-card { background: var(--panel-2); border: 0; border-radius: 16px; box-shadow: var(--shadow); }
  .repo-card:hover { border: 0; box-shadow: 0 0 0 1px var(--border-strong); }
  .repo-entries { border-top: 0; padding-top: 6px; }
  .repo-copy, .repo-count, .archtag { border: 0; background: var(--panel-3); border-radius: 99px; }
  .repo-pin {
    flex: none; font-size: 10.5px; color: var(--text-3); white-space: nowrap;
    border: 0; border-radius: 99px; background: var(--panel-3); padding: 1px 8px;
  }
  .repo-pin:hover { color: var(--text); }
  .repo-pin.on { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .repo-card.pinned { box-shadow: inset 0 0 0 1px var(--accent); }
  .repo-head { flex-wrap: wrap; row-gap: 4px; }
  .repo-del { border: 0; }
  .rd-row { border-color: transparent; }
  .rd-row:hover { border-color: transparent; background: var(--panel-3); }

  .drawer, .modal { border: 0; border-radius: 24px; }
  .drawer-head, .modal-head { border-bottom: 0; padding-bottom: 8px; }
  .drawer-head h3, .modal-head h3 { font-size: 14px; font-weight: 650; }
  .drawer-foot { border-top: 0; }
  .dt-sec { border-top: 0; padding-top: 16px; }
  .dt-sec:first-child { padding-top: 0; }
  .dt-tag { border: 0; background: var(--panel-3); border-radius: 99px; }
  .dt-tag.st-doing { border: 0; background: var(--accent-soft); color: var(--accent); }
  .dt-tag.st-done { border: 0; background: var(--done-soft); color: var(--done); }
  /* 详情就地编辑：可改的地方给出「可点」的反馈 */
  .dt-title[data-dt-edit], .dt-text[data-dt-edit], .dt-path[data-dt-edit] { cursor: text; border-radius: 8px; transition: background .15s; }
  .dt-title[data-dt-edit]:hover, .dt-text[data-dt-edit]:hover, .dt-path[data-dt-edit]:hover {
    background: var(--panel-2); box-shadow: 0 0 0 4px var(--panel-2);
  }
  .dt-tag[data-dt-menu] { cursor: pointer; font: inherit; }
  .dt-tag[data-dt-menu]:hover { box-shadow: inset 0 0 0 1px var(--border-strong); }
  .dt-todo-row[data-dt-todo] { cursor: pointer; border-radius: 8px; padding: 3px 6px; margin: 0 -6px; }
  .dt-todo-row[data-dt-todo]:hover { background: var(--panel-2); }
  .dt-tip { font-size: 9.5px; font-weight: 400; color: var(--text-3); margin-left: 7px; }
  .dt-path.muted { color: var(--text-3); }
  .dt-edit {
    width: 100%; font: inherit; color: var(--text); background: var(--panel-3);
    border: 0; border-radius: 8px; padding: 6px 8px; outline: none;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .dt-edit.multi { min-height: 76px; resize: vertical; line-height: 1.7; font-size: 12.5px; }
  .menu button.cur { color: var(--accent); }
  .dt-tag.prio-p0 { border: 0; background: var(--danger-soft); color: var(--danger); }
  .dt-tag.prio-p1 { border: 0; background: var(--warn-soft); color: var(--warn); }
  .dt-path { border: 0; background: var(--panel-2); }
  .dt-todo-mark { border: 0; background: var(--panel-3); }
  .dt-todo-row.done .dt-todo-mark { background: var(--done); color: #12200F; }
  .field input, .field textarea, .field select { border: 0; background: var(--panel-3); border-radius: 10px; }
  .field input:focus, .field textarea:focus, .field select:focus { box-shadow: inset 0 0 0 1px var(--accent); }
  .ai-pick select { border: 0; background: var(--panel-3); }
  .ai-pre { background: var(--panel-2); }

  .menu { border: 0; border-radius: 16px; box-shadow: none; }
  .acc-foot { border-top: 0; }
  .acc-form-btns button.primary { background: var(--btn-bg); color: var(--btn-fg); }
  .manage-bar { border: 0; border-radius: 18px; box-shadow: none; }
  .manage-bar .m-group + .m-group { border-left: 0; padding-left: 8px; }
  .manage-bar button { border: 0; background: var(--panel-2); border-radius: 99px; }
  .manage-bar button.danger { background: var(--danger-soft); border: 0; }
  .toast { border: 0; border-radius: 99px; }
  .hm-navbtn, .hm-numtoggle { border: 0; background: var(--panel-2); }
  .hm-numtoggle.on { border: 0; background: var(--accent-soft); color: var(--accent); }
  .hm-tip { border: 0; }

  /* ===== 底部 T-bar（窄屏分页）：宽屏隐藏，≤760px 接管导航与主操作 ===== */
  .tabbar { display: none; }
  #aiFull { display: none; }
  .tb-item, .tb-add { -webkit-tap-highlight-color: transparent; }

  /* 手机形态：一次只看一页，导航下沉到底部 T-bar。命中任一条件即生效：
     ① 窄屏 ≤700px（宽度断点定在 700：能覆盖所有手机；同时测试器默认视口是 748，
        保持宽屏形态，避免「改断点顺手改坏一批几何断言」。平板竖屏 768 仍是左右分屏）
     ② 上下分屏 —— 屏幕被上下切成两块后高度只剩一半，纵向空间放不下两栏；
        此时横向还很宽（1920×1080 上下分 → 视口约 1920×450，扁平比 4+），
        纯宽度断点识别不出来，故按「矮 + 扁」双重判断。
     ⚠️ 扁平比必须 ≥2/1，不能只留高度条件：普通小窗口 / 无头浏览器默认视口
        （实测 780×493，扁平比仅 1.58）同样是矮的，只按高度判会误伤一大批，
        实测会把测试环境误判成上下分屏、直接改坏 V5b_fit 的几何断言。
     ⚠️ 两处断点必须同步：本行 CSS 与 bindMobilePages() 里的 matchMedia 字符串。
        改一个忘另一个会导致「JS 切了页、CSS 没隐藏另一页」的半吊子状态。 */
  @media (max-width: 700px), (max-height: 560px) and (min-aspect-ratio: 2/1) {
    .topbar { padding: 13px 14px 0; gap: 9px; flex-wrap: wrap; }
    .topbar #manageBtn, .topbar #aiGuideBtn, .topbar #addBtn, .topbar #themeBtn { display: none; }
    .ai-quick { display: none; } /* 手机上「指南」在底部 T-bar 中央键里 */
    .search { width: 100%; order: 3; height: 38px; }
    /* 「放大本栏」在手机上无意义（点标题是切页），隐藏角标 */
    .sec-title .mx { display: none; }

    main.split {
      padding: 10px 12px calc(78px + env(safe-area-inset-bottom, 0px));
      flex-direction: column; overflow-y: auto; gap: 0;
    }
    .split-divider { display: none; }
    /* 没有左右分屏了：一次只显示一页，由底部 T-bar 切换 */
    body[data-page="board"] #viewGithub { display: none; }
    body[data-page="gh"] #viewBoard { display: none; }
    .view { padding: 0 14px 24px; overflow: visible; border-radius: 20px; }
    /* 手机上一次只看一页、且滚动容器是 main.split，栏顶再钉住会吃掉半屏高度；
       这里退回普通文档流，随页面一起上移，把纵向空间全留给内容。 */
    .pane-top { position: static; margin: 0 -14px; padding: 15px 14px 8px; border-radius: 20px 20px 0 0; }

    /* 列按内容高度排：grid 默认会把每行拉满，卡片会超出列高、压到下一列 */
    .board { grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; align-content: start; }
    .board .col { height: auto; }
    .board .col-body { flex: none; overflow: visible; }
    .gh-list { grid-template-columns: minmax(0, 1fr); }

    /* 同步记录窄屏两行排：时间/版本/状态/菜单一行，内容独占第二行 */
    .repo-entry {
      display: grid; grid-template-columns: auto 1fr auto auto;
      grid-template-areas: "time ver res dots" "content content content content";
      row-gap: 2px; padding: 6px 0; align-items: center;
    }
    .repo-entry .re-time { grid-area: time; }
    .repo-entry .re-ver { grid-area: ver; max-width: none; }
    .repo-entry .re-res { grid-area: res; justify-self: end; }
    .repo-entry .re-content { grid-area: content; white-space: normal; }
    .repo-entry .re-dots { grid-area: dots; }
    .repo-entry .re-who { display: none; }

    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; align-items: flex-end; justify-content: space-around; gap: 2px;
      padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px));
      background: var(--panel); border-top: 0;
      box-shadow: none;
    }
    .tb-item {
      min-width: 58px; min-height: 48px; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font-size: 10.5px; color: var(--text-3);
    }
    .tb-item .em { font-size: 16px; line-height: 1; }
    .tb-item.on { color: var(--accent); background: transparent; }
    /* T-bar 只留浏览：看板 / 仓库 切页 + 更多。
       「AI 指南」不再单独占中央键——它是写操作不是浏览，收进「更多」菜单。
       只剩 3 个键后改居中靠拢：上下分屏时栏宽可达 1920，space-around 会把键甩到两端。 */
    .tabbar { justify-content: center; gap: 6px; }
    .tb-item { flex: 1 1 0; max-width: 110px; }

    /* 弹窗统一居中形态：手机上只把宽度和安全区收一下，不再改底部弹层 */
    .drawer, .modal { width: 94vw; max-height: 84vh; border-radius: 22px; }
    .drawer-foot, .modal-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }

    /* AI 指南弹窗在手机上只显示「① 怎么用」（ai-sec-pick），其余块按需展开 */
    #aiFull { display: inline-flex; }
    #aiDrawer .ai-sec:not(.ai-sec-pick) { display: none; }
    #aiDrawer .ai-machlist { display: none; }
    #aiDrawer.ai-full .ai-sec { display: block; }
    #aiDrawer.ai-full .ai-machlist { display: block; }
    #aiCopyEx { display: none; }
    .ai-pick { flex-wrap: wrap; }
    .ai-pick select { height: 44px; font-size: 14px; padding: 0 10px; }
    .ai-pick-tip { flex: 1 1 100%; }

    .manage-bar { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); left: 8px; right: 8px; transform: translateY(140%); }
    .manage-bar.on { transform: translateY(0); }
    .toast { bottom: calc(94px + env(safe-area-inset-bottom, 0px)); }
  }

</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><h1>Agent 工作台</h1><span class="ver" id="appVer" title="当前部署的版本号"></span></div>
  <div class="spacer"></div>
  <div class="search">
    <svg aria-hidden="true" fill="none" height="13" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="13">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="q" placeholder="搜任务 / 仓库、内容、版本" type="text">
  </div>
  <!-- 批量导入闭环：复制提示词给 AI → AI 回一段长文本 → 粘进来批量落库。
       提示词里带上工作台现状骨架，AI 才知道该新建卡片还是续写已有卡片。 -->
  <div class="ai-quick" id="aiQuick" title="复制提示词给 AI，或粘贴 AI 回写的长文本批量导入">
    <button id="aiQuickCopy" type="button" title="复制提示词：含工作台现状骨架 + 输出格式">复制提示词</button>
    <button id="impBtn" type="button" title="粘贴长文本，批量新建 / 更新卡片">批量导入</button>
  </div>
  <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
    <svg aria-hidden="true" fill="none" height="15" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" width="15">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>
  <button class="ghost-btn" id="manageBtn" title="批量选择与操作">管理</button>
  <button class="ghost-btn" id="aiGuideBtn" title="AI 写入指南：四张表的字段契约与示例">🤖 <span class="gt">指南</span></button>
  <button class="btn-primary" id="addBtn" title="新增">
    <svg aria-hidden="true" fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-width="2.2" viewBox="0 0 24 24" width="12"><path d="M12 5v14M5 12h14"/></svg>
    新增
    <svg aria-hidden="true" fill="none" height="11" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="11"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</header>

<main class="split">
  <section class="view" id="viewBoard">
    <div class="pane-top">
      <button class="sec-title" id="tBoard" title="点击放大本栏，再点还原" type="button">任务看板<span class="mx">⤢</span></button>
      <div class="summary" id="summary"></div>
      <div class="tabs" id="segTabs">
        <button class="on" data-s="进行中" type="button">进行中</button>
        <button data-s="全部" type="button">全部</button>
        <button data-s="已完成" type="button">已完成</button>
      </div>
    </div>
    <div class="board" id="board"></div>
  </section>
  <div class="split-divider" id="splitDivider" title="拖动调整左右比例"></div>
  <section class="view" id="viewGithub">
    <div class="pane-top">
      <button class="sec-title" id="tGh" title="点击放大本栏，再点还原" type="button">GitHub 看板<span class="mx">⤢</span></button>
      <div class="gh-intensity" id="ghIntensity"></div>
      <div class="gh-toolbar">
        <div class="gh-filter"><label for="ghF_machine">电脑</label><select id="ghF_machine"><option value>全部</option></select></div>
        <div class="gh-kpis" id="ghKpis"></div>
      </div>
    </div>
    <div class="gh-list" id="ghList"></div>
  </section>
</main>

<nav class="tabbar" id="tabbar" aria-label="分页">
  <button class="tb-item" data-page="board" type="button">
    <svg aria-hidden="true" fill="none" height="19" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" width="19"><rect x="3.5" y="5" width="4.6" height="14" rx="1.5"/><rect x="10.2" y="5" width="4.6" height="9" rx="1.5"/><rect x="17" y="5" width="3.8" height="12" rx="1.5"/></svg>
    <span>看板</span>
  </button>
  <button class="tb-item" data-page="gh" type="button">
    <svg aria-hidden="true" fill="none" height="19" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" width="19"><circle cx="7" cy="6" r="2.1"/><circle cx="7" cy="18" r="2.1"/><circle cx="17" cy="9" r="2.1"/><path d="M7 8.1v7.8M9.2 6h4.6a3 3 0 0 1 3 3"/></svg>
    <span>仓库</span>
  </button>
  <button class="tb-item" id="tabMore" type="button">
    <svg aria-hidden="true" fill="none" height="19" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="19"><circle cx="6" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18" cy="12" r="1.4" fill="currentColor"/></svg>
    <span>更多</span>
  </button>
</nav>

<div class="drawer-mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <button class="icon-btn" id="drawerBack" style="width:27px; height:27px; display:none" title="返回上一层" aria-label="返回上一层">
      <svg aria-hidden="true" fill="none" height="13" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="13"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h3 id="drawerTitle">任务详情</h3>
    <button class="icon-btn" id="closeDrawer" style="width:27px; height:27px" aria-label="关闭弹窗">
      <svg aria-hidden="true" fill="none" height="12" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="12"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <button class="btn-primary" id="saveBtn">保存</button>
    <button class="btn-primary" id="editBtn" style="display:none">编辑</button>
    <button class="btn-ghost" id="copyBtn">交接文本</button>
    <button class="btn-primary" id="repoAddBtn" style="display:none">＋ 记录同步</button>
    <button class="btn-ghost" id="repoCopyBtn" style="display:none">复制链接</button>
    <div style="flex:1"></div>
    <button class="btn-ghost danger" id="delBtn">删除</button>
  </div>
</aside>

<div class="modal-mask" id="m2Mask"></div>
<div class="modal sm" id="machineModal">
  <div class="modal-head">
    <h3>添加电脑</h3>
    <button class="icon-btn" id="closeMachineModal" style="width:26px; height:26px" aria-label="关闭添加电脑">
      <svg aria-hidden="true" fill="none" height="12" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="12"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="modal-body pad">
    <div class="field"><label for="m_name">电脑名称</label><input id="m_name" placeholder="比如 台式机-书房"></div>
    <div class="field"><label for="m_place">位置标签（可留空）</label><input id="m_place" placeholder="比如 家 / 公司 / 随身"></div>
  </div>
  <div class="drawer-foot">
    <button class="btn-primary" id="m_save">添加</button>
    <button class="btn-ghost" id="m_cancel">取消</button>
  </div>
</div>

<div class="modal-mask" id="cMask"></div>
<div class="modal sm" id="confirmModal">
  <div class="modal-head"><h3 id="cTitle">确认</h3></div>
  <div class="modal-body pad"><div class="confirm-text" id="cText"></div></div>
  <div class="drawer-foot">
    <button class="btn-primary" id="cOk">确定</button>
    <button class="btn-ghost" id="cCancel">取消</button>
  </div>
</div>

<div class="drawer-mask" id="aiMask"></div>
<aside class="drawer wide" id="aiDrawer">
  <div class="drawer-head">
    <h3>🤖 AI 写入指南</h3>
    <button class="ghost-btn" id="aiFull" title="展开/收起完整说明" style="height:26px;padding:0 8px;font-size:11.5px">完整说明</button>
    <button class="icon-btn" id="aiClose" style="width:27px; height:27px" aria-label="关闭 AI 指南">
      <svg aria-hidden="true" fill="none" height="12" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="12"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="aiBody"></div>
  <div class="drawer-foot">
    <button class="btn-primary" id="aiCopy">复制提示词（粘给 AI）</button>
    <button class="btn-ghost" id="aiCopyEx">复制格式示例</button>
  </div>
</aside>

<div class="drawer-mask" id="impMask"></div>
<aside class="drawer wide" id="impDrawer">
  <div class="drawer-head">
    <h3>📥 批量导入</h3>
    <button class="ghost-btn" id="impFormat" title="查看输出格式说明" style="height:26px;padding:0 8px;font-size:11.5px">格式说明</button>
    <button class="icon-btn" id="impClose" style="width:27px; height:27px" aria-label="关闭批量导入">
      <svg aria-hidden="true" fill="none" height="12" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="12"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="impBody"></div>
  <div class="drawer-foot" id="impFoot"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="manage-bar" id="manageBar" style="display:none">
  <span class="m-count" id="mCount">已选 0</span>
  <div class="m-group" id="mTaskActs">
    <button data-mb="all-tasks">全选看板</button>
    <button data-mb="done">标记完成</button>
    <button data-mb="prio">优先级…</button>
    <button data-mb="move">移动到…</button>
    <button data-mb="del-tasks" class="danger">删除</button>
  </div>
  <div class="m-group" id="mGhActs">
    <button data-mb="all-gh">全选可见</button>
    <button data-mb="synced">标为已同步</button>
    <button data-mb="unsynced">标为未同步</button>
    <button data-mb="del-gh" class="danger">删除</button>
  </div>
  <button data-mb="exit">退出管理</button>
</div>

<script>
(function () {
  'use strict';

  var DATABASE_ID = 'tasks'; // Agent 任务台账
  var DB_MACHINE = 'machines'; // 机器登录态
  var DB_ACC = 'accounts'; // 登录账号（共享名单 + 每台电脑各自的登记）
  var DB_GITHUB = 'github'; // GitHub 同步记录

  var F = {
    t: { title: '任务标题', status: '状态', prio: '优先级', machine: '所在电脑', dir: '目录',
         progress: '进度', todos: '待办', handoff: '交接内容', updated: '更新时间', order: '排序' },
    m: { name: '机器名', place: '位置', wb: 'WorkBuddy账号', trae: 'TRAE账号', confirmed: '最后确认', order: '排序' },
    a: { name: '账号名', plat: '平台', mach: '所属电脑', cur: '当前', note: '备注', at: '最后确认', order: '排序' },
    g: { time: '同步时间', machine: '电脑', account: 'GitHub账号', repo: '仓库', content: '内容', versions: '同步版本', result: '是否同步', archived: '仓库归档', pinned: '仓库置顶' }
  };
  var ST_DOING = '进行中', ST_DONE = '已完成';
  var STALE_MS = 7 * 86400000; // 「久未动」阈值：进行中且 7 天没更新

  // 数据层：本地 REST 适配器（零依赖，五个方法与页面业务代码一一对应）
// API 前缀跟随页面所在路径：直连（/ 或 /index.html）→ /api/...；
// 平台反代（/tool/agent-workbench/）→ /tool/agent-workbench/api/...。
// 绝对路径 /api/... 在平台反代下会打到平台根，导致读取和添加全部 404。
var API_BASE = (function () {
  var p = location.pathname || '/';
  if (/\/[^/]*\.html?$/i.test(p)) p = p.replace(/[^/]+$/, ''); // 去掉 index.html 之类文件名
  if (p.charAt(p.length - 1) !== '/') p += '/';
  return p;
})();
function localDb() {
  function jf(url, opt) {
    return fetch(API_BASE + url, opt).then(function (r) {
      if (!r.ok) {
        // 把服务端的 error 原文带出来，失败提示才可诊断（如磁盘不可写 EACCES）
        return r.text().then(function (t) {
          var msg = 'HTTP ' + r.status;
          try { var j = JSON.parse(t); if (j && j.error) msg += '：' + j.error; } catch (e2) {}
          throw new Error(msg);
        });
      }
      return r.json();
    });
  }
  var J = { 'Content-Type': 'application/json' };
  return {
    getSchema: function (o) { return jf('api/schema?db=' + encodeURIComponent(o.databaseId)); },
    query: function (o) { return jf('api/query?db=' + encodeURIComponent(o.databaseId)); },
    addRecord: function (o) {
      return jf('api/records', { method: 'POST', headers: J, body: JSON.stringify({ db: o.databaseId, properties: o.properties }) });
    },
    updateRecord: function (o) {
      return jf('api/records/' + encodeURIComponent(o.recordId), { method: 'PATCH', headers: J, body: JSON.stringify({ db: o.databaseId, properties: o.properties }) });
    },
    deleteRecord: function (o) {
      return jf('api/records/' + encodeURIComponent(o.recordId) + '?db=' + encodeURIComponent(o.databaseId), { method: 'DELETE' });
    }
  };
}
var db = localDb();

// 写库唯一出口：页面其余部分不再直接调 db.updateRecord/addRecord/deleteRecord，
// 一律走 Repo.<表>.update / create / remove。返回 Promise，形状与 db.* 完全一致，
// 调用点的 then/catch 语义原样保留；以后要统一加更新时间、重试或写入日志，只改这里。
var Repo = (function () {
  function update(dbKey, id, props) {
    return db.updateRecord({ databaseId: dbKey, recordId: id, properties: props });
  }
  function create(dbKey, props) {
    return db.addRecord({ databaseId: dbKey, properties: props });
  }
  function remove(dbKey, id) {
    return db.deleteRecord({ databaseId: dbKey, recordId: id });
  }
  function table(dbKey) {
    return {
      update: function (id, props) { return update(dbKey, id, props); },
      create: function (props) { return create(dbKey, props); },
      remove: function (id) { return remove(dbKey, id); }
    };
  }
  return {
    update: update, create: create, remove: remove,
    tasks: table(DATABASE_ID),
    machines: table(DB_MACHINE),
    accounts: table(DB_ACC),
    github: table(DB_GITHUB)
  };
})();

  // ── 状态分域（重构第 3 步）──
  // S 只有三个域，每个字段只属于一个域，写入一律走对应的 setter；
  // 业务函数里不再对 S 的字段直接赋值，避免「谁改的、改完要不要重绘」散落各处。
  //   data：服务端真相（四张表 + schema 选项 + 是否已就绪）
  //   ui  ：本机视图状态（搜索词、视图、管理模式、弹窗与导航栈、GitHub 筛选/强度/日历）
  //   sel ：批量选择（管理模式里勾中的任务与记录）
  var S = {
    data: {
      machines: [],
      accounts: [],   // 登录账号表：一台电脑 × 一个平台可以有多条，至多一条「当前」
      tasks: [],
      gh: [],
      opts: { status: [], prio: [], wb: [], trae: [], ghResult: [] },
      ready: false
    },
    ui: {
      q: '',
      // 看板视图（单一枚举）：doing 进行中 / all 全部 / done 已完成 / att 需要关注 / todo 未勾待办
      view: 'doing',
      manage: false, // 管理模式：批量选择与批量操作
      // 弹窗（sheet）状态：单一枚举，每个值自带全部上下文，不再靠多个布尔拼装
      // kind: taskDetail 任务详情(只读) / taskForm 任务表单 / ghForm 同步记录表单 /
      //       repoDetail 仓库详情(只读) / intensity 开发强度日历
      // id 就是「当前操作对象」—— 保存/删除/复制交接都从它取，不再另存一份。
      sheet: { kind: '', id: null, repo: '' },
      // 弹窗导航栈：钻取时压入来源视图，「返回」时弹出并重绘。
      // 每项是一个完整的 sheet 描述，可直接重建成界面 —— 所以返回不需要重新查数据源。
      sheetStack: [],
      // AI 指南里选中的机器名（决定示例 payload 的「所在电脑」）。
      // 顶栏下拉与弹窗里的下拉共用它；选过就记在 localStorage，刷新后不会复位。
      aiMachine: (function () { try { return localStorage.getItem('awb.aiMachine') || ''; } catch (e) { return ''; } })(),
      ghFilter: { machine: '', unsync: false },
      ghIntensityRange: 'month', // 开发强度范围：week 本周 / month 本月 / q3 近3个月
      ghExpanded: {},
      hmYear: null, // 日历弹窗当前查看的年份（null = 打开时落到当年）
      // 日历格子里的日期数字：默认开，除非手动关过
      showHmNum: (function () { try { return localStorage.getItem('awb.hmnum') !== '0'; } catch (e) { return true; } })()
    },
    sel: { tasks: {}, gh: {} }
  };

  // 三个域的写入入口：调用点只说「改哪个字段」，不直接碰 S
  function setData(k, v) { S.data[k] = v; }
  function setUi(k, v) { S.ui[k] = v; }
  function setSel(k, v) { S.sel[k] = v; }
  // 筛选是复合状态，按「补丁」写：只传要改的键，别整对象替换（否则会丢掉另一个键）
  function setGhFilter(patch) {
    for (var k in patch) if (patch.hasOwnProperty(k)) S.ui.ghFilter[k] = patch[k];
  }
  // 仓库卡「展开全部记录」：键是仓库名，值只有 true / 不存在两种
  function toggleGhExpanded(repo) { S.ui.ghExpanded[repo] = !S.ui.ghExpanded[repo]; }


  function $(id) { return document.getElementById(id); }
  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"\x27]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function txt(v) { return (v == null) ? '' : String(v); }
  function toTime(v) {
    if (!v) return 0;
    var t = new Date(v).getTime();
    return isNaN(t) ? 0 : t;
  }
  function rel(v) {
    var t = toTime(v);
    if (!t) return '—';
    var diff = (Date.now() - t) / 1000;
    if (diff < 90) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    var d = Math.floor(diff / 86400);
    if (d < 30) return d + ' 天前';
    return Math.floor(d / 30) + ' 个月前';
  }
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast on';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 1900);
  }
  // 每条待办带上「原始行号」，勾选时只改那一行，别的行（含空行、缩进）原样保留
  function parseTodos(text) {
    var out = [], lines = txt(text).split('\n');
    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var line = raw.replace(/^\s+|\s+$/g, '');
      if (!line) continue;
      var m = line.match(/^\[(x|X|\s*)\]\s*(.*)$/);
      if (m) out.push({ done: /x/i.test(m[1]), text: m[2], line: i });
      else out.push({ done: false, text: line, line: i });
    }
    return out;
  }
  function todoStat(task) {
    var list = parseTodos(task[F.t.todos]);
    var done = 0;
    for (var i = 0; i < list.length; i++) if (list[i].done) done++;
    return { total: list.length, done: done, list: list };
  }

  function paged(fetchPage, cb) {
    var acc = [], guard = 0;
    function step(cursor) {
      if (guard > 100) { cb(acc, null); return; }
      guard++;
      fetchPage(cursor)
        .then(function (r) {
          var rows = (r && r.results) || [];
          acc = acc.concat(rows);
          var next = r && r.nextCursor;
          if (r && r.hasMore && next && next !== cursor && rows.length) step(next);
          else cb(acc, null);
        })
        .catch(function (err) {
          console.error('[workbench] 数据加载失败', err);
          cb(acc, err);
        });
    }
    step(undefined);
  }

  function loadTasks(cb) {
    paged(function (cursor) {
      return db.query({ databaseId: DATABASE_ID, pageSize: 200, startCursor: cursor });
    }, cb);
  }

  function loadMachines(cb) {
    paged(function (cursor) {
      return db.query({ databaseId: DB_MACHINE, pageSize: 200, startCursor: cursor });
    }, cb);
  }

  function loadAccounts(cb) {
    paged(function (cursor) {
      return db.query({ databaseId: DB_ACC, pageSize: 200, startCursor: cursor });
    }, cb);
  }

  function readOpts(schema, key, fieldName) {
    var props = (schema && schema.properties) || [];
    for (var i = 0; i < props.length; i++) {
      if (props[i].name === fieldName) {
        var cfg = props[i].config || {};
        var list = cfg.options || [];
        for (var j = 0; j < list.length; j++) S.data.opts[key].push(list[j].text);
      }
    }
  }

  function loadAllData(cb) {
    db.getSchema({ databaseId: DATABASE_ID }).then(function (s1) {
      readOpts(s1, 'status', F.t.status);
      readOpts(s1, 'prio', F.t.prio);
      return db.getSchema({ databaseId: DB_MACHINE });
    }).then(function (s2) {
      readOpts(s2, 'wb', F.m.wb);
      readOpts(s2, 'trae', F.m.trae);
      return db.getSchema({ databaseId: DB_GITHUB });
    }).then(function (s3) {
      readOpts(s3, 'ghResult', F.g.result);
    }).catch(function (e) {
      console.error('[workbench] schema 加载失败', e);
      // 下拉选项来自 schema：拉不到就只剩空列表，用户会以为「状态/优先级没有选项」，必须说出来
      toast('字段选项加载失败，下拉可能是空的（可刷新重试）');
    }).then(function () {
      loadMachines( function (ms, e1) {
        setData('machines', ms);
        loadAccounts( function (accs, e2) {
          setData('accounts', accs);
          loadTasks( function (ts, e3) {
            setData('tasks', ts);
            loadGithub( function (gh, e4) {
              setData('gh', gh);
              setData('ready', true);
              cb(e1 || e2 || e3 || e4);
            });
          });
        });
      });
    });
  }

  function doingTasks() {
    var out = [];
    for (var i = 0; i < S.data.tasks.length; i++) {
      if (txt(S.data.tasks[i][F.t.status]) !== ST_DONE) out.push(S.data.tasks[i]);
    }
    return out;
  }
  function doneTasks() {
    var out = [];
    for (var i = 0; i < S.data.tasks.length; i++) {
      if (txt(S.data.tasks[i][F.t.status]) === ST_DONE) out.push(S.data.tasks[i]);
    }
    return out;
  }
  function match(t) {
    if (!S.ui.q) return true;
    var q = S.ui.q.toLowerCase();
    var blob = (txt(t[F.t.title]) + ' ' + txt(t[F.t.progress]) + ' ' + txt(t[F.t.dir]) + ' ' + txt(t[F.t.handoff]) + ' ' + txt(t[F.t.todos])).toLowerCase();
    return blob.indexOf(q) >= 0;
  }
  // GitHub 侧的同名判定：一条同步记录是否命中搜索词。
  // 覆盖仓库名 / 同步内容 / 版本号 / 账号 / 电脑 / 同步状态——
  // 卡面上看得见的字都该搜得到，否则用户会以为「搜了没反应」。
  function ghMatch(r) {
    if (!S.ui.q) return true;
    var q = S.ui.q.toLowerCase();
    var blob = (txt(r[F.g.repo]) + ' ' + txt(r[F.g.content]) + ' ' + txt(r[F.g.versions]) + ' ' +
      txt(r[F.g.account]) + ' ' + txt(r[F.g.machine]) + ' ' + txt(r[F.g.result])).toLowerCase();
    return blob.indexOf(q) >= 0;
  }

  // 空看板时要说清「为什么空」，并给出一步清除的入口。
  // 依据：UI Coach Filter UX「让人能说清列表为什么短，否则筛选 UI 就失败了」；
  // Baymard「必须明确高亮当前生效的筛选，让人立刻明白结果为什么这样」。
  // 注意区分两类原因：视图（分段 + KPI 过滤）与单纯的「这台电脑没有任务」——
  // 后者不是筛选造成的，不该显示「清除筛选」。
  function emptyReason() {
    // 搜索是叠加在任意视图上的文本匹配，属于真·筛选 → 要给清除入口
    if (S.ui.q) {
      return '搜索「' + S.ui.q + '」没有匹配的任务<br>' +
        '<button class="mini" data-clear-view="1">清除搜索</button>';
    }
    // 其余情况是「这个视图下这台电脑本来就没有任务」→ 不是筛选，不给清除按钮
    if (S.ui.view === 'done') return '这台电脑下还没有已完成的任务';
    if (S.ui.view === 'att') return '这台电脑下没有需要关注的任务';
    if (S.ui.view === 'todo') return '这台电脑下没有欠账的任务';
    if (S.ui.view === 'all') return '这台电脑下还没有任务';
    return '这台电脑下没有进行中的任务';
  }

  // 列头计数的单位词：跟着当前视图走
  function viewCountUnit() {
    if (S.ui.view === 'all') return '个';
    if (S.ui.view === 'done') return '个已完成';
    if (S.ui.view === 'att') return '个需关注';
    if (S.ui.view === 'todo') return '个有欠账';
    return '个进行中';
  }

  function isStale(t) {
    if (txt(t[F.t.status]) === ST_DONE) return false;
    var u = toTime(t[F.t.updated]);
    return u > 0 && (Date.now() - u) > STALE_MS;
  }
  function staleDays(t) {
    return Math.floor((Date.now() - toTime(t[F.t.updated])) / 86400000);
  }
  // ── 视图定义：5 个合法视图，每个自带完整取数规则 ──
  //
  // 为什么是单一枚举而不是「分段 × 过滤」两维：两个维度必然能组合出无意义组合
  // （已完成 ∩ 需要关注 恒为空集），于是就得加守卫去拦截非法组合——那是补丁压补丁。
  // 守卫越多，状态越难推理，迟早出现「显示激活但内容没变」的自相矛盾状态。
  //
  // 单一枚举后合法视图只有 5 个，不存在「组合」这回事，于是不需要任何守卫。
  // 注意 att / todo 的规则本身就限定在「进行中」内 —— 它们不是叠加在分段上的过滤器，
  // 而是独立的完整视图（分段按钮对应关系见 VIEW_SEG_OF）。
  var VIEW = {
    doing: function (t) { return txt(t[F.t.status]) !== ST_DONE; },
    all:   function (t) { return true; },
    done:  function (t) { return txt(t[F.t.status]) === ST_DONE; },
    att:   function (t) {
      if (txt(t[F.t.status]) === ST_DONE) return false;
      return isStale(t) || txt(t[F.t.prio]) === 'P0';
    },
    todo:  function (t) {
      if (txt(t[F.t.status]) === ST_DONE) return false;
      var st = todoStat(t);
      return st.total > st.done;
    }
  };
  // 视图 → 分段按钮（data-s）值。att/todo 归到「进行中」分段，
  // 因为它们的取数范围就是进行中的任务。
  var VIEW_SEG_OF = { doing: '进行中', all: '全部', done: '已完成', att: '进行中', todo: '进行中' };

  // 任务是否属于当前视图。规则在 VIEW 表里，这里只做查表调用。
  function viewMatch(t) {
    return VIEW[S.ui.view](t);
  }

  function renderSummary() {
    var doing = doingTasks(), done = doneTasks();
    var att = 0, unt = 0;
    for (var i = 0; i < doing.length; i++) {
      if (isStale(doing[i]) || txt(doing[i][F.t.prio]) === 'P0') att++;
      var st = todoStat(doing[i]);
      if (st.total > st.done) unt++;
    }
    function kpi(cls, k, num, lab, hint, active) {
      return '<button class="kpi ' + cls + (active ? ' on' : '') + '" data-k="' + k + '">' +
        '<span class="num">' + num + '</span><span class="lab">' + lab + '</span>' +
        (hint ? '<span class="hint">' + hint + '</span>' : '') + '<' + '/button>';
    }
    // KPI 卡片的高亮 = 它是否就是当前视图：
    //   「进行中」→ 当前是进行中视图且没有二级过滤
    //   「需要关注 / 未勾待办」→ 当前生效的 KPI 过滤
    //   「已完成」→ 当前是已完成视图
    // 这样任何时刻只有一个卡片亮起，用户一眼知道自己在哪个视图里。
    // KPI 卡片高亮 = 它对应的视图就是当前视图。任何时刻最多一个亮起。
    var hAtt = att ? 'P0 · 久未动' : '';
    var hTodo = '点击筛选';
    var hDone = S.ui.view === 'done' ? '当前视图' : '点击切换视图';
    $('summary').innerHTML = '<div class="kpis">' +
      kpi('', '', doing.length, '进行中', '默认视图', S.ui.view === 'doing') +
      kpi('alert', 'att', att, '需要关注', hAtt, S.ui.view === 'att') +
      kpi('warn', 'todo', unt, '未勾待办', hTodo, S.ui.view === 'todo') +
      kpi('good', 'done', done.length, '已完成', hDone, S.ui.view === 'done') +
      '<' + '/div>';
  }

  // 账号池：一台电脑 × 一个平台可以有多条，至多一条「当前」
  function accPlat(key) { return key === 'wb' ? 'WorkBuddy' : 'TRAE'; }

  function accPool(machineName, plat) {
    var out = [];
    for (var i = 0; i < S.data.accounts.length; i++) {
      var a = S.data.accounts[i];
      if (txt(a[F.a.mach]) === machineName && txt(a[F.a.plat]) === plat) out.push(a);
    }
    out.sort(function (x, y) {
      var ox = typeof x[F.a.order] === 'number' ? x[F.a.order] : 9999;
      var oy = typeof y[F.a.order] === 'number' ? y[F.a.order] : 9999;
      return ox - oy;
    });
    return out;
  }

  // 共享账号池：账号是全局共享的一份名单（同一平台按账号名去重），
  // 每台电脑只是「我现在用的是哪个号」。面板列全库，改名全库同步，删除只解除本机登记。
  function accShared(plat, machineName) {
    var map = {}, out = [];
    for (var i = 0; i < S.data.accounts.length; i++) {
      var a = S.data.accounts[i];
      if (txt(a[F.a.plat]) !== plat) continue;
      var nm = txt(a[F.a.name]);
      if (!nm || nm === '未登录') continue;
      if (!map[nm]) {
        map[nm] = { name: nm, recs: [], mine: null, others: [], curOthers: [], cur: false };
        out.push(map[nm]);
      }
      var e = map[nm];
      e.recs.push(a);
      if (txt(a[F.a.mach]) === machineName) {
        e.mine = a;
        if (a[F.a.cur] === true) e.cur = true;
      } else {
        var om = txt(a[F.a.mach]);
        if (e.others.indexOf(om) < 0) e.others.push(om);
        // 别的电脑也把这个号设成「当前」→ 同一个号被多台同时登录，需要醒目标出来
        if (a[F.a.cur] === true && e.curOthers.indexOf(om) < 0) e.curOthers.push(om);
      }
    }
    out.sort(function (x, y) {
      if (x.cur !== y.cur) return x.cur ? -1 : 1;
      if (!!x.mine !== !!y.mine) return x.mine ? -1 : 1;
      return x.name < y.name ? -1 : (x.name > y.name ? 1 : 0);
    });
    return out;
  }

  function currentAcc(machineName, plat) {
    var p = accPool(machineName, plat);
    for (var i = 0; i < p.length; i++) if (p[i][F.a.cur] === true) return p[i];
    return null;
  }

  function findAcc(id) {
    for (var i = 0; i < S.data.accounts.length; i++) if (S.data.accounts[i]._id === id) return S.data.accounts[i];
    return null;
  }

  function accPill(m, key) {
    var plat = accPlat(key);
    var name = txt(m[F.m.name]);
    var label = key === 'wb' ? 'WB' : 'TRAE';
    var cur = currentAcc(name, plat);
    // 账号表是唯一真相：没有「当前」就是未登录，不能拿机器记录里的旧派生值兜底，
    // 否则清除登录态后胶囊还挂着上一个名字（数据已经空了）
    var val = cur ? txt(cur[F.a.name]) : (S.data.ready ? '' : txt(m[key === 'wb' ? F.m.wb : F.m.trae]));
    var shared = accShared(plat, name);
    var n = shared.length;
    // 同一个账号在别的电脑上也是「当前」= 一号多机同时登录，胶囊要醒目告警
    var conflict = [];
    if (cur) {
      for (var ci = 0; ci < shared.length; ci++) {
        if (shared[ci].name === val) { conflict = shared[ci].curOthers; break; }
      }
    }
    var empty = (!val || val === '未登录');
    var tip = conflict.length
      ? '同一个账号在「' + conflict.join(' / ') + '」也是当前 —— 多台电脑同时登录同一个号'
      : (empty ? '登记这个平台登录过的账号' : '切换 / 管理账号');
    return '<button class="acc ' + (empty ? 'empty' : '') + (conflict.length ? ' conflict' : '') +
      '" data-switch="' + escapeHtml(m._id) + ':' + key + '" title="' + escapeHtml(tip) + '">' +
      '<span class="led"></span><span class="pf">' + label + '<' + '/span>' +
      '<span class="an">' + (empty ? '未登录' : escapeHtml(val)) + '</span>' +
      ((n > 1 || (n && empty)) ? '<span class="cnt">' + n + '</span>' : '') +
      (conflict.length ? '<span class="excl" aria-hidden="true">!</span>' : '') + '</button>';
  }

  function cardHTML(t) {
    var st = todoStat(t);
    var isDone = txt(t[F.t.status]) === ST_DONE;
    var pct = st.total ? Math.round(st.done / st.total * 100) : 0;
    // v16 卡面瘦身：标题 / 元数据行 / 进度一句话 / 待办进度条；操作按钮 hover 才出现
    var meta =
      '<span class="prio ' + escapeHtml(txt(t[F.t.prio])).toLowerCase() + '">' + escapeHtml(txt(t[F.t.prio]) || '—') + '<' + '/span>' +
      '<span class="c-mach">🖥 ' + escapeHtml(txt(t[F.t.machine]) || '未指定') + '<' + '/span>' +
      '<span class="c-age">' + rel(t[F.t.updated]) + '<' + '/span>' +
      (!isDone && isStale(t) ? '<span class="stale">久未动 ' + staleDays(t) + ' 天</span>' : '');
    var prog = txt(t[F.t.progress])
      ? '<div class="c-prog">' + escapeHtml(t[F.t.progress]) + '<' + '/div>' : '';
    var todo = st.total
      ? '<div class="c-todo"><div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<span class="tnum">' + st.done + '/' + st.total + ' 待办</span></div>' : '';
    return '<div class="card' + (txt(t[F.t.prio]) === 'P0' && !isDone ? ' p0' : '') + (isDone ? ' done' : '') +
        '" data-task-id="' + escapeHtml(t._id) + '" data-open="' + escapeHtml(t._id) + '"' +
        ' tabindex="0" role="button" aria-label="打开任务详情：' + escapeHtml(txt(t[F.t.title])) + '"' +
        ' draggable="' + (isDone || S.ui.manage ? 'false' : 'true') + '">' +
      '<span class="sel-box">✓</span>' +
      '<div class="c-title" title="点击查看详情">' + escapeHtml(t[F.t.title]) + '<' + '/div>' +
      '<div class="c-meta">' + meta + '<' + '/div>' +
      prog + todo +
      '<div class="c-actions">' +
        '<button class="mini" data-copy="' + escapeHtml(t._id) + '">复制交接</button>' +
        '<button class="mini" data-edit-task="' + escapeHtml(t._id) + '">编辑</button>' +
        '<button class="dots" data-task-menu="' + escapeHtml(t._id) + '" title="更多操作">⋯</button>' +
      '<' + '/div>' +
    '<' + '/div>';
  }

  function sortedMachines() {
    var arr = [];
    for (var i = 0; i < S.data.machines.length; i++) arr.push(S.data.machines[i]);
    arr.sort(function (a, b) {
      var na = (typeof a[F.m.order] === 'number') ? a[F.m.order] : 9999;
      var nb = (typeof b[F.m.order] === 'number') ? b[F.m.order] : 9999;
      if (na !== nb) return na - nb;
      return txt(a[F.m.name]) < txt(b[F.m.name]) ? -1 : 1;
    });
    return arr;
  }

  function byOrder(a, b) {
    var oa = (typeof a[F.t.order] === 'number') ? a[F.t.order] : 9999;
    var ob = (typeof b[F.t.order] === 'number') ? b[F.t.order] : 9999;
    if (oa !== ob) return oa - ob;
    var pa = txt(a[F.t.prio]), pb = txt(b[F.t.prio]);
    if (pa !== pb) return pa < pb ? -1 : 1;
    return toTime(b[F.t.updated]) - toTime(a[F.t.updated]);
  }

  function renderBoard() {
    // 视图决定取哪些任务：doing 进行中 / all 全部 / done 已完成 / att 需要关注 / todo 未勾待办
    var list = S.data.tasks.slice();
    var host = $('board');
    var out = '';
    var machines = sortedMachines();
    for (var i = 0; i < machines.length; i++) {
      var m = machines[i];
      var items = [];
      for (var j = 0; j < list.length; j++) {
        if (txt(list[j][F.t.machine]) === txt(m[F.m.name]) && match(list[j]) && viewMatch(list[j])) items.push(list[j]);
      }
      items.sort(byOrder);
      var body = '';
      if (!items.length) {
        body = '<div class="col-empty">' + emptyReason() + '<' + '/div>';
      } else {
        for (var n = 0; n < items.length; n++) body += cardHTML(items[n]);
      }
      out += '<section class="col" data-machine-id="' + escapeHtml(m._id) + '">' +
        '<div class="col-head">' +
          '<div class="ch-top">' +
            '<span class="drag-handle" draggable="true" title="拖动调整顺序">⠿</span>' +
            '<span class="ch-name" data-edit="machineName" data-id="' + escapeHtml(m._id) + '" title="点击可直接改名">' + escapeHtml(m[F.m.name]) + '<' + '/span>' +
            (m[F.m.place]
              ? '<span class="ch-place" data-edit="machinePlace" data-id="' + escapeHtml(m._id) + '" title="点击可改位置标签">' + escapeHtml(m[F.m.place]) + '<' + '/span>'
              : '<span class="ch-place empty" data-edit="machinePlace" data-id="' + escapeHtml(m._id) + '" title="点击添加位置标签">＋位置<' + '/span>') +
            '<span class="ch-count"><b>' + items.length + '</b> ' + viewCountUnit() + '<' + '/span>' +
            '<button class="dots" data-machine-menu="' + escapeHtml(m._id) + '" title="机器操作">⋯</button>' +
          '<' + '/div>' +
          '<div class="ch-acc">' + accPill(m, 'wb') + accPill(m, 'trae') + '<' + '/div>' +
        '<' + '/div>' +
        '<div class="col-body">' + body + '<' + '/div>' +
      '<' + '/section>';
    }
    // 兜底列：所在电脑对不上任何一台已登记电脑的任务，不能就这么从看板上消失（P-05/P-06）
    var known = {};
    for (var q = 0; q < machines.length; q++) known[txt(machines[q][F.m.name])] = 1;
    var orphans = [];
    for (var w = 0; w < list.length; w++) {
      if (!known[txt(list[w][F.t.machine])] && match(list[w]) && viewMatch(list[w])) orphans.push(list[w]);
    }
    if (orphans.length) {
      orphans.sort(byOrder);
      var obody = '';
      for (var oi = 0; oi < orphans.length; oi++) obody += cardHTML(orphans[oi]);
      out += '<section class="col col-orphan">' +
        '<div class="col-head">' +
          '<div class="ch-top">' +
            '<span class="ch-name">未识别电脑</span>' +
            '<span class="ch-count"><b>' + orphans.length + '</b> 个待归位</span>' +
          '<' + '/div>' +
          '<div class="ch-acc"><span class="orphan-hint">「所在电脑」对不上任何一台，点卡片改掉</span></div>' +
        '<' + '/div>' +
        '<div class="col-body">' + obody + '<' + '/div>' +
      '<' + '/section>';
    }
    if (!machines.length && !orphans.length) {
      out = '<div class="col"><div class="col-body"><div class="col-empty">还没有登记电脑，点右上角「＋ 新增 → 添加电脑」加一台。</div></div></div>';
    }
    host.innerHTML = out;
  }

  function render() {
    renderSummary();
    renderBoard();
    renderGithub();
    renderAiQuick(); // 顶栏快捷指南的电脑下拉：机器增删改名后跟着刷新
    syncSel();
