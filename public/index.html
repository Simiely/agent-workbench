  function findTask(id) {
    for (var i = 0; i < S.data.tasks.length; i++) if (S.data.tasks[i]._id === id) return S.data.tasks[i];
    return null;
  }

  /* ===================== GitHub 同步板块 ===================== */
  function loadGithub(cb) {
    paged(function (cursor) {
      return db.query({ databaseId: DB_GITHUB, pageSize: 200, startCursor: cursor });
    }, cb);
  }
  function ghRecId(r) { return r && (r._id || r.id); }
  function normDate(v) {
    if (v == null) return null;
    if (typeof v === 'string') return v;
    if (typeof v === 'object') {
      if (v.value != null) return v.value;
      if (v.date != null) return v.date;
      if (v.text != null) return v.text;
    }
    return v;
  }
  function fmtDateTime(v) {
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function toLocalInput(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // 仓库分组。分两步：先按全量记录聚出仓库级属性（归档 / 置顶 / 都涉及哪些电脑），
  // 再按搜索词裁切 g.records（卡里真正显示的记录）。
  // 这么拆是为了让「仓库级」属性不被搜索抹掉——某条记录被搜掉了，
  // 但仓库已归档 / 已置顶 / 在这台电脑上同步过，这些事实不该跟着消失。
  function ghRepoGroups(allMode) {
    var map = {}, arr = [];
    for (var i = 0; i < S.data.gh.length; i++) {
      var r = S.data.gh[i];
      var name = txt(r[F.g.repo]) || '未命名仓库';
      if (!map[name]) {
        map[name] = { name: name, all: [], records: [], latest: 0, versions: [], machines: [], accounts: [], archived: false, pinned: false };
        arr.push(map[name]);
      }
      var g = map[name];
      g.all.push(r);
      var t = toTime(normDate(r[F.g.time]));
      if (t > g.latest) g.latest = t;
      var mc = txt(r[F.g.machine]); if (mc && g.machines.indexOf(mc) < 0) g.machines.push(mc);
      if (r[F.g.archived]) g.archived = true; // 仓库归档是仓库级属性：任一条记录勾了就算
      if (r[F.g.pinned]) g.pinned = true;     // 置顶同理：任一条记录勾了就算
    }
    // 排序：置顶优先，其余（以及置顶之间）都按最近更新时间倒序。
    // 用全量 latest 排序，搜索时仓库的先后顺序不会跳来跳去。
    arr.sort(function (a, b) {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return b.latest - a.latest;
    });
    var out = [];
    for (var k = 0; k < arr.length; k++) {
      var g = arr[k];
      // allMode：给「现状骨架」用的全量口径。复制提示词时可能正开着搜索 / 机器筛选，
      // 若沿用过滤后的结果，AI 拿到的仓库清单会缺一大块，进而把已存在的仓库判成新建。
      if (allMode) {
        g.records = g.all.slice();
        g.records.sort(function (a, b) { return toTime(normDate(b[F.g.time])) - toTime(normDate(a[F.g.time])); });
        g.versions = []; g.accounts = []; g.machines = [];
        for (var ai = 0; ai < g.records.length; ai++) {
          var ar = g.records[ai];
          var avs = txt(ar[F.g.versions]).split(/[\n,，]/);
          for (var avi = 0; avi < avs.length; avi++) {
            var av = avs[avi].replace(/^\s+|\s+$/g, '');
            if (av && g.versions.indexOf(av) < 0) g.versions.push(av);
          }
          var aac = txt(ar[F.g.account]); if (aac && g.accounts.indexOf(aac) < 0) g.accounts.push(aac);
          var amc = txt(ar[F.g.machine]); if (amc && g.machines.indexOf(amc) < 0) g.machines.push(amc);
        }
        out.push(g);
        continue;
      }
      // 机器筛选走全量口径：电脑改名 / 删除后，历史记录仍挂在旧名上，
      // 只看可见记录的话这些仓库就永远筛不到。
      if (S.ui.ghFilter.machine && g.machines.indexOf(S.ui.ghFilter.machine) < 0) continue;
      // 搜索：仓库名本身命中 → 整个仓库都算命中（看的是这个仓库的全部历史）；
      // 否则只留下命中的记录，卡面才对得上用户搜的那个词。
      var nameHit = !!S.ui.q && g.name.toLowerCase().indexOf(S.ui.q.toLowerCase()) >= 0;
      g.records = nameHit ? g.all.slice() : g.all.filter(ghMatch);
      if (!g.records.length) continue;
      g.records.sort(function (a, b) { return toTime(normDate(b[F.g.time])) - toTime(normDate(a[F.g.time])); });
      // 版本 / 账号 / 电脑按「可见记录」重算：搜 v1.5.8 时不该冒出一堆没搜到的版本号
      g.versions = []; g.accounts = []; g.machines = [];
      for (var ri = 0; ri < g.records.length; ri++) {
        var rr = g.records[ri];
        var vs = txt(rr[F.g.versions]).split(/[\n,，]/);
        for (var vi = 0; vi < vs.length; vi++) {
          var v = vs[vi].replace(/^\s+|\s+$/g, '');
          if (v && g.versions.indexOf(v) < 0) g.versions.push(v);
        }
        var ac = txt(rr[F.g.account]); if (ac && g.accounts.indexOf(ac) < 0) g.accounts.push(ac);
        var m2 = txt(rr[F.g.machine]); if (m2 && g.machines.indexOf(m2) < 0) g.machines.push(m2);
      }
      out.push(g);
    }
    return out;
  }

  function resClass(v) {
    // v16 语义：是否同步。兼容历史遗留值（成功→已同步，其余一律按未同步）
    if (v === '已同步' || /成功/.test(v)) return 'ok';
    if (!v) return '';
    return 'un';
  }

  function repoEntryHTML(r) {
    var d = normDate(r[F.g.time]);
    var vs = txt(r[F.g.versions]).split(/[\n,，]/).map(function (s) { return s.replace(/^\s+|\s+$/g, ''); }).filter(function (s) { return s; });
    var res = txt(r[F.g.result]);
    var resHtml = res ? '<span class="re-res ' + resClass(res) + '">' + escapeHtml(res) + '<' + '/span>' : '';
    return '<div class="repo-entry" data-gh-id="' + escapeHtml(ghRecId(r)) + '">' +
      '<span class="sel-box">✓</span>' +
      '<span class="re-time">' + (d ? fmtDateTime(d).slice(5) : '—') + '<' + '/span>' +
      '<span class="re-ver" title="' + escapeHtml(vs.join(' / ')) + '">' + escapeHtml(vs.join(' / ') || '—') + '<' + '/span>' +
      resHtml +
      '<span class="re-who" title="' + escapeHtml((txt(r[F.g.account]) || '') + (txt(r[F.g.machine]) ? ' · ' + txt(r[F.g.machine]) : '')) + '">' +
        escapeHtml((txt(r[F.g.account]) || '') + (txt(r[F.g.machine]) ? ' · ' + txt(r[F.g.machine]) : '')) + '<' + '/span>' +
      '<span class="re-content">' + escapeHtml(txt(r[F.g.content]) || '') + '<' + '/span>' +
      '<button class="dots re-dots" data-gh-menu="' + escapeHtml(ghRecId(r)) + '" title="操作">⋯</button>' +
    '<' + '/div>';
  }

  /* ── 仓库详情（只读）──
     记录优先模式的延伸：点仓库卡 → 先看这个仓库的整体情况（统计/版本/全部记录），
     要改哪一条再点那条记录进编辑态。跟任务详情是同一套交互逻辑。 */
  function renderRepoDetail(repoName) {
    var g = null;
    var groups = ghRepoGroups();
    for (var i = 0; i < groups.length; i++) if (groups[i].name === repoName) { g = groups[i]; break; }
    if (!g) { toast('这个仓库下没有记录'); return false; }
    $('drawerTitle').textContent = repoName;
    setSheetFoot({ save: false, edit: false, copy: false, repoAdd: true, repoCopy: true, del: false });

    var unsync = 0;
    for (var f = 0; f < g.records.length; f++) if (txt(g.records[f][F.g.result]) === '未同步') unsync++;

    var html = '';
    // 概要：最近同步 / 记录数 / 未同步数 / 归档状态
    html += '<div class="dt-sec">' +
      '<div class="dt-tags">' +
        '<span class="dt-tag">' + g.records.length + ' 条记录</span>' +
        (unsync ? '<span class="dt-tag prio-p1">' + unsync + ' 条未同步</span>' : '') +
        (g.archived ? '<span class="dt-tag">已归档</span>' : '') +
        (g.pinned ? '<span class="dt-tag">已置顶</span>' : '') +
        (g.latest ? '<span class="dt-tag">最近 ' + escapeHtml(fmtDateTime(g.latest)) + '</span>' : '') +
      '<' + '/div>' +
      (g.machines.length || g.accounts.length ?
        '<div class="dt-meta" style="margin-top:9px">' +
          g.machines.map(function (m) { return '<span>🖥 ' + escapeHtml(m) + '</span>'; }).join('') +
          g.accounts.map(function (a) { return '<span>@' + escapeHtml(a) + '</span>'; }).join('') +
        '<' + '/div>' : '') +
    '<' + '/div>';

    // 版本
    if (g.versions.length) {
      html += '<div class="dt-sec"><div class="dt-label">版本</div><div class="repo-vers">' +
        g.versions.map(function (v) { return '<span class="gh-ver">v <b>' + escapeHtml(v.replace(/^v/i, '')) + '</b></span>'; }).join('') +
        '<' + '/div><' + '/div>';
    }

    // 全部同步记录（倒序），点一条 → 进那条记录的编辑态。
    // 搜索生效时这里只有命中的记录，标签跟着改，否则「全部记录：1 条」会让人以为数据丢了。
    html += '<div class="dt-sec"><div class="dt-label">' + (S.ui.q ? '匹配的记录' : '全部记录') + '</div><div class="rd-list">';
    for (var r = 0; r < g.records.length; r++) {
      var rec = g.records[r];
      var d = normDate(rec[F.g.time]);
      var vs = txt(rec[F.g.versions]).split(/[\n,，]/).map(function (s) { return s.replace(/^\s+|\s+$/g, ''); }).filter(function (s) { return s; });
      var res = txt(rec[F.g.result]);
      html += '<button class="rd-row" data-gh-open="' + escapeHtml(ghRecId(rec)) + '">' +
        '<span class="rd-time">' + (d ? escapeHtml(fmtDateTime(d)) : '—') + '<' + '/span>' +
        '<span class="rd-ver" title="' + escapeHtml(vs.join(' / ')) + '">' + escapeHtml(vs.join(' / ') || '—') + '<' + '/span>' +
        '<span class="re-res ' + resClass(res) + '">' + escapeHtml(res || '—') + '<' + '/span>' +
        '<span class="rd-content">' + escapeHtml(txt(rec[F.g.content]) || '（无内容）') + '<' + '/span>' +
        '<span class="rd-chev">›</span>' +
      '<' + '/button>';
    }
    html += '<' + '/div><' + '/div>';

    $('drawerBody').innerHTML = html;
    return true;
  }

  function repoCardHTML(g) {
    var expanded = !!S.ui.ghExpanded[g.name];
    var shown = expanded ? g.records : g.records.slice(0, 3);
    var verHtml = '';
    var vers = g.versions.slice(0, 8);
    for (var i = 0; i < vers.length; i++) verHtml += '<span class="gh-ver">v <b>' + escapeHtml(vers[i].replace(/^v/i, '')) + '<' + '/b></span>';
    if (!verHtml) verHtml = '<span class="gh-ver">—</span>';
    var metaHtml = '';
    for (var m = 0; m < g.machines.length; m++) metaHtml += '<span class="badge">🖥 ' + escapeHtml(g.machines[m]) + '<' + '/span>';
    for (var a = 0; a < g.accounts.length; a++) metaHtml += '<span class="badge">@' + escapeHtml(g.accounts[a]) + '<' + '/span>';
    var rows = '';
    for (var e = 0; e < shown.length; e++) rows += repoEntryHTML(shown[e]);
    var latestStr = g.latest ? fmtDateTime(g.latest) : '—';
    var ageStr = g.latest ? rel(g.latest) : '';
    var moreBtn = g.records.length > 3 ? '<button class="link-btn" data-repo-toggle="' + escapeHtml(g.name) + '">' + (expanded ? '收起' : '查看全部 ' + g.records.length + ' 条') + '<' + '/button>' : '';
    var unsync = 0;
    for (var f = 0; f < g.records.length; f++) {
      if (txt(g.records[f][F.g.result]) === '未同步') unsync++;
    }
    var unsyncHtml = unsync ? '<span class="repo-unsync">' + unsync + ' 条未同步<' + '/span>' : '';
    // 整卡可点：判定范围挂在卡片容器上，跟任务看板的 .card 一样。
    // 仓库名降级为纯文本（不再单独可点），复制链接独立成按钮。
    return '<div class="repo-card' + (g.pinned ? ' pinned' : '') + '" data-repo="' + escapeHtml(g.name) + '" data-repo-open="' + escapeHtml(g.name) + '"' +
      ' tabindex="0" role="button" aria-label="打开仓库详情：' + escapeHtml(g.name) + '" title="点击查看仓库详情">' +
      '<div class="repo-head">' +
        '<span class="repo-name">' + escapeHtml(g.name) + '</span>' +
        unsyncHtml +
        '<span class="repo-count">' + g.records.length + ' 条' + '<' + '/span>' +
        (g.archived ? '<span class="archtag">已归档<' + '/span>' : '') +
        '<button class="repo-copy" data-copy-repo="https://github.com/' + escapeHtml(g.name) + '" title="复制仓库链接">⧉ 复制链接</button>' +
        '<button class="repo-pin' + (g.pinned ? ' on' : '') + '" data-pin-repo="' + escapeHtml(g.name) + '"' +
          ' title="' + (g.pinned ? '取消置顶' : '置顶：置顶的仓库排在最前') + '">' + (g.pinned ? '已置顶' : '置顶') + '</button>' +
        '<button class="repo-del" data-mb="del-repo" data-repo="' + escapeHtml(g.name) + '" title="删除该仓库的全部同步记录">删整仓</button>' +
      '<' + '/div>' +
      '<div class="repo-sub">最近 ' + escapeHtml(latestStr) + (ageStr ? '<span class="sub">' + escapeHtml(ageStr) + '<' + '/span>' : '') + '<' + '/div>' +
      '<div class="repo-vers">' + verHtml + '<' + '/div>' +
      '<div class="repo-meta">' + metaHtml + '<' + '/div>' +
      '<div class="repo-entries">' + rows + '<' + '/div>' +
      '<div class="repo-foot">' + moreBtn + '<button class="link-btn" data-repo-add="' + escapeHtml(g.name) + '">＋ 记录同步<' + '/button>' + '<' + '/div>' +
    '<' + '/div>';
  }

  // ===== 开发强度 =====
  // 按天统计「有更新的仓库数」（同一仓库当天多次同步只算一次）。
  // 返回 { 'YYYY-MM-DD': { n: 去重仓库数, repos: [仓库名] } }，头部柱状图与全年日历共用。
  function ghDailyMap() {
    var byDay = {};
    for (var i = 0; i < S.data.gh.length; i++) {
      var r = S.data.gh[i];
      var t = toTime(normDate(r[F.g.time]));
      if (!t) continue;
      var d = new Date(t);
      var key = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      if (!byDay[key]) byDay[key] = { repos: {} };
      var repo = txt(r[F.g.repo]) || '未命名仓库';
      byDay[key].repos[repo] = 1;
    }
    var out = {};
    for (var k in byDay) {
      var names = Object.keys(byDay[k].repos);
      out[k] = { n: names.length, repos: names };
    }
    return out;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  // ===== 开发强度 · 头部 =====
  // 三种范围都是「完整周期」，可能包含未来几天（未来画灰格、不写数字）：
  //   week  本周    = 本周一 ~ 本周日（恒 7 格）
  //   week  本周    = 1 排，周一 ~ 周日（恒 7 格）
  //   month 本月    = 2 排，上半月(1~15) / 下半月(16~月末)，合计画满整月
  //   q3    近3个月 = 3 排，最近 3 个自然月各一排（含本月，new Date 负月自动进位）
  // 单一入口 giRangeRows(range) 返回 [{start, end, label}]，渲染与测试都只认它。
  function giRangeRows(range) {
    var DAY = 86400000;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var ts = today.getTime();
    var wd = (today.getDay() + 6) % 7; // 周一 = 0
    if (range === 'week') return [{ start: ts - wd * DAY, end: ts + (6 - wd) * DAY, label: '本周' }];
    if (range === 'month') {
      var y = today.getFullYear(), m = today.getMonth();
      return [
        { start: new Date(y, m, 1).getTime(), end: new Date(y, m, 15).getTime(), label: '上半月' },
        { start: new Date(y, m, 16).getTime(), end: new Date(y, m + 1, 0).getTime(), label: '下半月' }
      ];
    }
    var rows = [];
    for (var i = 2; i >= 0; i--) {
      var yy = today.getFullYear(), mm = today.getMonth() - i;
      rows.push({ start: new Date(yy, mm, 1).getTime(), end: new Date(yy, mm + 1, 0).getTime(), label: (mm + 1) + '月' });
    }
    return rows;
  }
  function giLevel(n) { return n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n === 3 ? 3 : 4; }

  // 格内小日期的标注规则：只在「能当定位锚点」的格子上写，其余留白，
  // 避免每格都挤一个小数字（格子一窄就糊成一团，反而看不清周期位置）。
  //   week  本周    = 恒 7 格且恒从周一起，所以按序位标：第 3 格写「3」、第 7 格写「天」
  //   month 本月    = 每排只在「周一」写日期数字，一眼看出每排从哪天断开
  //   q3    近3个月 = 同上，每排只在周一写日期数字
  // 大数字（当天更新的仓库数）不受影响，照旧写。
  function giDayMark(range, idxInRow, d) {
    if (range === 'week') {
      if (idxInRow === 2) return '3';    // 第 3 格 = 周三
      if (idxInRow === 6) return '天';   // 第 7 格 = 周日
      return '';
    }
    return d.getDay() === 1 ? String(d.getDate()) : ''; // 周一
  }

  // 头部右侧的区间说明（替代原来那个「点开看全年日历」按钮）：
  //   本周   → 10月 第5周     （第几周按该月天数算，1~7 为第 1 周）
  //   本月   → 10月           （当前是第几个月）
  //   近3个月 → 8月~10月       （跨年时起点补年份）
  function giRangeLabel(range) {
    var today = new Date();
    var mo = today.getMonth() + 1;
    if (range === 'week') return mo + '月 第' + Math.ceil(today.getDate() / 7) + '周';
    if (range === 'month') return mo + '月';
    var rows = giRangeRows('q3');
    if (!rows.length) return '';
    var a = new Date(rows[0].start), b = new Date(rows[rows.length - 1].end);
    var s = (a.getMonth() + 1) + '月';
    if (a.getFullYear() !== b.getFullYear()) s = a.getFullYear() + '年' + s;
    return s + '~' + (b.getMonth() + 1) + '月';
  }

  // 数字自适应：格子有多大数字就多大（短边的约 45%，夹在 9~20px），写入面板级 CSS 变量。
  // 拖动分隔条 / 放大本栏 / 窗口缩放都会经 ResizeObserver 重新触发。
  function fitGiNum() {
    var host = $('ghIntensity');
    if (!host) return;
    var cell = host.querySelector('.gi-cell:not(.future)') || host.querySelector('.gi-cell');
    if (!cell) return;
    var r = cell.getBoundingClientRect();
    if (r.width < 4 || r.height < 4) return;
    // 高度上给格内小日期（约 10px）留位，再按短边 45% 取字号
    var size = Math.max(9, Math.min(20, Math.round(Math.min(r.width, r.height - 12) * 0.45)));
    host.style.setProperty('--gi-num', size + 'px');
  }

  // 头部：多排方块格子热力（每排一段日期，旧 → 新，周期末日在最右），有更新的格子写数字。
  // 点面板任意处（范围按钮除外）→ 打开全年日历弹窗。
  function renderGhIntensity() {
    var host = $('ghIntensity');
    if (!host) return;
    // 高度与任务看板的 KPI 四方块（2×2 + 间距）对齐：动态读取，不硬编码
    var kEl = document.querySelector('#summary .kpis');
    if (kEl && kEl.offsetHeight > 0) host.style.minHeight = (kEl.offsetHeight + 12) + 'px'; // +12 = KPI 块的 margin-bottom

    var head = '<div class="gi-head">' +
      '<div class="gi-label"><b>开发强度</b><span>每天更新的仓库数</span></div>' +
      '<div class="gi-ranges">' +
        '<button class="gi-range' + (S.ui.ghIntensityRange === 'week' ? ' on' : '') + '" data-gi-range="week">本周</button>' +
        '<button class="gi-range' + (S.ui.ghIntensityRange === 'month' ? ' on' : '') + '" data-gi-range="month">本月</button>' +
        '<button class="gi-range' + (S.ui.ghIntensityRange === 'q3' ? ' on' : '') + '" data-gi-range="q3">近3个月</button>' +
      '<' + '/div>' +
      '<span class="gi-when">' + escapeHtml(giRangeLabel(S.ui.ghIntensityRange)) + '</span>' +
      '<' + '/div>';

    var map = ghDailyMap();
    var DAY = 86400000;
    var todayTs = new Date(); todayTs.setHours(0, 0, 0, 0); todayTs = todayTs.getTime();
    var rows = giRangeRows(S.ui.ghIntensityRange);

    var hasData = false;
    for (var r = 0; r < rows.length && !hasData; r++) {
      for (var ts0 = rows[r].start; ts0 <= rows[r].end; ts0 += DAY) {
        var e0 = map[dayKey(ts0)];
        if (e0 && e0.n > 0) { hasData = true; break; }
      }
    }
    if (!hasData) {
      host.innerHTML = head + '<div class="gi-empty">这段时间还没有同步记录，写一笔就能看到每天的更新强度。</div>';
      return;
    }

    var body = '';
    for (var r2 = 0; r2 < rows.length; r2++) {
      var row = rows[r2];
      var cells = '';
      for (var i = 0, ts = row.start; ts <= row.end; i++, ts += DAY) {
        var key = dayKey(ts);
        var en = map[key];
        var n = en ? en.n : 0;
        var future = ts > todayTs;
        var lv = giLevel(n);
        // 小日期只在锚点格写（见 giDayMark）；有更新的格子再叠大数字
        var dl = new Date(ts);
        var mark = giDayMark(S.ui.ghIntensityRange, i, dl);
        var inner = (mark ? '<em>' + mark + '</em>' : '') + ((!future && n) ? '<i>' + n + '</i>' : '');
        var tip = future ? key.slice(5) + ' · 还没到' : key.slice(5) + (n ? ' · 更新 ' + n + ' 个仓库' : ' · 无更新');
        cells += '<span class="gi-cell l' + lv + (future ? ' future' : '') + '" data-gi-day="' + key + '" data-gi-n="' + n + '"' +
          ' title="' + tip + '">' + inner + '<' + '/span>';
      }
      body += '<div class="gi-rowblock">' +
        '<span class="gi-rowlabel">' + row.label + '</span>' +
        '<div class="gi-chart">' + cells + '<' + '/div>' +
        '<' + '/div>';
    }
    host.innerHTML = head + '<div class="gi-rows">' + body + '<' + '/div>';
    requestAnimationFrame(fitGiNum);
  }

  // 弹窗：按年展示的日历热力图（GitHub contributions 风格），可切换年份。
  // 行 = 周一到周日，列 = 周；格子颜色分 5 档；可开「显示数字」；悬停显示当天更新的仓库。
  function renderIntensitySheet() {
    $('drawerTitle').textContent = '开发强度 · 日历';
    setSheetFoot({ save: false, edit: false, copy: false, repoAdd: false, repoCopy: false, del: false });
    var map = ghDailyMap();
    var DAY = 86400000;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var thisYear = today.getFullYear();
    if (typeof S.ui.hmYear !== 'number' || S.ui.hmYear > thisYear) setUi('hmYear', thisYear);
    var yearStart = new Date(S.ui.hmYear, 0, 1).getTime();
    var yearEnd = new Date(S.ui.hmYear, 11, 31).getTime();
    var end = yearEnd; // 每一年的格子都显示完全：当年也画到 12/31，未来日期是灰色空格
    var startWd = (new Date(yearStart).getDay() + 6) % 7; // 周一 = 0
    var gridStart = yearStart - startWd * DAY;
    var weeks = Math.ceil((end - gridStart + DAY) / DAY / 7);

    var nav =
      '<div class="hm-nav">' +
        '<button class="hm-navbtn" data-hm-year="prev" title="上一年">‹</button>' +
        '<b>' + S.ui.hmYear + '</b>' +
        '<button class="hm-navbtn" data-hm-year="next" title="下一年"' + (S.ui.hmYear >= thisYear ? ' disabled' : '') + '>›</button>' +
      '<' + '/div>';
    var numBtn = '<button class="hm-numtoggle' + (S.ui.showHmNum ? ' on' : '') + '" data-hm-num="1" title="在格子里显示当天的仓库数">显示数字</button>';

    var wds = '<div class="hm-wds">';
    for (var wi = 0; wi < 7; wi++) wds += '<span>' + (wi % 2 === 0 ? '一二三四五六日'.charAt(wi) : '') + '</span>';
    wds += '<' + '/div>';

    var months = [], cols = '', activeDays = 0, totalN = 0, maxN = 0, prevMonth = -1;
    for (var w = 0; w < weeks; w++) {
      var col = '', colMonth = -1;
      for (var d = 0; d < 7; d++) {
        var ts = gridStart + (w * 7 + d) * DAY;
        if (ts < yearStart || ts > end) { col += '<span class="hm blank"></span>'; continue; }
        if (d === 0) colMonth = new Date(ts).getMonth();
        var key = dayKey(ts);
        var e = map[key];
        var n = e ? e.n : 0;
        if (n > 0) { activeDays++; totalN += n; }
        if (n > maxN) maxN = n;
        var lv = n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n === 3 ? 3 : 4;
        var num = (S.ui.showHmNum && n) ? '<i>' + n + '</i>' : '';
        col += '<span class="hm l' + lv + '" data-hm-day="' + key + '" data-hm-n="' + n + '">' + num + '</span>';
      }
      if (colMonth >= 0 && colMonth !== prevMonth) {
        months.push('<span style="left:' + (w / weeks * 100).toFixed(2) + '%">' + (colMonth + 1) + '月</span>');
        prevMonth = colMonth;
      }
      cols += '<div class="hm-week">' + col + '<' + '/div>';
    }

    var legend = '<span>少</span>';
    for (var l = 0; l <= 4; l++) legend += '<span class="hm l' + l + '"></span>';
    legend += '<span>多</span>';

    $('drawerBody').innerHTML =
      '<div class="hm-wrap">' +
        '<div class="hm-head">' + nav +
          '<div class="hm-summary">' + S.ui.hmYear + ' 年 · <b>' + activeDays + '</b> 天有更新 · 共 <b>' + totalN + '</b> 仓库次 · 单日最多 <b>' + maxN + '</b></div>' +
          numBtn +
        '<' + '/div>' +
        '<div class="hm-scroll">' +
          '<div class="hm-months">' + months.join('') + '<' + '/div>' +
          '<div class="hm-flex">' + wds + '<div class="hm-grid">' + cols + '<' + '/div><' + '/div>' +
        '<' + '/div>' +
        '<div class="hm-legend">' + legend + '<' + '/div>' +
      '<' + '/div>';
    return true;
  }

  function renderGithub() {
    var groups = ghRepoGroups();
    // 「未同步」筛选：只看有未同步版本的仓库
    if (S.ui.ghFilter.unsync) {
      var kept = [];
      for (var u = 0; u < groups.length; u++) {
        var gu = groups[u], nu = 0;
        for (var ur = 0; ur < gu.records.length; ur++) if (txt(gu.records[ur][F.g.result]) === '未同步') nu++;
        if (nu) kept.push(gu);
      }
      groups = kept;
    }
    var repoSet = {}, last30 = 0, unsyncN = 0, archN = 0, cutoff = Date.now() - 30 * 86400000;
    for (var i = 0; i < S.data.gh.length; i++) {
      var r = S.data.gh[i];
      if (txt(r[F.g.repo])) repoSet[txt(r[F.g.repo])] = 1;
      if (txt(r[F.g.result]) === '未同步') unsyncN++;
      var t = toTime(normDate(r[F.g.time]));
      if (t && t >= cutoff) last30++;
    }
    for (var a = 0; a < groups.length; a++) if (groups[a].archived) archN++;
    function gkpi(cls, k, num, lab) {
      return '<button class="kpi ' + cls + (k === 'unsync' && S.ui.ghFilter.unsync ? ' on' : '') + '" data-gk="' + k + '" title="' + lab + '">' +
        '<span class="num">' + num + '</span><span class="lab">' + lab + '</span>' +
        '<' + '/button>';
    }
    $('ghKpis').innerHTML =
      gkpi('', '', Object.keys(repoSet).length, '仓库') +
      gkpi('', '', last30, '近30天版本') +
      gkpi('warn', 'unsync', unsyncN, '未同步') +
      gkpi('', '', archN, '已归档');
    renderGhIntensity();

    var mSel = $('ghF_machine');
    if (mSel) {
      // 下拉 = 机器表 ∪ 记录里出现过的电脑名：
      // 电脑改名/删除后，历史记录仍挂在旧名上；只给机器表的话，这些记录就永远筛不到
      var names = [], seen = {};
      for (var k = 0; k < S.data.machines.length; k++) {
        var mn = txt(S.data.machines[k][F.m.name]);
        if (!mn || seen[mn]) continue;
        seen[mn] = 1; names.push(mn);
      }
      for (var gi = 0; gi < S.data.gh.length; gi++) {
        var rn = txt(S.data.gh[gi][F.g.machine]);
        if (!rn || seen[rn]) continue;
        seen[rn] = 1; names.push(rn);
      }
      var html = '<option value="">全部</option>';
      for (var ni = 0; ni < names.length; ni++) {
        html += '<option value="' + escapeHtml(names[ni]) + '">' + escapeHtml(names[ni]) + '<' + '/option>';
      }
      mSel.innerHTML = html;
      mSel.value = S.ui.ghFilter.machine;
    }

    var host = $('ghList');
    if (!host) return;
    if (!groups.length) {
      // 空态要说清是哪个筛选造成的，并给出清除入口（与任务看板同一原则）。
      // 搜索与下拉筛选是两个独立成因，各自给一个按钮，别让用户猜是谁把列表清空了。
      var ghFilters = [];
      if (S.ui.q) ghFilters.push('搜索「' + escapeHtml(S.ui.q) + '」');

        host.innerHTML = '<div class="col-empty">当前筛选：' + ghFilters.join(' + ') + '<br>没有匹配的仓库<br>' + clears + '</div>';

  // 渲染同步记录表单（新增或编辑）。纯渲染，不改导航状态 —— 返回上一层时能原样重建。

    var resOpts = S.data.opts.ghResult.length ? S.data.opts.ghResult.slice(0) : ['已同步', '未同步'];

  function collectGhProps() {

    p[F.g.time] = { date: timeVal };
    p[F.g.machine] = { text: clean($('gf_machine') ? $('gf_machine').value : '') };

  function saveGh() {
    if (!db) return;
    var props = collectGhProps();
    if (!props) { toast('表单没准备好，请重新打开'); return; }
    var id = S.ui.sheet.id;   // 当前层就是这条记录
    $('saveBtn').disabled = true;
    var p;
    if (id) p = Repo.github.update(id, props);
    else p = Repo.github.create(props);
    p.then(function (rr) {
      var newId = id || (rr && (rr.id || rr._id));
      if (!id) {
        var rec = { _id: newId };
        for (var key in props) if (props.hasOwnProperty(key)) rec[key] = props[key][Object.keys(props[key])[0]];
        S.data.gh.unshift(rec);
      } else {
        var t = findGh(newId);
        if (t) for (var k2 in props) if (props.hasOwnProperty(k2)) t[k2] = props[k2][Object.keys(props[k2])[0]];
      }
      $('saveBtn').disabled = false;
      // 保存后：若有上一层就退回上一层（用户能看到刚改的那条），否则关闭整个弹窗
      if (S.ui.sheetStack.length) { backSheet(); } else { closeDrawer(); }
      renderGithub();
      toast(id ? '已保存' : '已记录');
    }).catch(function (e) {
      console.error('[workbench] GitHub 记录保存失败', e);
      $('saveBtn').disabled = false;
      toast('保存失败，请稍后重试');
    });
  }

  // 置顶是仓库级属性：把该仓库所有记录写成同一个值（读侧「任一为 true 即置顶」，与归档同口径）
  function toggleRepoPin(repo) {
    if (!repo) return;
    var recs = [];
    for (var i = 0; i < S.data.gh.length; i++) if (txt(S.data.gh[i][F.g.repo]) === repo) recs.push(S.data.gh[i]);
    if (!recs.length) return;
    var next = true;
    for (var j = 0; j < recs.length; j++) if (recs[j][F.g.pinned]) next = false;
    for (var k = 0; k < recs.length; k++) recs[k][F.g.pinned] = next;
    renderGithub();
    var props = {};
    props[F.g.pinned] = { checkbox: next };
    var jobs = [];
    for (var n = 0; n < recs.length; n++) {
      jobs.push(Repo.github.update(ghRecId(recs[n]), props));
    }
    Promise.all(jobs).then(function () {
      toast(next ? '已置顶「' + repo + '」' : '已取消置顶「' + repo + '」');
    }).catch(function (e) {
      console.error('[workbench] 置顶保存失败', e);
      toast('置顶保存失败，正在回滚');
      loadGithub(function (gh) { setData('gh', gh); renderGithub(); });
    });
  }

  // ── 任务详情：看得见就能改（就地编辑）──
  // 早期是「只读详情 + 编辑表单」，实际用起来最常改的就是标题 / 进度 / 待办，
  // 每次都要先点「编辑」再拉一整个表单太绕。现在详情里：
  //   文字（标题 / 进度 / 交接 / 目录）点一下变输入框

  // 「编辑」按钮保留给「一次改多个字段」的场景，表单仍是完整入口。
  function renderTaskDetail(t) {

  // 详情里的单字段保存：改一个字段 + 更新时间，看板与详情就地重绘，不关窗、不动导航栈
  var DT_SELECT_FIELDS = {};

  function saveTaskField(id, fname, value) {
    var t = findTask(id);
    if (!t || !fname) return;
    var now = new Date().toISOString();
    var props = {};
    props[fname] = DT_SELECT_FIELDS[fname] ? { select: value } : { text: value };
    props[F.t.updated] = { date: now };
    t[fname] = value;
    t[F.t.updated] = now;
    render();
    if (S.ui.sheet.kind === 'taskDetail') renderSheetLayer(S.ui.sheet);
    Repo.tasks.update(id, props)
      .then(function () { toast('已更新'); })
      .catch(function (e) {

        toast('更新失败，正在回滚');
        loadTasks(function (ts) {

        });

  // 文字就地编辑：单行 input（Enter 提交），多行 textarea（Ctrl/⌘+Enter 提交，失焦也提交）
  function startDtEdit(el) {
    if (!el || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
    var fname = el.getAttribute('data-dt-edit');
    var id = S.ui.sheet.id;
    var t = findTask(id);
    if (!t || !fname) return;
    var old = txt(t[fname]);
    var multi = (fname === F.t.progress || fname === F.t.handoff);
    var box = multi ? document.createElement('textarea') : document.createElement('input');
    box.className = 'dt-edit' + (multi ? ' multi' : '');
    box.value = old;
    el.style.display = 'none';
    el.parentNode.insertBefore(box, el.nextSibling);
    box.focus();
    if (!multi) { try { box.select(); } catch (e) {} }

    var settled = false;
    function restore() {
      if (settled) return;
      settled = true;
      if (box.parentNode) box.parentNode.removeChild(box);
      el.style.display = '';
    }
    function commit() {
      if (settled) return;
      settled = true;
      if (box.parentNode) box.parentNode.removeChild(box);
      el.style.display = '';
      var v = box.value.replace(/^\s+|\s+$/g, '');
      if (v === old) return;
      saveTaskField(id, fname, v);
    }
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); restore(); }
      else if (e.key === 'Enter' && (!multi || e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(); }
    });
    box.addEventListener('blur', commit);
    box.addEventListener('click', function (e) { e.stopPropagation(); });
  }

  function openTaskEditor(id) {

  // 渲染任务表单（编辑态）。从详情态切进来时复用，所以不碰弹窗的形态 class。
  function renderTaskForm(d, id) {
    var curMachine = txt(d[F.t.machine]);
    var curKnown = false;
    var mOpts = '';
    for (var i = 0; i < S.data.machines.length; i++) {
      var mn = txt(S.data.machines[i][F.m.name]);
      if (mn === curMachine) curKnown = true;
      mOpts += '<option value="' + escapeHtml(mn) + '"' + (mn === curMachine ? ' selected' : '') + '>' + escapeHtml(mn) + '<' + '/option>';
    }
    if (!curKnown) {
      // 当前值对不上任何一台登记过的电脑：保留原值并明示，避免保存时被静默改成第一台（P-08）
      mOpts = '<option value="' + escapeHtml(curMachine) + '" selected>' +
        (curMachine ? escapeHtml(curMachine) + '（未登记）' : '— 未指定 —') + '<' + '/option>' + mOpts;
    }
      var todoText = txt(d[F.t.todos]);
      // 抽屉里的可点勾选清单：卡面瘦身之后，勾待办移到这里（点一下直接写库）
      var stList = parseTodos(d[F.t.todos]);

  /* ── 居中弹窗（sheet）：视图栈 ──────────────────────────────
     一个弹窗承载一条「视图路径」：仓库详情 → 某条记录的编辑表单。
     每层是一个完整的视图描述 {kind, id, repo}，压在 S.ui.sheetStack 里；
     S.ui.sheet 是当前层。返回时弹出上一层并重新渲染它 —— 因为每层都能被
     纯渲染函数重建，所以「返回」不需要重新查数据源，也不会丢失上下文。

     三种进入方式，语义清晰、不需要守卫：
       push   —— 从当前视图钻取到下一层（保留上一层，可返回）
       root   —— 从看板直接进入，清空栈（顶层，无上一层可返回）

     标题栏的返回箭头只在栈非空时出现。 */
  function openSheet() {
    $('mask').classList.add('on');
    $('drawer').classList.add('on');
  }

  // 渲染一层视图。返回 false 表示这一层已失效（记录被删等），调用方负责回退。
  // 入口就设好 S.ui.sheet，这样「打开」与「返回」走的是同一条路径，状态不会漂。
  // 当前操作对象一律从 S.ui.sheet.id 推导，不再另存 editing / ghEditing ——
  // 同一个事实只存一份，否则迟早出现「两个地方记的不是同一件事」。
  function renderSheetLayer(layer) {
    setUi('sheet', layer);
    // 日历热力图一年 53 周 + 大格子（可显示数字），需要超宽面板；其余层恢复标准宽
    $('drawer').classList.toggle('xl', layer.kind === 'intensity');
    if (layer.kind === 'taskDetail') {
      var t = findTask(layer.id);
      if (!t) return false;
      $('drawerTitle').textContent = '任务详情';
      setSheetFoot({ save: false, edit: true, copy: true, repoAdd: false, repoCopy: false, del: true });
      return renderTaskDetail(t);
    }
    if (layer.kind === 'taskForm') {
      // 表单层的标题/底栏由 openTaskEditor 负责（它还要处理草稿）
      return openTaskEditor(layer.id);
    }
    if (layer.kind === 'ghForm') {
      return renderGhForm(layer.id, layer.repo);
    }
    if (layer.kind === 'repoDetail') {
      return renderRepoDetail(layer.repo);
    }
    if (layer.kind === 'intensity') {
      return renderIntensitySheet();
    }
    return false;
  }

  // 进入一层视图。mode: 'push' 保留上一层 | 'root' 清空栈。
  function gotoSheet(layer, mode) {
    if (mode === 'push') S.ui.sheetStack.push(S.ui.sheet);
    else     setUi('sheetStack', []);
    if (!renderSheetLayer(layer)) {
      // 这一层渲染不出来（数据没了）→ 回退到上一层；再不行就关闭
      if (S.ui.sheetStack.length) { backSheet(); } else { closeDrawer(); }
      return;
    }
    syncSheetNav();
    openSheet();
  }

  // 返回上一层
  function backSheet() {
    if (!S.ui.sheetStack.length) { closeDrawer(); return; }
    var prev = S.ui.sheetStack.pop();
    if (!renderSheetLayer(prev)) {
      // 上一层也失效了 → 继续往上退
      backSheet();
      return;
    }
    syncSheetNav();
    openSheet();
  }

  // 返回箭头的显隐由「栈里还有没有上一层」唯一决定
  function syncSheetNav() {
    $('drawerBack').style.display = S.ui.sheetStack.length ? '' : 'none';
  }

  function closeDrawer() {
    $('mask').classList.remove('on');
    $('drawer').classList.remove('on');
    $('drawer').classList.remove('wide');
    $('drawer').classList.remove('xl'); // 日历弹窗的加宽修饰一并还原
    setUi('sheet', { kind: '', id: null, repo: '' });
    setUi('sheetStack', []);
    syncSheetNav();
    setSheetFoot({ save: false, edit: false, copy: false, repoAdd: false, repoCopy: false, del: false });
  }
  // 底栏按钮一次性按当前面板设定，避免各处零散地改 style.display
  function setSheetFoot(f) {
    $('saveBtn').style.display = f.save ? '' : 'none';
    $('editBtn').style.display = f.edit ? '' : 'none';
    $('copyBtn').style.display = f.copy ? '' : 'none';
    $('repoAddBtn').style.display = f.repoAdd ? '' : 'none';
    $('repoCopyBtn').style.display = f.repoCopy ? '' : 'none';
    $('delBtn').style.display = f.del ? '' : 'none';
  }

  // 唯一的提交入口：按弹窗类型分流，不再用「记录 id 是否为 null」当判据（P-02/P-03）
  function submitDrawer() {
    if (S.ui.sheet.kind === 'ghForm') { saveGh(); return; }
    if (S.ui.sheet.kind === 'taskForm') { saveTask(); return; }
  }

  var draftTimer = null;

  function collectProps() {
    if (!$('f_title') || !$('f_machine')) return null;
    var p = {};
    p[F.t.title] = { text: $('f_title').value.replace(/^\s+|\s+$/g, '') };
    p[F.t.status] = { select: $('f_status').value };
    p[F.t.prio] = { select: $('f_priority').value };
    p[F.t.machine] = { text: $('f_machine').value };
    p[F.t.dir] = { text: $('f_dir').value.replace(/^\s+|\s+$/g, '') };
    p[F.t.progress] = { text: $('f_progress').value.replace(/^\s+|\s+$/g, '') };
    p[F.t.todos] = { text: $('f_todos').value };
    p[F.t.handoff] = { text: $('f_handoff').value.replace(/^\s+|\s+$/g, '') };
    p[F.t.updated] = { date: new Date().toISOString() };
    return p;
  }

  function saveTask() {
    if (!db) return;
    var props = collectProps();
    if (!props) { toast('表单没准备好，请重新打开'); return; }
    var id = S.ui.sheet.id;   // 当前层就是这条任务
    if (!props[F.t.title].text) { toast('任务标题不能为空'); return; }
    if (id) {
      var rec0 = findTask(id);
      if (rec0) {
        props = stripUnchanged(props, rec0);
        var realKeys = 0;
        for (var dk in props) if (props.hasOwnProperty(dk) && dk !== F.t.updated) realKeys++;
        if (!realKeys) { closeDrawer(); toast('没有改动'); return; }
      }
    }
    $('saveBtn').disabled = true;
    var p;
    if (id) {
      p = Repo.tasks.update(id, props);
    } else {
      p = Repo.tasks.create(props);
    }
    p.then(function (r) {
      var newId = id || (r && (r.id || r._id));
      var found = null;
      for (var i = 0; i < S.data.tasks.length; i++) {
        if (S.data.tasks[i]._id === newId) { found = S.data.tasks[i]; break; }
      }
      if (found) applyProps(found, props);
      else if (!id && newId) S.data.tasks.unshift(applyProps({ _id: newId }, props));
      if (!id) clearDraft();
      $('saveBtn').disabled = false;
      // 保存后：若有上一层就退回上一层（用户能看到刚改的内容），否则关闭整个弹窗
      if (S.ui.sheetStack.length) { backSheet(); } else { closeDrawer(); }
      render();
      toast(id ? '已保存' : '已新建');
    }).catch(function (e) {
      console.error('[workbench] 保存失败', e);
      $('saveBtn').disabled = false;
      toast('保存失败，请稍后重试');
    });
  }

  function propValue(v) {
    v = v || {};
    if (v.text != null) return v.text;
    if (v.select != null) return v.select;
    if (v.date != null) return v.date;
    if (v.number != null) return v.number;
    if (v.checkbox != null) return v.checkbox;
    return '';
  }

  // 把 properties 增量合并进本地记录。不重建对象，避免丢掉这次没提交的字段（如「排序」）
  function applyProps(rec, props) {
    for (var k in props) {
      if (props.hasOwnProperty(k)) rec[k] = propValue(props[k]);
    }
    return rec;
  }

  // 编辑已有任务时只提交真正变了的字段，两台机器各改各的不会互相覆盖（P-10）
  function stripUnchanged(props, rec) {
    var out = {};
    for (var k in props) {
      if (!props.hasOwnProperty(k)) continue;
      if (k === F.t.updated) { out[k] = props[k]; continue; }
      if (txt(rec[k]) !== txt(propValue(props[k]))) out[k] = props[k];
    }
    return out;
  }

  function toggleTodo(id, lineNo) {
    var t = findTask(id);
    if (!t) return;
    var lines = txt(t[F.t.todos]).split('\n');
    if (lineNo < 0 || lineNo >= lines.length) return;
    var raw = lines[lineNo];
    var m = raw.match(/^(\s*)\[(x|X|\s*)\]\s*(.*)$/);
    if (m) {
      var wasDone = /x/i.test(m[2]);
      lines[lineNo] = m[1] + (wasDone ? '[ ] ' : '[x] ') + m[3];
    } else if (raw.replace(/^\s+|\s+$/g, '')) {
      // 没有勾选框前缀的自由行：补一个已完成标记，保留原缩进
      lines[lineNo] = raw.match(/^\s*/)[0] + '[x] ' + raw.replace(/^\s+|\s+$/g, '');
    } else {
      return;
    }
    var txtNew = lines.join('\n');
    var props = {};
    props[F.t.todos] = { text: txtNew };
    props[F.t.updated] = { date: new Date().toISOString() };
    t[F.t.todos] = txtNew;
    t[F.t.updated] = props[F.t.updated].date;
    render();
    Repo.tasks.update(id, props).catch(function (e) {
      console.error('[workbench] 待办更新失败', e);
      toast('更新失败，正在回滚');
      loadTasks( function (ts) {
        setData('tasks', ts);
        render();
      });
    });
  }

  var renderTimer = null;
  function scheduleRender() {
    if (renderTimer) return;
    renderTimer = setTimeout(function () { renderTimer = null; render(); }, 0);
  }

  function updateTaskFields(id, patch) {
    var t = findTask(id);
    if (!t) return;
    var props = {};
    if (patch.title != null) props[F.t.title] = { text: patch.title };
    if (patch.status != null) props[F.t.status] = { select: patch.status };
    props[F.t.updated] = { date: new Date().toISOString() };
    if (patch.title != null) t[F.t.title] = patch.title;
    if (patch.status != null) t[F.t.status] = patch.status;
    t[F.t.updated] = props[F.t.updated].date;
    scheduleRender();
    Repo.tasks.update(id, props)
      .then(function () { toast('已更新'); })
      .catch(function (e) {
        console.error('[workbench] 更新失败', e);
        toast('更新失败，正在回滚');
        loadTasks(function (ts) { setData('tasks', ts); render(); });
      });
  }

  function doTaskAction(act, id) {
    var t = findTask(id);
    if (!t) return;
    if (act === 'rename') {
      var tel = document.querySelector('[data-edit="taskTitle"][data-id="' + id + '"]');
      if (tel) startEdit(tel); else gotoSheet({ kind: 'taskDetail', id: id, repo: '' }, 'root');
      return;
    }
    if (act === 'complete') { updateTaskFields(id, { status: ST_DONE }); return; }
    if (act === 'open') { gotoSheet({ kind: 'taskDetail', id: id, repo: '' }, 'root'); return; }
    if (act === 'delete') {
      showConfirm('删除任务', '「' + txt(t[F.t.title]) + '」删除后无法恢复。', function () {
        Repo.tasks.remove(id).then(function () {
          var arr = [];
          for (var i = 0; i < S.data.tasks.length; i++) if (S.data.tasks[i]._id !== id) arr.push(S.data.tasks[i]);
          setData('tasks', arr);
          render();
          toast('任务已删除');
        }).catch(function (e) {
          console.error('[workbench] 删除失败', e);
          toast('删除失败');
        });
      });

  }

  function startEdit(el) {
    if (!el || el.tagName === 'INPUT') return;
    var kind = el.getAttribute('data-edit');
    var id = el.getAttribute('data-id');
    var raw = el.textContent;
    var oldVal = (raw === '＋位置') ? '' : raw;

    var input = document.createElement('input');
    input.className = 'inline-input';
    input.value = oldVal;
    if (kind === 'machineName') input.style.width = Math.max(96, el.offsetWidth + 26) + 'px';
    else if (kind === 'machinePlace') input.style.width = Math.max(58, el.offsetWidth + 18) + 'px';
    else input.style.width = '100%';

    el.style.display = 'none';
    el.parentNode.insertBefore(input, el.nextSibling);
    input.focus();
    input.select();

    var settled = false;
    function restore(val) {
      if (settled) return;
      settled = true;
      if (input.parentNode) input.parentNode.removeChild(input);
      el.style.display = '';
      if (val != null) el.textContent = val;
    }
    function commit() {
      if (settled) return;
      var v = input.value.replace(/^\s+|\s+$/g, '');
      restore(v || oldVal);
      if (!v || v === oldVal) return;
      if (kind === 'machineName') renameMachine(id, v);
      else if (kind === 'machinePlace') { updateMachineFields(id, { place: v }); toast('位置已更新'); }
      else if (kind === 'taskTitle') updateTaskFields(id, { title: v });
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); restore(oldVal); }
    });
    input.addEventListener('blur', commit);
    input.addEventListener('click', function (e) { e.stopPropagation(); });
  }

  function toggleTaskSel(node) {

  function batchUpdateTasks(ids, props) {
    if (!ids.length) return;
    var now = new Date().toISOString();
    var failed = 0;
    Promise.all(ids.map(function (id) {
      var t = findTask(id);
      if (!t) return null;
      for (var k in props) if (props.hasOwnProperty(k)) t[k] = props[k][Object.keys(props[k])[0]];
      t[F.t.updated] = now;
      var p = JSON.parse(JSON.stringify(props));
      p[F.t.updated] = { date: now };
      return Repo.tasks.update(id, p).catch(function (e) {
        console.error('[workbench] 批量更新失败', id, e);
        failed++;
        return null;
      });
    })).then(function () {
      // 有失败就重拉，别让本地显示「全都改了」而库里只有一半
      if (failed) {
        toast('已更新 ' + (ids.length - failed) + ' 个，' + failed + ' 个失败，正在重新拉取');
        loadTasks(function (ts) { setData('tasks', ts); render(); });
      } else {
        toast('已更新 ' + ids.length + ' 个任务');
      }
      setSel('tasks', {});
      render();
    });
  }
  function batchDeleteTasks(ids) {
    var failed = 0;
    Promise.all(ids.map(function (id) {
      return Repo.tasks.remove(id).catch(function (e) { console.error('[workbench] 批量删除失败', id, e); failed++; return null; });
    })).then(function () {
      if (failed) {
        // 本地不按 ids 全删：失败的还在库里，刷新会「复活」，必须先重拉对齐
        toast('已删除 ' + (ids.length - failed) + ' 个，' + failed + ' 个失败，正在重新拉取');
        loadTasks(function (ts) { setData('tasks', ts); render(); });
      } else {
        var set = {}; ids.forEach(function (id) { set[id] = 1; });

  function batchUpdateGh(ids, props) {
    if (!ids.length) return;
    var failed = 0;
    Promise.all(ids.map(function (id) {
      var r = findGh(id);
      if (!r) return null;
      for (var k in props) if (props.hasOwnProperty(k)) r[k] = props[k][Object.keys(props[k])[0]];
      return Repo.github.update(id, JSON.parse(JSON.stringify(props))).catch(function (e) {
        console.error('[workbench] 批量更新失败', id, e);
        failed++;
        return null;
      });
    })).then(function () {
      if (failed) {
        toast('已更新 ' + (ids.length - failed) + ' 条，' + failed + ' 条失败，正在重新拉取');
        loadGithub(function (gh) { setData('gh', gh); render(); });
      } else {
        toast('已更新 ' + ids.length + ' 条记录');
      }
      setSel('gh', {});
      render();
    });
  }
  function batchDeleteGh(ids) {
    var failed = 0;
    Promise.all(ids.map(function (id) {
      return Repo.github.remove(id).catch(function (e) { console.error('[workbench] 批量删除失败', id, e); failed++; return null; });
    })).then(function () {
      if (failed) {
        toast('已删除 ' + (ids.length - failed) + ' 条，' + failed + ' 条失败，正在重新拉取');
        loadGithub(function (gh) { setData('gh', gh); render(); });
      } else {
        var set = {}; ids.forEach(function (id) { set[id] = 1; });
        setData('gh', S.data.gh.filter(function (r) { return !set[ghRecId(r)]; }));
        toast('已删除 ' + ids.length + ' 条记录');
      }
      setSel('gh', {});
      render();
    });
  }

  function manageAct(act, btn) {
    var tIds = Object.keys(S.sel.tasks), gIds = Object.keys(S.sel.gh);
    if (act === 'exit') { setManage(false); return; }
    if (act === 'all-tasks') {
      var cards = document.querySelectorAll('#board .card');
      for (var i = 0; i < cards.length; i++) S.sel.tasks[cards[i].getAttribute('data-task-id')] = true;
      syncSel(); renderManageBar(); return;
    }
    if (act === 'all-gh') {
      var ents = document.querySelectorAll('#ghList .repo-entry');
      for (var j = 0; j < ents.length; j++) S.sel.gh[ents[j].getAttribute('data-gh-id')] = true;
      syncSel(); renderManageBar(); return;
    }
    if (act === 'del-repo') {
      // 删整仓不需要先选中记录
      var repo = btn ? btn.getAttribute('data-repo') : '';
      if (!repo) return;
      var ids = [];
      for (var ri = 0; ri < S.data.gh.length; ri++) if (txt(S.data.gh[ri][F.g.repo]) === repo) ids.push(ghRecId(S.data.gh[ri]));
      if (!ids.length) { toast('这个仓库下没有记录'); return; }
      showConfirm('删除整个仓库', '将删除「' + repo + '」的全部 ' + ids.length + ' 条同步记录，删除后无法恢复。', function () { batchDeleteGh(ids); });
      return;
    }
    if (!tIds.length && !gIds.length) { toast('先点选要操作的对象'); return; }
    if (act === 'done') batchUpdateTasks(tIds, { '状态': { select: ST_DONE } });
    else if (act === 'prio') { if (tIds.length) openSelMenu(btn, 'prio'); else toast('先选择任务'); }
    else if (act === 'move') { if (tIds.length) openSelMenu(btn, 'move'); else toast('先选择任务'); }
    else if (act === 'del-tasks') showConfirm('批量删除任务', '将删除选中的 ' + tIds.length + ' 个任务，删除后无法恢复。', function () { batchDeleteTasks(tIds); });
    else if (act === 'synced') batchUpdateGh(gIds, { '是否同步': { select: '已同步' } });
    else if (act === 'unsynced') batchUpdateGh(gIds, { '是否同步': { select: '未同步' } });
    else if (act === 'del-gh') showConfirm('批量删除记录', '将删除选中的 ' + gIds.length + ' 条同步记录，删除后无法恢复。', function () { batchDeleteGh(gIds); });
  }
