  // 分段按钮 → 视图
  function viewOfSeg(segName) {
    if (segName === '全部') return 'all';
    if (segName === '已完成') return 'done';
    return 'doing';
  }
  // KPI 卡片 → 视图（点已激活的卡片回到默认视图，即取消该视图）
  function viewOfKpi(key) {
    if (key === 'done') return 'done';
    if (key === 'att') return 'att';
    if (key === 'todo') return 'todo';
    return 'doing';
  }

  (function bindSeg() {
    var seg = $('segTabs');
    if (!seg) return;
    seg.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      setView(viewOfSeg(b.getAttribute('data-s')));
    });
  })();

  // ── 左 KPI 条：与分段映射到同一组视图，保证两种入口行为一致 ──
  (function bindKpis() {
    var host = $('summary');
    if (!host) return;
    host.addEventListener('click', function (e) {
      var k = e.target.closest ? e.target.closest('.kpi') : null;
      if (!k) return;
      var key = k.getAttribute('data-k');
      var target = viewOfKpi(key);
      // 点当前已激活的卡片 → 回到默认视图（取消）
      setView(S.ui.view === target ? 'doing' : target);
    });
  })();

  if (!db) {
    var ph = document.createElement('div');
    ph.className = 'col-empty';
    ph.style.padding = '48px 24px';
    ph.textContent = '连不上本地服务：请先在工具目录运行 node server.mjs，再刷新本页。';
    $('board').appendChild(ph);
    $('summary').innerHTML = '<span class="hint">未连接本地服务</span>';
    return;
  }

  /* ── 窄屏分页：底部 T-bar 在 看板 / 仓库 之间切页，主操作一并下沉 ──
     宽屏不插手：左右分屏照旧，顶部小标题仍是「放大本栏 / 还原」。
     ⚠️ 这个断点字符串必须与 CSS 里「手机形态」的 @media 条件逐字一致
        （含「上下分屏」的高度+扁平比分支），否则会出现 JS 与 CSS 判断不一致。 */
  (function bindMobilePages() {
    var MQ = window.matchMedia('(max-width: 700px), (max-height: 560px) and (min-aspect-ratio: 2/1)');
    function isMobile() { return MQ.matches; }
    function setPage(p) {
      p = p || 'board';
      document.body.setAttribute('data-page', p);
      var items = document.querySelectorAll('#tabbar [data-page]');
      for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle('on', items[i].getAttribute('data-page') === p);
      }
    }
    if (!document.body.getAttribute('data-page')) setPage('board');

    var items = document.querySelectorAll('#tabbar [data-page]');
    for (var i = 0; i < items.length; i++) {
      items[i].addEventListener('click', function (e) {
        e.stopPropagation(); closeMenus();
        setPage(this.getAttribute('data-page'));
      });
    }
    // 更多：＋新增四项（复用 data-add，走现有分发）/ AI 指南 / 管理 / 主题。
    // AI 指南原本是中央大圆键，现收进这里——T-bar 定位是「浏览」，写操作不该占主位。
    var mo = $('tabMore');
    if (mo) mo.addEventListener('click', function (e) {
      e.stopPropagation(); closeMenus();
      var menu = document.createElement('div');
      menu.className = 'menu';
      menu.setAttribute('data-tbmenu', '1');
      menu.innerHTML =
        '<button data-add="task">＋ 新建任务<' + '/button>' +
        '<button data-add="import">📥 批量导入<' + '/button>' +
        '<button data-add="gh">＋ 记录一次同步<' + '/button>' +
        '<button data-add="machine">＋ 添加电脑<' + '/button>' +
        '<button data-tbact="ai">🤖 AI 指南<' + '/button>' +
        '<button data-tbact="manage">' + (S.ui.manage ? '✓ 退出管理' : '☰ 管理') + '<' + '/button>' +
        '<button data-tbact="theme">切换主题<' + '/button>';
      document.body.appendChild(menu);
      var r = mo.getBoundingClientRect(), mr = menu.getBoundingClientRect();
      menu.style.left = Math.max(8, Math.min(r.right - mr.width, window.innerWidth - mr.width - 8)) + 'px';
      menu.style.top = Math.max(8, r.top - mr.height - 8) + 'px';
    });
    document.addEventListener('click', function (e) {
      var m = e.target.closest ? e.target.closest('[data-tbact]') : null;
      if (!m || !m.closest('[data-tbmenu]')) return;
      var k = m.getAttribute('data-tbact');
      closeMenus();
      if (k === 'manage') {
        setManage(!S.ui.manage);
        var top = $('manageBtn');
        if (top) top.classList.toggle('on', S.ui.manage);
      }
      if (k === 'theme') { var t = $('themeBtn'); if (t) t.click(); }
      if (k === 'ai') openAiGuide();
    });
    // 窄屏下点小标题就是切页（宽屏仍是放大/还原，见 bindPaneMax）
    var tbT = $('tBoard'), tgT = $('tGh');
    if (tbT) tbT.addEventListener('click', function () { if (isMobile()) setPage('board'); }, true);
    if (tgT) tgT.addEventListener('click', function () { if (isMobile()) setPage('gh'); }, true);
  })();

  bindDrag();

  // 顶栏版本号：以 {API_BASE}health 返回为准（= package.json），页面本身不写死，避免双处漂移。
  // 必须走 API_BASE：平台反代挂在 /tool/agent-workbench/ 下，
  // 绝对路径 /health 会打到平台根（那里没有该接口）→ 版本号永远是空的（v1.5.3 修）
  (function syncVersion() {
    var el = document.getElementById('appVer');
    function hide() { if (el) el.style.display = 'none'; }
    try {
      fetch(API_BASE + 'health', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (h) {
        if (el && h && h.version) el.textContent = 'v' + h.version;
        else hide();
      }).catch(hide);
    } catch (e) { hide(); }
  })();

  loadAllData(function (err) {
    render();
    if (err) toast('部分数据加载失败，可刷新重试');
  });
})();
</script>
</body>
</html>
