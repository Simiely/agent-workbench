<!DOCTYPE html>
<html data-theme="dark" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Agent 工作台</title>
<style>
  :root[data-theme="dark"] {
    --bg: #0C0D10;
    --panel: #12141A;
    --panel-2: #1A1D24;
    --panel-3: #232730;
    --border: #22262E;
    --border-strong: #343A45;
    --text: #E8EAED;
    --text-2: #9AA1AC;
    --text-3: #666E7B;
    --accent: #4F8CFF;
    --accent-soft: rgba(79,140,255,.13);
    --done: #33C89A;
    --done-soft: rgba(51,200,154,.12);
    --warn: #F0A22E;
    --danger: #F2555A;
    --danger-soft: rgba(242,85,90,.13);
    --shadow: 0 14px 44px rgba(0,0,0,.55);
    /* 弹窗（居中 sheet）配色：深色下是深色磨砂玻璃 */
    --mask-bg: rgba(8, 10, 14, .58);
    --mask-bg-solid: rgba(8, 10, 14, .9);
    --sheet-bg: rgba(22, 26, 33, .92);
    --sheet-border: rgba(255, 255, 255, .09);
    --sheet-shadow: 0 24px 64px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  }
  :root[data-theme="light"] {
    --bg: #F3F4F7;
    --panel: #FFFFFF;
    --panel-2: #F5F7FA;
    --panel-3: #E9ECF1;
    --border: #E2E6EC;
    --border-strong: #CCD2DB;
    --text: #101319;
    --text-2: #576070;
    --text-3: #8A93A1;
    --accent: #2563EB;
    --accent-soft: rgba(37,99,235,.09);
    --done: #059669;
    --done-soft: rgba(5,150,105,.10);
    --warn: #C2740A;
    --danger: #D92D20;
    --danger-soft: rgba(217,45,32,.09);
    --shadow: 0 14px 40px rgba(16,24,40,.13);
    /* 弹窗（居中 sheet）配色：浅色下是白色磨砂玻璃 */
    --mask-bg: rgba(16, 24, 40, .38);
    --mask-bg-solid: rgba(16, 24, 40, .82);
    --sheet-bg: rgba(255, 255, 255, .92);
    --sheet-border: rgba(16, 24, 40, .1);
    --sheet-shadow: 0 24px 64px rgba(16,24,40,.18), 0 2px 8px rgba(16,24,40,.1);
  }
  /* ── 浮层动效令牌（与主题无关，全局一套）──
     苹果动效规范：spring 曲线用 cubic-bezier(0.32,0.72,0,1)，进场从容、退场利落。
     进出不对称靠「transition 定义在目标状态上」实现，不需要 JS 计时器。 */
  :root {
    --ease-spring: cubic-bezier(.32, .72, 0, 1);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --dur-in: 340ms;
    --dur-out: 200ms;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
  /* 滚动条适配主题：细、暗、hover 提亮；浅色模式走同一套变量 */
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-strong); border-radius: 6px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .topbar {
    flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 22px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand h1 { font-size: 15px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
  .spacer { flex: 1; }
  .search {
    display: flex; align-items: center; gap: 7px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 9px; padding: 0 10px; height: 33px; width: 300px;
    transition: border-color .15s;
  }
  .search:focus-within { border-color: var(--border-strong); }
  .search input { background: none; border: none; outline: none; width: 100%; font-size: 12.5px; }
  .search input::placeholder { color: var(--text-3); }
  .icon-btn {
    width: 33px; height: 33px; display: grid; place-items: center; border-radius: 9px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text-2); transition: .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .ghost-btn {
    height: 33px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text-2); font-size: 12.5px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .ghost-btn .tick { color: var(--done); }
  .btn-primary {
    height: 33px; padding: 0 14px; border-radius: 9px; background: var(--accent);
    color: #fff; font-size: 12.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn-primary:hover { filter: brightness(1.08); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: row; padding: 0 16px 10px; }

  .summary {
    flex: none; display: block;
    padding: 2px 0 0; font-size: 11.5px; color: var(--text-3);
  }
  .check-line { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); cursor: pointer; padding: 7px 0; }
  .check-line input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

  /* ===== AI 写入指南 ===== */
  .ai-sec { margin-bottom: 18px; }
  .ai-sec h4 { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 7px; display: flex; align-items: center; gap: 7px; }
  .ai-sec h4 .dbid { font-size: 10px; color: var(--text-3); font-family: ui-monospace, Consolas, monospace; background: var(--panel-3); border-radius: 4px; padding: 1px 5px; }
  .ai-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .ai-table th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 10.5px; padding: 4px 7px; border-bottom: 1px solid var(--border); }
  .ai-table td { padding: 5px 7px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
  .ai-table td:first-child { color: var(--text); font-weight: 500; white-space: nowrap; }
  .ai-table td.req { color: var(--danger); text-align: center; }
  .ai-table td.opt { color: var(--text-3); text-align: center; }
  .ai-enum { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; color: var(--accent); }
  .ai-note { font-size: 11.5px; color: var(--text-2); line-height: 1.75; }
  .ai-note li { margin: 0 0 4px 16px; }
  .ai-pre {
    font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--text-2);
    background: var(--panel-3); border-radius: 8px; padding: 10px 12px; overflow-x: auto; line-height: 1.6; white-space: pre;
  }
  .ai-warn { color: var(--warn); }
  .ai-pick { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 8px; }
  .ai-pick select {
    background: var(--panel-3); border: 1px solid var(--border-strong); border-radius: 8px;
    color: var(--text); font-size: 12.5px; padding: 6px 10px; min-width: 220px; outline: none; cursor: pointer;
  }
  .ai-pick select:focus { border-color: var(--accent); }
  .ai-pick-tip { font-size: 11px; color: var(--text-3); }

  /* ===== 管理模式：批量选择与批量操作 ===== */
  .ghost-btn.on { color: var(--accent); border-color: var(--accent); }
  .sel-box {
    position: absolute; top: 9px; left: 9px; width: 16px; height: 16px;
    border: 1.5px solid var(--border-strong); border-radius: 4px; background: var(--panel);
    display: none; place-items: center; font-size: 10px; line-height: 1; color: transparent; flex: none;
  }
  body.manage .sel-box { display: grid; }
  body.manage .card, body.manage .repo-entry { padding-left: 32px; }
  body.manage .repo-entry { position: relative; cursor: pointer; }
  body.manage .card { cursor: pointer; }
  body.manage .card .c-actions, body.manage .repo-entry .re-dots { display: none !important; }
  body.manage .card .c-title[data-edit] { cursor: pointer; }
  .card.sel, .repo-entry.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .repo-entry.sel { border-radius: 6px; }
  .card.sel .sel-box, .repo-entry.sel .sel-box { background: var(--accent); border-color: var(--accent); color: #fff; }
  .manage-bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 12px;
    padding: 8px 12px; z-index: 45; box-shadow: var(--shadow); max-width: 94vw;
  }
  .manage-bar .m-count { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .manage-bar .m-group { display: flex; gap: 6px; align-items: center; }
  .manage-bar .m-group + .m-group { border-left: 1px solid var(--border); padding-left: 10px; }
  .manage-bar button {
    font-size: 12px; padding: 5px 10px; border-radius: 7px;
    border: 1px solid var(--border-strong); color: var(--text-2); transition: .15s; white-space: nowrap;
  }
  .manage-bar button:hover { color: var(--text); border-color: var(--text-3); }
  .manage-bar button.danger { color: var(--danger); border-color: var(--danger-soft); }
  .manage-bar button.danger:hover { border-color: var(--danger); }
  .summary .hint { margin-left: auto; }

  .board {
    flex: 1; min-height: 0;
    /* 列宽自适应（与 GitHub 看板 .gh-list 同一套机制）：
       auto-fill + minmax(min(100%, 300px), 1fr) —— 宽度够就并排放更多列，
       放不下的自动换到下一行；min() 里的 100% 保证列永不超过容器宽度，
       因此永远不会出现横向滚动条。
       min(100%, 300px) 里 100% 在前很关键：写成 min(300px, 100%) 时
       auto-fit 会把每行算成 1 列（百分比基准不同）。 */
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 13px; overflow-x: hidden; overflow-y: auto; padding-bottom: 2px;
    align-content: start;
  }
  .col {
    display: flex; flex-direction: column; min-height: 0;
    /* grid/flex 子项默认 min-width:auto 会拒绝收缩到内容以下，导致列被内容撑破、
       重新出现横向滚动条。这里显式归零，让列宽完全由 grid 决定（MDN: min-width:0）。*/
    min-width: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  }
  .col.col-orphan { border-style: dashed; background: transparent; }
  .col-orphan .ch-name { color: var(--warn); cursor: default; }
  .col-orphan .ch-acc .orphan-hint { font-size: 10.5px; color: var(--text-3); line-height: 1.5; }
  .col-head {
    flex: none; padding: 12px 14px 11px; border-bottom: 1px solid var(--border); min-width: 0;
  }
  .ch-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .ch-name { font-size: 14px; font-weight: 600; letter-spacing: .1px; overflow-wrap: anywhere; }
  .ch-place { font-size: 9.5px; color: var(--text-3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .ch-count { margin-left: auto; font-size: 11px; color: var(--text-3); }
  .ch-count b { color: var(--text); font-weight: 600; font-size: 13px; }
  .ch-acc { display: flex; gap: 6px; flex-wrap: wrap; }
  .acc {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px;
    padding: 2px 8px 2px 6px; border-radius: 6px; background: var(--panel-2);
    border: 1px solid var(--border); transition: border-color .15s;
  }
  .acc:hover { border-color: var(--border-strong); }
  .acc .pf { font-size: 9px; color: var(--text-3); letter-spacing: .3px; }
  .acc .an { font-weight: 500; color: var(--text-2); }
  .acc.empty .an { color: var(--text-3); font-weight: 400; }
  .acc .led { width: 5px; height: 5px; border-radius: 50%; background: var(--done); }
  .acc.empty .led { background: var(--text-3); }

  .col-body {
    /* 每列独立纵向滚动（经典看板形态：列头固定，卡片区自己滚） */
    flex: 1; min-height: 0; overflow-y: auto; padding: 10px; min-width: 0;
    display: flex; flex-direction: column; gap: 9px;
  }
  .col-empty { padding: 26px 10px; text-align: center; font-size: 11.5px; color: var(--text-3); }

  .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 13px; transition: border-color .15s;
  }
  .card:hover { border-color: var(--border-strong); }
  .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 13px; transition: border-color .15s; position: relative;
    min-width: 0;
  }
  .card:hover { border-color: var(--border-strong); }
  .card.p0 { border-left: 3px solid var(--danger); }
  .card.done { opacity: .55; cursor: default; }
  .card.done:hover { border-color: var(--border); }
  /* v16 卡面瘦身：只留 标题 / 元数据行 / 进度一句话 / 待办进度条，操作收进 hover */
  .c-title { font-size: 13.5px; font-weight: 600; line-height: 1.4; padding-right: 4px; overflow-wrap: anywhere; }
  .c-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 6px; font-size: 10.5px; color: var(--text-3); }
  .c-meta .prio { margin-top: 0; }
  /* 窄列时（列宽被自适应压缩）机器名/久未动标记允许换行，否则 nowrap 的最小内容宽度
     会把列撑破、重新出现横向滚动条 */
  .c-mach { white-space: nowrap; overflow-wrap: anywhere; }
  .stale { color: var(--warn); background: var(--warn-soft); border-radius: 4px; font-size: 10px; padding: 0 5px; line-height: 16px; white-space: nowrap; }
  .c-prog {
    margin-top: 7px; font-size: 12px; color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .c-todo { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .c-todo .bar { flex: 1; height: 4px; background: var(--panel-3); border-radius: 2px; overflow: hidden; }
  .c-todo .bar i { display: block; height: 100%; background: var(--done); border-radius: 2px; }
  .c-todo .tnum { font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums; flex: none; white-space: nowrap; }
  .c-actions { position: absolute; top: 8px; right: 9px; display: none; gap: 4px; align-items: center; }
  .card:hover .c-actions, .card:focus-within .c-actions { display: flex; }
  .c-actions .mini {
    font-size: 11px; padding: 3px 9px; border-radius: 6px;
    background: var(--panel-3); border: 1px solid var(--border-strong); color: var(--text-2);
  }
  .c-actions .mini:hover { color: var(--text); border-color: var(--text-3); }
  /* 空看板里的「清除筛选」按钮（不在 .c-actions 下，需要独立样式） */
  .col-empty .mini {
    margin-top: 9px; font-size: 11px; padding: 4px 11px; border-radius: 6px;
    background: var(--panel-3); border: 1px solid var(--border-strong); color: var(--text-2);
  }
  .col-empty .mini:hover { color: var(--text); border-color: var(--text-3); }
  .col-empty .clear-hint { color: var(--text-3); font-size: 11px; }
  .prio { font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 1px 5px; border-radius: 4px; flex: none; }
  .prio.p0 { color: #F0736F; background: rgba(240,115,111,.11); }
  .prio.p1 { color: var(--warn); background: rgba(240,162,46,.11); }
  .prio.p2 { color: var(--text-3); background: var(--panel-3); }
  .c-age { font-size: 10px; color: var(--text-3); white-space: nowrap; }
  .dots {
    width: 20px; height: 20px; flex: none; display: grid; place-items: center;
    border-radius: 5px; color: var(--text-3); font-size: 14px; line-height: 1;
  }
  .dots:hover { background: var(--panel-3); color: var(--text); }

  .ch-name[data-edit], .ch-place[data-edit], .c-title[data-edit] { cursor: text; }
  .ch-name[data-edit]:hover, .ch-place[data-edit]:hover {
    background: var(--panel-3); box-shadow: 0 0 0 3px var(--panel-3); border-radius: 4px;
  }
  .c-title[data-edit]:hover { color: var(--accent); }
  .ch-place.empty { color: var(--text-3); border-style: dashed; }
  .inline-input {
    font: inherit; color: var(--text); background: var(--panel-3);
    border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; outline: none;
    min-width: 56px; max-width: 100%; vertical-align: baseline;
  }
  .c-title .inline-input, input.c-title.inline-input { font-size: 13.5px; font-weight: 600; width: 100%; }
  .modal.sm { width: min(430px, 92vw); }
  .modal-body.pad { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .confirm-text { font-size: 12.5px; color: var(--text-2); line-height: 1.75; }

  .drag-handle {
    font-size: 12px; line-height: 1; color: var(--text-3); cursor: grab;
    letter-spacing: -1px; padding: 2px 3px; border-radius: 4px; user-select: none; flex: none;
  }
  .drag-handle:hover { color: var(--text); background: var(--panel-3); }
  .drag-handle:active { cursor: grabbing; }
  .card { cursor: grab; }
  .dragging { opacity: .42; }
  .col.dragging { outline: 1px dashed var(--accent); outline-offset: 2px; }
  .col-body.drag-over { background: var(--accent-soft); border-radius: 8px; }

  .c-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px;
    padding: 1px 7px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--panel-3); color: var(--text-3); white-space: nowrap;
  }
  .path { font-size: 10px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

  /* v16：进度一句话在卡面单行截断（.c-prog），待办用进度条（.c-todo）；旧的多行块已删 */
  .path { font-size: 10px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

  .todo-item { display: flex; align-items: flex-start; gap: 7px; padding: 3px 0; font-size: 11.5px; cursor: pointer; }
  .todo-item .box {
    width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border-strong);
    flex: none; margin-top: 2px; display: grid; place-items: center; font-size: 8px; color: transparent;
  }
  .todo-item .box.on { background: var(--done); border-color: var(--done); color: #06281E; }
  .todo-item .txt { color: var(--text-2); line-height: 1.45; }
  .todo-item.done .txt { text-decoration: line-through; color: var(--text-3); }
  .d-todos { background: var(--panel-3); border-radius: 7px; padding: 7px 10px; }

  /* ── 统一居中弹窗（Sheet）────────────────────────────────────────
     苹果规范落地（依据 Apple HIG + Apple Motion）：
     ① modal presentation 用 92%→100% scale + opacity，不是从边缘滑入；
     ② Materialize, don't just fade —— 玻璃表面进出时同时动画 blur 半径与 scale；
     ③ 空间一致性：进场与退场走同一条路径（都从中心缩放）；
     ④ 进出时长不对称：进场 340ms（spring 曲线，从容），退场 200ms（利落）；
     ⑤ 可中断：用 CSS transition 而非 keyframes，中途反向时从当前值接续。
     实现要点：transition 定义在「目标状态」上 —— .on 用进场合奏，非 .on 用退场合奏，
     于是同一个 class 切换自动获得不对称时长，不需要任何 JS 计时器或守卫。
     降级：prefers-reduced-motion → 只做 opacity 交叉淡入，去掉 scale 与 spring。
     磨砂玻璃四件套：blur + 半透明背景 + 1px 半透明边框 + 柔和阴影；
     blur 半径 14px（10–20px 是性能与观感的平衡区）；必须 @supports 与
     prefers-reduced-transparency 双重降级，不支持时退回实体深色背景保证对比度。 */
  .drawer-mask, .modal-mask {
    position: fixed; inset: 0;
    background: var(--mask-bg);
    opacity: 0; pointer-events: none;
    /* visibility 延迟到退场结束再落：关闭状态下元素完全不渲染，
       backdrop-filter 不产生持续开销；打开时 visibility 立刻生效，blur 才有动画起点。 */
    visibility: hidden;
    transition: opacity var(--dur-out) linear, backdrop-filter var(--dur-out) linear,
                visibility 0s linear var(--dur-out);
  }
  .drawer-mask.on, .modal-mask.on {
    opacity: 1; pointer-events: auto; visibility: visible;
    transition: opacity var(--dur-in) var(--ease-out), backdrop-filter var(--dur-in) var(--ease-out),
                visibility 0s linear 0s;
  }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .drawer-mask, .modal-mask {
      -webkit-backdrop-filter: blur(0px) saturate(100%);
      backdrop-filter: blur(0px) saturate(100%);
    }
    .drawer-mask.on, .modal-mask.on {
      -webkit-backdrop-filter: blur(14px) saturate(115%);
      backdrop-filter: blur(14px) saturate(115%);
    }
  }
  @media (prefers-reduced-transparency: reduce) {
    .drawer-mask, .modal-mask {
      -webkit-backdrop-filter: none; backdrop-filter: none;
      background: var(--mask-bg-solid);
    }
  }

  .drawer, .modal {
    position: fixed; left: 50%; top: 50%;
    width: min(680px, 92vw); max-height: min(84vh, 780px);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translate(-50%, -50%) scale(.92);
    opacity: 0; pointer-events: none; visibility: hidden;
    border: 1px solid var(--sheet-border); border-radius: 16px;
    background: var(--sheet-bg);
    box-shadow: var(--sheet-shadow);
    transition: transform var(--dur-out) var(--ease-out), opacity var(--dur-out) linear,
                visibility 0s linear var(--dur-out);
  }
  .drawer.on, .modal.on {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1; pointer-events: auto; visibility: visible;
    transition: transform var(--dur-in) var(--ease-spring), opacity var(--dur-in) var(--ease-out),
                visibility 0s linear 0s;
  }
  /* 层级：抽屉在底，确认框/添加电脑在其上（叠层时上层的遮罩不会和下层打架） */
  .drawer-mask { z-index: 40; }
  .drawer { z-index: 41; }
  .modal-mask { z-index: 44; }
  .modal { z-index: 45; }
  /* 内容多的面板（AI 指南、仓库详情）用更宽的版心 */
  .drawer.wide, .modal.wide { width: min(760px, 94vw); }
  .drawer.xl { width: min(1320px, 96vw); max-height: min(90vh, 880px); }
  .modal.sm { width: min(430px, 92vw); }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .drawer.on, .modal, .modal.on {
      transform: translate(-50%, -50%);
      transition: opacity 120ms linear, visibility 0s linear 0s;
    }
    .drawer:not(.on), .modal:not(.on) { transition: opacity 120ms linear, visibility 0s linear 120ms; }
    .drawer-mask, .drawer-mask.on, .modal-mask, .modal-mask.on {
      transition: opacity 120ms linear, visibility 0s linear 0s;
    }
    .drawer-mask:not(.on), .modal-mask:not(.on) { transition: opacity 120ms linear, visibility 0s linear 120ms; }
  }
  /* 标题栏：返回箭头（可选）| 标题 | 关闭。标题 flex:1 占满中间，关闭按钮自然靠右。 */
  .drawer-head { display: flex; align-items: center; gap: 9px; padding: 14px 17px; border-bottom: 1px solid var(--border); }
  .drawer-head h3 { font-size: 12.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-body { padding: 15px 17px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 13px; }
  .field label { display: block; font-size: 10.5px; color: var(--text-3); margin-bottom: 4px; font-weight: 500; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--panel-3); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 9px; font-size: 12px; outline: none; transition: border-color .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
  .field .hint { font-size: 10px; color: var(--text-3); margin-top: 3px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .drawer-foot { padding: 12px 17px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }

  /* ── 任务详情（只读态）──
     记录优先模式：点卡片先看只读详情，要改再点「编辑」。理由见 ARCHITECTURE.md。 */
  .dt-title { font-size: 16px; font-weight: 600; line-height: 1.45; color: var(--text); overflow-wrap: anywhere; }
  .dt-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .dt-tag {
    font-size: 10.5px; padding: 2px 8px; border-radius: 6px;
    background: var(--panel-3); border: 1px solid var(--border); color: var(--text-2);
  }
  .dt-tag.st-doing { color: var(--accent); border-color: var(--accent); }
  .dt-tag.st-done { color: var(--done); border-color: var(--done); }
  .dt-tag.prio-p0 { color: #F0736F; border-color: rgba(240,115,111,.4); background: rgba(240,115,111,.1); }
  .dt-tag.prio-p1 { color: var(--warn); border-color: rgba(240,162,46,.35); background: rgba(240,162,46,.09); }
  .dt-tag.prio-p2 { color: var(--text-3); }
  .dt-sec { border-top: 1px solid var(--border); padding-top: 12px; }
  .dt-sec:first-child { border-top: 0; padding-top: 0; }
  .dt-label { font-size: 10.5px; color: var(--text-3); font-weight: 500; margin-bottom: 5px; }
  .dt-text { font-size: 12.5px; color: var(--text-2); line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dt-text.muted { color: var(--text-3); }
  .dt-path {
    font-size: 11.5px; color: var(--text-2); font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    background: var(--panel-3); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px;
    overflow-wrap: anywhere;
  }
  .dt-todo { display: flex; flex-direction: column; gap: 5px; }
  .dt-todo-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--text-2); line-height: 1.6; }
  .dt-todo-row.done { color: var(--text-3); }
  .dt-todo-row.done .dt-todo-txt { text-decoration: line-through; }
  .dt-todo-mark {
    width: 15px; height: 15px; border-radius: 4px; flex: none; margin-top: 2px;
    border: 1px solid var(--border-strong); display: grid; place-items: center; font-size: 9px; color: transparent;
  }
  .dt-todo-row.done .dt-todo-mark { background: var(--done); border-color: var(--done); color: #06281E; }
  .dt-meta { font-size: 11px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 12px; }
  .btn-ghost { height: 33px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); color: var(--text-2); font-size: 12px; }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }
  .btn-ghost.danger:hover { color: #F0736F; border-color: #F0736F; }

  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { font-size: 13px; font-weight: 600; }
  .modal-body { overflow-y: auto; padding: 6px 0; min-height: 0; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px);
    background: var(--panel-3); border: 1px solid var(--border-strong); color: var(--text);
    padding: 8px 15px; border-radius: 8px; font-size: 12px; z-index: 60;
    opacity: 0; pointer-events: none; transition: .2s; box-shadow: var(--shadow);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  .menu {
    position: fixed; z-index: 50; background: var(--panel-3); border: 1px solid var(--border-strong);
    border-radius: 9px; padding: 5px; box-shadow: var(--shadow); min-width: 178px;
  }
  .menu .mh { font-size: 9.5px; color: var(--text-3); padding: 4px 9px 5px; letter-spacing: .5px; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 7px 9px; font-size: 12px; border-radius: 6px; text-align: left; }
  .menu button:hover { background: var(--accent-soft); color: var(--accent); }
  .menu .pick { width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); flex: none; }
  .menu .pick.cur { background: var(--accent); }

  .boot { flex: 1; display: grid; place-items: center; text-align: center; color: var(--text-3); font-size: 12.5px; line-height: 1.9; }

  @media (max-width: 1100px) {
    /* 窄屏：左右分屏叠回上下，整页滚动 */
    main.split { flex-direction: column; overflow-y: auto; }
    .split-divider { display: none; }
    .view { width: auto !important; overflow: visible; }
  }
  @media (max-width: 900px) {
    .row2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .board { grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
    .row2 { grid-template-columns: 1fr; }
    .topbar { flex-wrap: wrap; }
    .search { width: 100%; order: 3; }
  }

  /* ===== 左右分屏：左任务看板 / 右 GitHub 看板，中缝可拖 ===== */
  .view { min-width: 0; overflow-y: auto; padding: 12px 14px 40px; position: relative; }
  #viewBoard { flex: none; width: 58%; }
  #viewGithub { flex: 1; }
  .split-divider { flex: none; width: 10px; cursor: col-resize; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .split-divider::before { content: ''; width: 3px; height: 52px; border-radius: 3px; background: var(--border-strong); transition: background .15s, width .15s, height .15s; }
  .split-divider:hover::before, .split-divider.drag::before { background: var(--accent); width: 5px; height: 88px; }

  /* ===== 小标题：两栏对称；点击把本栏放到最大，再点还原 ===== */
  .sec-title {
    font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 0 10px;
    display: inline-flex; align-items: center; gap: 6px; letter-spacing: .02em;
    transition: color .15s;
  }
  .sec-title .mx {
    font-size: 10px; color: var(--text-3); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 4px; line-height: 15px; transition: .15s;
  }
  .sec-title:hover { color: var(--text); }
  .sec-title:hover .mx { color: var(--accent); border-color: var(--accent); }
  .sec-title.on { color: var(--text); }
  .sec-title.on .mx { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  /* ===== KPI 条：概览先行，点击即过滤 ===== */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 14px; text-align: left; transition: .15s; position: relative; min-width: 0;
  }
  .kpi:hover { border-color: var(--border-strong); }
  .kpi.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .kpi .num { display: block; font-size: 21px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi .lab { display: block; font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .kpi .hint { display: block; position: absolute; top: 11px; right: 12px; font-size: 10px; padding: 1px 6px; border-radius: 5px; color: var(--text-3); background: var(--panel-3); }
  .kpi.alert .num { color: var(--danger); }
  .kpi.alert .hint { color: var(--danger); background: var(--danger-soft); }
  .kpi.good .num { color: var(--ok); }
  .kpi.good .hint { color: var(--ok); background: var(--ok-soft); }
  .kpi.warn .num { color: var(--warn); }
  .kpi.warn .hint { color: var(--warn); background: var(--warn-soft); }

  .tabs { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; margin-bottom: 12px; }
  .tabs button { height: 26px; padding: 0 12px; border-radius: 7px; font-size: 12px; color: var(--text-2); transition: .15s; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { background: var(--accent); color: #fff; font-weight: 500; }

  .tabs { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
  .tabs button { height: 27px; padding: 0 13px; border-radius: 7px; font-size: 12.5px; color: var(--text-2); transition: .15s; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { background: var(--accent); color: #fff; font-weight: 500; }

  .gh-toolbar { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 2px 4px; }
  .gh-filter { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0 9px; height: 31px; }
  .gh-filter select { background: none; border: none; outline: none; font-size: 12px; color: var(--text); cursor: pointer; }
  .gh-filter label { font-size: 10.5px; color: var(--text-3); }

  /* ===== GitHub 概览数字：低调内联在工具栏，不抢视觉 ===== */
  .gh-kpis { display: inline-flex; align-items: center; gap: 13px; flex-wrap: wrap; min-width: 0; }
  .gh-kpis .kpi {
    display: inline-flex; align-items: baseline; gap: 4px; padding: 2px 6px;
    background: none; border: 1px solid transparent; border-radius: 6px;
    transition: .15s; min-width: 0;
  }
  .gh-kpis .kpi .num { display: inline; font-size: 13px; font-weight: 600; line-height: 1.2; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .gh-kpis .kpi .lab { display: inline; font-size: 10.5px; color: var(--text-3); margin-top: 0; }
  .gh-kpis .kpi .hint { display: none; }
  .gh-kpis .kpi:hover { border-color: var(--border); background: var(--panel); }
  .gh-kpis .kpi:hover .num { color: var(--text); }
  .gh-kpis .kpi.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: none; }
  .gh-kpis .kpi.on .num { color: var(--accent); }
  .gh-kpis .kpi.on .lab { color: var(--accent); }
  .gh-kpis .kpi.warn .num { color: var(--warn); }

  /* ===== 开发强度：多排方块格子热力（每排一段日期，旧→新），整块可点开全年日历 ===== */
  .gh-intensity {
    flex: none; cursor: pointer;
    display: flex; flex-direction: column; /* 头部在上，格子区 flex:1 撑满剩余高度 */
    margin: 2px 0 6px; padding: 9px 12px 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 11px;
    transition: border-color .15s;
  }
  .gh-intensity:hover { border-color: var(--border-strong); }
  .gi-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 5px; }
  .gi-label { display: flex; flex-direction: column; gap: 2px; }
  .gi-label b { font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .gi-label span { font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
  .gi-ranges { display: inline-flex; gap: 4px; margin-left: auto; }
  .gi-range {
    height: 21px; padding: 0 9px; border-radius: 6px;
    font-size: 11px; color: var(--text-3);
    background: none; border: 1px solid transparent; transition: .15s;
  }
  .gi-range:hover { color: var(--text); background: var(--panel-3); }
  .gi-range.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .gi-open { font-size: 10.5px; color: var(--text-3); white-space: nowrap; transition: .15s; }
  .gh-intensity:hover .gi-open { color: var(--accent); }
  /* 格子区：纵向堆排，每排平分剩余高度 —— 高度自适应，不写死 */
  .gi-rows { flex: 1; display: flex; flex-direction: column; gap: 5px; min-height: 0; }
  .gi-rowblock { flex: 1; display: flex; gap: 7px; min-height: 0; }
  .gi-rowlabel {
    flex: none; width: 36px; display: flex; align-items: center; justify-content: flex-end;
    font-size: 10px; color: var(--text-3); white-space: nowrap;
  }
  .gi-chart { display: flex; align-items: stretch; gap: 3px; flex: 1; min-height: 28px; }
  .gi-cell {
    flex: 1 1 0; min-width: 0; position: relative;
    border-radius: 4px; background: var(--panel-3);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .15s;
  }
  .gi-cell i {
    font-style: normal; font-weight: 600; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    font-size: var(--gi-num, 11px); /* 字号随格子尺寸自适应，由 fitGiNum() 写入 */
  }
  /* 格内小日期：钉在方块下边缘（几号），大数字保持正中 */
  .gi-cell em {
    position: absolute; left: 0; right: 0; bottom: 2px;
    font-style: normal; font-weight: 400; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    text-align: center;
    font-size: 8.5px; color: var(--text-3);
  }
  /* 未来日期：比零更新更浅，点不开的感觉 */
  .gi-cell.future { background: var(--panel); border: 1px dashed var(--border); }
  .gi-cell.future i { color: var(--text-3); font-weight: 400; }
  .gi-cell.l1 { background: color-mix(in srgb, var(--accent) 28%, var(--panel)); }
  .gi-cell.l2 { background: color-mix(in srgb, var(--accent) 48%, var(--panel)); }
  .gi-cell.l3 { background: color-mix(in srgb, var(--accent) 70%, var(--panel)); }
  .gi-cell.l4 { background: var(--accent); }
  .gi-cell.l1 i, .gi-cell.l2 i { color: var(--text); }
  .gi-cell.l3 i, .gi-cell.l4 i { color: #fff; }
  .gi-cell.l3 em, .gi-cell.l4 em { color: rgba(255, 255, 255, 0.75); }
  .gi-cell.future em { color: var(--text-3); opacity: .65; }
  .gi-empty { padding: 4px 0 2px; font-size: 11px; color: var(--text-3); }

  /* ===== 日历热力图（弹窗内）：行=周一到周日，列=周，颜色 5 档，按年展示 ===== */
  .hm-wrap { display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 2px; }
  .hm-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hm-nav { flex: none; display: inline-flex; align-items: center; gap: 8px; }
  .hm-nav b { font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
  .hm-navbtn {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--panel-3); border: 1px solid var(--border);
    font-size: 15px; line-height: 1; color: var(--text-2); transition: .15s;
  }
  .hm-navbtn:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); }
  .hm-navbtn:disabled { opacity: .35; cursor: default; }
  .hm-summary { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-2); }
  .hm-summary b { color: var(--text); font-weight: 600; }
  .hm-numtoggle {
    flex: none; height: 26px; padding: 0 12px; border-radius: 7px;
    font-size: 11.5px; color: var(--text-3);
    background: none; border: 1px solid var(--border); transition: .15s;
  }
  .hm-numtoggle:hover { color: var(--text); border-color: var(--border-strong); }
  .hm-numtoggle.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .hm-scroll { overflow-x: auto; padding-bottom: 4px; }
  .hm-months { position: relative; height: 15px; margin-left: 30px; }
  .hm-months span { position: absolute; top: 0; font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
  .hm-flex { display: flex; gap: 5px; }
  .hm-wds { flex: none; display: flex; flex-direction: column; gap: 3px; width: 25px; }
  .hm-wds span { height: 20px; font-size: 10px; line-height: 20px; color: var(--text-3); }
  .hm-grid { display: flex; gap: 3px; }
  .hm-week { display: flex; flex-direction: column; gap: 3px; }
  .hm {
    position: relative; width: 20px; height: 20px; border-radius: 4px;
    background: var(--panel-3);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .hm.blank { background: none; }
  .hm.l0 { background: var(--panel-3); }
  .hm.l1 { background: color-mix(in srgb, var(--accent) 28%, var(--panel)); }
  .hm.l2 { background: color-mix(in srgb, var(--accent) 48%, var(--panel)); }
  .hm.l3 { background: color-mix(in srgb, var(--accent) 70%, var(--panel)); }
  .hm.l4 { background: var(--accent); }
  .hm i { font-style: normal; font-size: 10px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  /* 数字配色跟随档位底色：浅底深字、深底白字（两套主题都成立） */
  .hm.l1 i, .hm.l2 i { color: var(--text); }
  .hm.l3 i, .hm.l4 i { color: #fff; }
  .hm.l0 i { color: var(--text-3); }
  .hm:not(.blank) { cursor: default; }
  .hm-legend { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-3); }
  .hm-legend .hm { width: 12px; height: 12px; border-radius: 3px; }
  .hm-tip {
    position: fixed; z-index: 90; display: none; pointer-events: none;
    padding: 5px 9px; border-radius: 7px;
    background: var(--mask-bg-solid, #1c1c1e); color: #fff;
    font-size: 11px; line-height: 1.5; white-space: nowrap;
    border: 1px solid var(--border-strong);
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  .hm-tip b { margin-right: 7px; font-variant-numeric: tabular-nums; }

  .gh-list { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; align-content: start; padding: 6px 2px 4px; }
  .gh-card { background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; transition: border-color .15s; }
  .gh-card:hover { border-color: var(--border-strong); }
  .gh-top { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; flex-wrap: wrap; }
  .gh-time { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .gh-time .sub { font-size: 10.5px; color: var(--text-3); font-weight: 400; margin-left: 7px; }
  .gh-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; }
  .gh-content { font-size: 12.5px; color: var(--text-2); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .badge.ok { color: var(--done); border-color: color-mix(in srgb, var(--done) 36%, transparent); background: var(--done-soft); }
  .badge.fail { color: #F0736F; border-color: color-mix(in srgb, #F0736F 36%, transparent); background: rgba(240,115,111,.12); }
  .badge.part { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 32%, transparent); background: rgba(240,162,46,.11); }
  .gh-ver { font-size: 10px; padding: 1px 7px; border-radius: 5px; background: var(--panel-3); border: 1px solid var(--border); color: var(--text-2); }
  .gh-ver b { color: var(--text); font-weight: 600; }

  /* 仓库卡片 */
  /* 仓库卡片：判定范围是整张卡片（跟任务看板的 .card 一致），
     所以卡片本身给 pointer 光标 + hover 时仓库名变主色，作为「可点」的视觉反馈。 */
  .repo-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 15px; display: flex; flex-direction: column; gap: 9px; min-width: 0; cursor: pointer; }
  .repo-card:hover { border-color: var(--border-strong); }
  .repo-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .repo-name {
    font-size: 14px; font-weight: 600; letter-spacing: .1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; transition: color .15s;
  }
  .repo-card:hover .repo-name { color: var(--accent); }
  /* 复制链接：独立按钮，不再藏在仓库名的 hover 提示里 */
  .repo-copy {
    flex: none; font-size: 10.5px; color: var(--text-3); white-space: nowrap;
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px;
    transition: color .15s, border-color .15s;
  }
  .repo-copy:hover { color: var(--accent); border-color: var(--accent); }
  .repo-count { margin-left: auto; flex: none; font-size: 10.5px; color: var(--text-3); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
  .repo-unsync { flex: none; font-size: 10.5px; font-weight: 500; color: var(--warn); background: var(--warn-soft); border-radius: 5px; padding: 1px 6px; }
  .repo-del {
    display: none; flex: none; font-size: 10.5px; color: var(--danger);
    border: 1px solid var(--danger-soft); background: var(--danger-soft); border-radius: 5px; padding: 1px 6px;
  }
  body.manage .repo-del { display: inline-flex; }
  .repo-del:hover { border-color: var(--danger); }
  .archtag { flex: none; font-size: 10.5px; color: var(--text-3); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
  .repo-sub { font-size: 11px; color: var(--text-3); }
  .repo-sub .sub { margin-left: 7px; }
  .repo-vers { display: flex; gap: 5px; flex-wrap: wrap; }
  .repo-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .repo-entries { display: flex; flex-direction: column; gap: 1px; border-top: 1px solid var(--border); padding-top: 7px; }
  .repo-entry { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-2); padding: 4px 0; min-width: 0; }
  .repo-entry .re-time { color: var(--text-3); flex: none; font-variant-numeric: tabular-nums; }
  .repo-entry .re-ver { color: var(--text); font-weight: 500; flex: none; }
  .repo-entry .re-res { flex: none; font-size: 10px; line-height: 15px; padding: 0 5px; border-radius: 4px; }
  .repo-entry .re-res.ok { color: var(--done); background: var(--done-soft); }
  .repo-entry .re-res.un { color: var(--warn); background: var(--warn-soft); }
  .repo-entry .re-who { color: var(--text-3); flex: none; white-space: nowrap; }
  .repo-entry .re-content { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .repo-entry .re-dots { width: 18px; height: 18px; font-size: 13px; margin: 0; }
  .repo-foot { display: flex; align-items: center; gap: 12px; }
  .link-btn { font-size: 11.5px; color: var(--accent); padding: 2px 0; }
  .link-btn:hover { text-decoration: underline; }
  .repo-foot .link-btn:last-child { margin-left: auto; }

  /* ── 仓库详情弹窗里的记录列表 ──
     每行是一条同步记录，点它进编辑态（和任务详情→编辑是同一套交互）。 */
  .rd-list { display: flex; flex-direction: column; gap: 1px; }
  .rd-row {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    font-size: 11.5px; color: var(--text-2); padding: 7px 9px;
    border-radius: 7px; border: 1px solid transparent; min-width: 0;
    transition: background .13s, border-color .13s;
  }
  .rd-row:hover { background: var(--panel-3); border-color: var(--border); }
  .rd-row .rd-time { color: var(--text-3); flex: none; font-variant-numeric: tabular-nums; width: 96px; }
  .rd-row .rd-ver { color: var(--text); font-weight: 500; flex: none; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-row .re-res { flex: none; font-size: 10px; line-height: 15px; padding: 0 5px; border-radius: 4px; }
  .rd-row .re-res.ok { color: var(--done); background: var(--done-soft); }
  .rd-row .re-res.un { color: var(--warn); background: var(--warn-soft); }
  .rd-row .rd-content { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-row .rd-chev { color: var(--text-3); flex: none; font-size: 14px; }
  .repo-name { cursor: pointer; }
</style>
</head>
