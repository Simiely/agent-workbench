  // 归一化：去空格、转小写，两边都归一再查表
  function enumNorm(v) { return String(v == null ? '' : v).replace(/\s/g, '').toLowerCase(); }
  function resolveEnum(field, raw) {
    var v = String(raw == null ? '' : raw).replace(/^\s+|\s+$/g, '');
    if (!v) return null;
    if (IMP_ENUMS[field] && IMP_ENUMS[field].indexOf(v) >= 0) return v;
    var map = IMP_ENUM_MAP[field] || {};
    var hit = map[enumNorm(v)];
    if (hit) return hit;
    // 再宽容一层：模糊包含（「高优先级」→ P0，「已同步到远程」→ 已同步）
    var n = enumNorm(v);
    for (var k in map) { if (n.indexOf(k) >= 0 || k.indexOf(n) >= 0) return map[k]; }
    return null;
  }

  // 相似度：0~1。中文按字符 bigram 比（单字比会高估，「本地」和「本机」会撞）
  function similarity(a, b) {
    a = String(a || ''); b = String(b || '');
    if (a === b) return 1;
    if (!a || !b) return 0;
    function gram(x) {
      var s = String(x).replace(/\s/g, '').toLowerCase(), out = {};
      if (s.length === 1) { out[s] = 1; return out; }
      for (var i = 0; i < s.length - 1; i++) out[s.substr(i, 2)] = (out[s.substr(i, 2)] || 0) + 1;
      return out;
    }
    var ga = gram(a), gb = gram(b), inter = 0, sa = 0, sb = 0, k;
    for (k in ga) { sa += ga[k]; if (gb[k]) inter += Math.min(ga[k], gb[k]); }
    for (k in gb) sb += gb[k];
    return (sa + sb) ? (2 * inter) / (sa + sb) : 0;
  }
  // 匹配阈值：≥AUTO 自动命中；≥SUGGEST 列候选让人点；低于则按新建
  var MATCH_AUTO = 0.85, MATCH_SUGGEST = 0.6;

  // 在标题里找最像的那张卡。返回 {rec, score} 或 null
  function bestTaskMatch(title) {
    var best = null, bs = 0;
    for (var i = 0; i < S.data.tasks.length; i++) {
      var sc = similarity(title, txt(S.data.tasks[i][F.t.title]));
      if (sc > bs) { bs = sc; best = S.data.tasks[i]; }
    }
    return bs >= MATCH_SUGGEST ? { rec: best, score: bs } : null;
  }
  function bestMachineMatch(name) {
    var best = null, bs = 0;
    for (var i = 0; i < S.data.machines.length; i++) {
      var sc = similarity(name, txt(S.data.machines[i][F.m.name]));
      if (sc > bs) { bs = sc; best = S.data.machines[i]; }
    }
    return bs >= MATCH_SUGGEST ? { rec: best, score: bs } : null;
  }
  // 版本号归一化：AI 写 1.5.9 / v1.5.9 / 1.5.9-beta 都要能跟库里的 v1.5.9 对上
  function verNorm(v) {
    return String(v == null ? '' : v).replace(/^\s+|\s+$/g, '').replace(/^[vV]/, '').toLowerCase();
  }
  // 同步块定位：仓库精确 + 版本归一化比对；都不中就在同仓库里取最近一条
  function findGhFlexible(repo, ver) {
    var r = String(repo || '').replace(/^\s+|\s+$/g, '');
    var v = verNorm(ver);
    var pool = [], i;
    for (i = 0; i < S.data.gh.length; i++) {
      if (txt(S.data.gh[i][F.g.repo]).replace(/^\s+|\s+$/g, '') === r) pool.push(S.data.gh[i]);
    }
    if (!pool.length) {
      // 仓库名也容错一次：大小写 / 去空格后比对
      var rn = String(r).replace(/\s/g, '').toLowerCase();
      for (i = 0; i < S.data.gh.length; i++) {
        if (String(txt(S.data.gh[i][F.g.repo])).replace(/\s/g, '').toLowerCase() === rn) pool.push(S.data.gh[i]);
      }
    }
    if (!pool.length) return null;
    if (v) {
      for (i = 0; i < pool.length; i++) {
        if (verNorm(pool[i][F.g.versions]).indexOf(v) >= 0 || v.indexOf(verNorm(pool[i][F.g.versions])) >= 0) {
          return { rec: pool[i], exact: true };
        }
      }
    }
    // 版本对不上：给该仓库最近一条，让人确认
    var latest = pool[0], lt = 0;
    for (i = 0; i < pool.length; i++) {
      var t = toTime(normDate(pool[i][F.g.time]));
      if (t >= lt) { lt = t; latest = pool[i]; }
    }
    return { rec: latest, exact: false };
  }
  // 「建议」：只用于在报错里提示人（不自动采用）。机器不猜，但帮人一眼看出写歪在哪。
  function machineSuggest(name) {
    var m = bestMachineMatch(name);
    return (m && m.score >= 0.5) ? txt(m.rec[F.m.name]) : '';
  }
  function taskSuggest(title) {
    var m = bestTaskMatch(title);
    return (m && m.score >= 0.5) ? txt(m.rec[F.t.title]) : '';
  }
  // 电脑名定位：精确 → 本批新建 → 模糊。返回 {name, kind}
  // kind: 'exact' 已有 / 'batch' 本批新建 / 'fuzzy' 匹配到已有(改写) / 'new' 需新建
  function resolveMachine(name, available, batchNew) {
    var v = String(name || '').replace(/^\s+|\s+$/g, '');
    if (!v) return null;
    if (available[v]) return { name: v, kind: 'exact' };
    if (batchNew[v]) return { name: v, kind: 'batch' };
    var m = bestMachineMatch(v);
    if (m && m.score >= MATCH_AUTO) return { name: txt(m.rec[F.m.name]), kind: 'fuzzy', score: m.score, from: v };
    if (m) return { name: txt(m.rec[F.m.name]), kind: 'fuzzy-suggest', score: m.score, from: v };
    return { name: v, kind: 'new' };
  }
  // 「最近用过的电脑」：AI 完全没写电脑时兜底用这个，而不是直接判废
  function defaultMachine() {
    var best = null, bt = -1, i;
    for (i = 0; i < S.data.tasks.length; i++) {
      var t = toTime(normDate(S.data.tasks[i][F.t.updated]));
      if (t > bt) { bt = t; best = txt(S.data.tasks[i][F.t.machine]); }
    }
    if (best) return best;
    var ms = sortedMachines();
    return ms.length ? txt(ms[0][F.m.name]) : '';
  }

  // 时间解析：AI 知道自己什么时候做的，允许它写回真实时间（补录历史数据时尤其需要）。
  // 服务端默认补「当前时间」，写了就用写的。解析不出来 → 返回 null，整块拦下，
  // 别把非法字符串写进库里（那样卡片会永远显示「—」）。
  function parseImpTime(s) {
    var v = String(s == null ? '' : s).replace(/^\s+|\s+$/g, '');
    if (!v) return '';
    var t = Date.parse(v);
    if (isNaN(t)) return null;
    return new Date(t).toISOString();
  }
  // 布尔解析：认 是/否 与 true/false 两类写法，认不出返回 null（按错误处理，不猜）
  function parseImpBool(s) {
    var v = String(s == null ? '' : s).replace(/^\s+|\s+$/g, '').toLowerCase();
    if (v === '是' || v === 'true' || v === '1' || v === 'yes' || v === 'y' || v === '√' || v === '勾') return true;
    if (v === '否' || v === 'false' || v === '0' || v === 'no' || v === 'n' || v === '×') return false;
    return null;
  }

  var IMP_SAMPLE_EMPTY = [
    '## 电脑（新建）',
    '机器名：台式机-家',
    '位置：家',
    '',
    '## 任务（新建）',
    '标题：合并 floorplan 低频工具',
    '电脑：台式机-家',
    '进度：paint/fill/sample/split 已合并成多步流程',
    '',
    '## 同步（新建）',
    '仓库：Simiely/ae-tools',
    '电脑：台式机-家',
    '版本：v1.5.9',
    '内容：低频工具合并后补一次同步'
  ].join('\n');

  var IMP_SAMPLE = [
    '## 任务（更新）',
    '编号：<照抄现状里的 #xxx>',
    '进度：CHANGELOG 与测试文件已同步，等沙箱验证',
    '待办：',
    '[x] 版本号对齐 v1.5.8',
    '[ ] 沙箱验证后推 remote',
    '',
    '## 任务（新建）',
    '标题：合并 floorplan 低频工具',
    '电脑：台式机-家',
    '进度：paint/fill/sample/split 已合并成多步流程',
    '待办：',
    '[ ] 渲染端与模块源码对齐',
    '',
    '## 同步（新建）',
    '仓库：Simiely/ae-tools',
    '电脑：台式机-家',
    '版本：v1.5.9',
    '内容：低频工具合并后补一次同步',
    '状态：未同步'
  ].join('\n');

  // 第一步：纯文本 → 块结构。只管切分，不校验业务含义。
  function parseImportText(text) {
    var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    var items = [], errors = [], cur = null;
    function flush() { if (cur) { items.push(cur); cur = null; } }
    for (var i = 0; i < lines.length; i++) {
      var t = String(lines[i]).replace(/^\s+|\s+$/g, '');
      if (!t) continue;
      var mh = t.match(/^#{1,3}\s*(.*)$/);
      if (mh) {
        flush();
        var head = mh[1].replace(/^\s+|\s+$/g, '');
        // 块头要能认出写的是哪张表 + 是新建还是更新；认不出就单独报错，不猜。
        // 顺序有讲究：先判「账号」再判「同步」——「账号」块里含「电脑」键但块头不含，
        // 而「同步」块头里可能出现「仓库」，不能让它抢在「账号」前面。
        var kind = '';
        if (/账号|登录/i.test(head)) kind = 'account';
        else if (/电脑|机器|主机/i.test(head)) kind = 'machine';
        else if (/同步|仓库|Github|github/i.test(head)) kind = 'gh';
        else if (/任务|卡片|待办/i.test(head)) kind = 'task';
        var act = /更新|修改|续写|补充/.test(head) ? 'update' : 'create';
        if (!kind) {
          errors.push({ line: i + 1, msg: '认不出这是「任务 / 同步 / 电脑 / 账号」（块头写清楚）', raw: head });
          continue;
        }
        cur = { kind: kind, act: act, fields: {}, todos: [], line: i + 1, head: head };
        continue;
      }
      // 块头之前的游离行：原来直接 `continue` 静默忽略——
      // 用户写了待办/字段，界面显示「新增 1 条」看起来成功，内容却没了（实测确认）。
      // 静默丢数据比报错更糟：改成明确报出来。
      if (!cur) {
        var isTodo = /^\[(x|X|\s*)\]/.test(t);
        errors.push({
          line: i + 1,
          msg: (isTodo ? '这行待办不在任何块里（前面没有 ## 块头），不会被写入' : '这行不在任何块里（前面没有 ## 块头），不会被写入'),
          raw: t
        });
        continue;
      }
      var mt = t.match(/^\[(x|X|\s*)\]\s*(.*)$/);
      if (mt) { cur.todos.push({ done: /x/i.test(mt[1]), text: mt[2].replace(/^\s+|\s+$/g, '') }); continue; }
      var mk = t.match(/^([^：:]{1,12})[：:]\s*(.*)$/);
      if (mk) {
        cur.fields[String(mk[1]).replace(/^\s+|\s+$/g, '')] = String(mk[2]).replace(/^\s+|\s+$/g, '');
        continue;
      }
      errors.push({ line: i + 1, msg: '这行看不懂（要写成「字段名：值」或 [ ] 待办）', raw: t });
    }
    flush();
    return { items: items, errors: errors };
  }

  function findTaskByTitle(title) {
    var k = String(title || '').replace(/^\s+|\s+$/g, '');
    if (!k) return null;
    for (var i = 0; i < S.data.tasks.length; i++) {
      if (txt(S.data.tasks[i][F.t.title]).replace(/^\s+|\s+$/g, '') === k) return S.data.tasks[i];
    }
    return null;
  }
  function findGhByRepoVer(repo, ver) {
    var r = String(repo || '').replace(/^\s+|\s+$/g, '');
    var v = String(ver || '').replace(/^\s+|\s+$/g, '');
    if (!r) return null;
    for (var i = 0; i < S.data.gh.length; i++) {
      var g = S.data.gh[i];
      if (txt(g[F.g.repo]).replace(/^\s+|\s+$/g, '') !== r) continue;
      if (v && txt(g[F.g.versions]).indexOf(v) < 0) continue;
      return g;
    }
    return null;
  }

  function findMachineByName(name) {
    var k = String(name || '').replace(/^\s+|\s+$/g, '');
    if (!k) return null;
    for (var i = 0; i < S.data.machines.length; i++) {
      if (txt(S.data.machines[i][F.m.name]).replace(/^\s+|\s+$/g, '') === k) return S.data.machines[i];
    }
    return null;
  }

  // 第二步：块结构 → 可执行的变更计划。定位、补全默认值、校验都在这里，
  // 出错的块单独标 err，不影响其它块（批量导入最怕一处错整批废掉）。
  function buildImportPlan(parsed) {
    var plan = [], keys, i, k;
    var machineNames = {};
    for (i = 0; i < S.data.machines.length; i++) machineNames[txt(S.data.machines[i][F.m.name])] = 1;
    // 本批要新建的电脑名：计划是一次性构建的，后面若出现「改这台电脑」的块，
    // 目标此刻还不存在，需要给出可操作的提示而不是干巴巴的「找不到」。
    var batchNewMachines = {};
    for (i = 0; i < parsed.items.length; i++) {
      if (parsed.items[i].kind === 'machine' && parsed.items[i].act === 'create') {
        var bn = String(parsed.items[i].fields['机器名'] || parsed.items[i].fields['电脑'] || '').replace(/^\s+|\s+$/g, '');
        if (bn) batchNewMachines[bn] = 1;
      }
    }
    // 校验口径 = 库里已有的 ∪ 本批要新建的。
    // 少了后半截，空库首次导入时任务/账号/同步块会全部因「电脑没登记过」被拦下，
    // 只剩电脑块自己成功（表现：提示「成功 1 条」，其余全废）。
    var availableMachines = {};
    for (k in machineNames) availableMachines[k] = 1;
    for (k in batchNewMachines) availableMachines[k] = 1;
    // 本批新建/改名的任务标题。计划是一次性构建的，本批新建的卡此刻还没落库，
    // 后面的「更新」块引用它必然找不到——与空库电脑死锁是同一类问题。
    var batchTaskTitles = {};
    for (i = 0; i < parsed.items.length; i++) {
      if (parsed.items[i].kind !== 'task') continue;
      var bt = String(parsed.items[i].fields['标题'] || parsed.items[i].fields['新标题'] || '').replace(/^\s+|\s+$/g, '');
      // 只记第一次出现的行号：记最后一次的话，同名的第二块查到自己（line 不小于自己），
      // 判断恒为 false，查重就失效了（实测确认：两块同名仍报「新增 2 条」）
      if (bt && !batchTaskTitles[bt]) batchTaskTitles[bt] = parsed.items[i].line;
    }
    // 报错时列哪些名字：只列库里已有的（本批新建的还没落库，列出来像已存在会误导）。
    // 一个都没有时给可操作的引导，而不是「可用：」后面空着。
    var knownList = Object.keys(machineNames).join('、');
    // 报错要「可执行」：只说「写个电脑块」没用——用户/AI 不知道那块长什么样。
    // 直接给出可照抄的模板。
    function machineHint(name) {
      if (knownList) return '电脑「' + name + '」没登记过（可用：' + knownList + '）';
      return '电脑「' + name + '」没登记过——库里还没有任何电脑。'
        + '请在文本最前面补：## 电脑（新建）→ 机器名：' + name + '（位置：可留空），再写任务/同步块';
    }
    // 缺「电脑」键时的引导，同理给模板
    function machineMissingHint() {
      if (knownList) return '缺「电脑」（可用：' + knownList + '）';
      return '缺「电脑」——库里还没有任何电脑，请先写「## 电脑（新建）」块：机器名：<电脑名>（位置：可留空）';
    }

    for (i = 0; i < parsed.items.length; i++) {
      var it = parsed.items[i];
      keys = IMP_KEYS[it.kind];
      var p = { kind: it.kind, act: it.act, line: it.line, props: {}, todos: it.todos,
                err: null, target: null, label: '', newTitle: '', notes: [] };
      var unknown = [];
      for (k in it.fields) {
        var val = it.fields[k];
        if (k in keys) {
          if (keys[k] === '__newTitle') { p.newTitle = val; continue; }
          if (keys[k] === '__newName') { p.newName = val; continue; }
          if (keys[k] === '__id') { p.impId = String(val).replace(/^#/, '').replace(/^\s+|\s+$/g, ''); continue; }
          if (keys[k] === '__todos') continue; // 真正的待办在 it.todos 里，这里的值只是空标记
          p.props[keys[k]] = val;
          continue;
        }
        // 「时间」是块类型相关的：任务→更新时间，同步→同步时间。AI 只写「时间：」这一个词
        if (k === '时间' || k === '更新时间' || k === '同步时间') {
          var tf = IMP_TIME[it.kind];
          if (!tf) { unknown.push(k); continue; }
          var tv = parseImpTime(val);
          if (tv === null) { p.err = '「时间」看不懂：' + val + '（写成 2026-11-02 或 2026-11-02 14:30）'; break; }
          if (tv) p.props[tf] = tv;
          continue;
        }
        var bmap = IMP_BOOL[it.kind] || {};
        if (k in bmap) {
          var bv = parseImpBool(val);
          if (bv === null) { p.err = '「' + k + '」只能填 是 / 否，这里写的是：' + val; break; }
          p.props[bmap[k]] = bv;
          continue;
        }
        unknown.push(k);
      }
      if (p.err) { plan.push(p); continue; }
      // 同步记录没有「更新」。必须在「认不出的字段」之前拦：
      // 否则写「## 同步（更新）」+ 任意字段，都会被报成字段名不认识，
      // 用户会一直改字段名而不知道真正的问题是动作写错了
      if (it.kind === 'gh' && it.act === 'update') {
        p.err = '同步记录不支持「更新」——一次同步 = 一个版本的一条记录，只能写「## 同步（新建）」';
        plan.push(p); continue;
      }
      if (unknown.length) {
        // 只说「认不出」不够，要顺带给出这个块能写哪些键，否则用户只能猜
        var canUse = [];
        for (var uk in IMP_KEYS[it.kind]) if (IMP_KEYS[it.kind][uk].indexOf('__') !== 0) canUse.push(uk);
        for (var ub in (IMP_BOOL[it.kind] || {})) canUse.push(ub);
        if (IMP_TIME[it.kind]) canUse.push('时间');
        p.err = '认不出的字段：' + unknown.join('、') + '——这个块能写的键只有：' + canUse.join('、');
        plan.push(p); continue;
      }

      // ── 枚举：严格校验。认不出就报错，但用容错表给出「是不是想写 X」的建议 —— 
      // 建议只给人看，机器不擅自采用。
      for (k in p.props) {
        if (!IMP_ENUMS[k] || p.props[k] === '' || p.props[k] == null) continue;
        if (IMP_ENUMS[k].indexOf(p.props[k]) >= 0) continue;
        var guess = resolveEnum(k, p.props[k]);
        p.err = k + '只能填 ' + IMP_ENUMS[k].join(' / ') + '，这里写的是「' + p.props[k] + '」' +
          (guess ? '——是不是想写 ' + guess + '？' : '');
        break;
      }
      if (p.err) { plan.push(p); continue; }

      if (it.kind === 'machine') {
        var mname = p.props['机器名'] || '';
        if (!mname) { p.err = '缺「机器名」'; plan.push(p); continue; }
        if (it.act === 'update') {
          p.target = findMachineByName(mname);
          if (!p.target && batchNewMachines[mname]) {
            // 本批新建过这台电脑 → 合并成一次新建（等价于「改名后建」），不判废
            p.target = null; p.act = 'create'; p.label = p.newName || mname;
            if (p.newName) { p.props['机器名'] = p.newName; p.newName = ''; }
          } else if (!p.target) {
            var ms0 = machineSuggest(mname);
            p.err = '找不到电脑「' + mname + '」' + (ms0 ? '（是不是想写 ' + ms0 + '？）'
              : (knownList ? '（可用：' + knownList + '）' : '——库里还没有任何电脑，请先写一个「## 电脑（新建）」块登记'));
            plan.push(p); continue;
          } else {
            p.label = mname;
          }
          if (p.act === 'update') {
            if (p.newName) p.props['机器名'] = p.newName;
            else delete p.props['机器名'];
          }
        } else {
          if (machineNames[mname]) { p.err = '电脑「' + mname + '」已经存在，要改它请写「（更新）」'; plan.push(p); continue; }
          p.label = mname;
        }
      } else if (it.kind === 'account') {
        var aname = p.props['账号名'] || '';
        if (!aname) { p.err = '缺「账号名」'; plan.push(p); continue; }
        if (!p.props['平台']) { p.err = '缺「平台」（只能填 WorkBuddy / TRAE）'; plan.push(p); continue; }
        if (!p.props['所属电脑']) { p.err = '缺「电脑」'; plan.push(p); continue; }
        if (!availableMachines[String(p.props['所属电脑']).replace(/^\s+|\s+$/g, '')]) {
          var as0 = machineSuggest(p.props['所属电脑']);
          p.err = '电脑「' + p.props['所属电脑'] + '」没登记过' + (as0 ? '（是不是想写 ' + as0 + '？）'
            : (knownList ? '（可用：' + knownList + '）' : '——请先写一个「## 电脑（新建）」块登记'));
          plan.push(p); continue;
        }
        if (it.act === 'update') {
          p.err = '账号只支持新建登记（改名是全局的、解绑只删本机那条，请在账号面板里操作）';
          plan.push(p); continue;
        }
        p.label = aname + '（' + p.props['平台'] + ' · ' + p.props['所属电脑'] + '）';
      } else if (it.kind === 'task') {
        var title = p.props['任务标题'] || '';
        if (!title && !(it.act === 'update' && p.impId)) {
          p.err = '缺「标题」（新建要写标题；更新可用「编号」或「标题」定位）';
          plan.push(p); continue;
        }
        // 注意：不能在这里 delete 标题——新建块还要靠它入库。
        // 更新块的「定位用标题」在下面 update 分支里单独删。
        if (it.act === 'update') {
          // 编号优先：它是短数字，不会抄错；标题只在没编号时才用
          if (p.impId) {
            p.target = findTaskByOutlineId(p.impId);
            if (!p.target) {
              p.err = '编号 #' + p.impId + ' 对不上任何任务（编号是卡片 id，请照抄现状里的 #xxx，不要自己编）';
              plan.push(p); continue;
            }
            p.label = txt(p.target[F.t.title]);
          } else {
            p.target = findTaskByTitle(title);
          }
          if (!p.target && !p.err) {
            var ts0 = taskSuggest(title);
            p.err = '找不到标题为「' + title + '」的任务' + (ts0 ? '（是不是想写「' + ts0 + '」？标题要一字不差）'
              : (batchTaskTitles[title]
                 ? '——这是本批第 ' + batchTaskTitles[title] + ' 行新建的卡，此刻还没落库。'
                   + '请把两块合并成一个「（新建）」块，或分成两次导入'
                 : '——上面现状里没有它，要新建请写「（新建）」'));
            plan.push(p); continue;
          }
          // 用编号定位时 label 已由目标卡的标题填好（此时 title 是空的），别用空串覆盖掉
          if (!p.impId) p.label = title;
          if (p.newTitle) p.props['任务标题'] = p.newTitle;
          else delete p.props['任务标题'];
        } else {
          if (!title) { p.err = '缺「标题」'; plan.push(p); continue; }
          if (findTaskByTitle(title)) { p.err = '已经有同名任务「' + title + '」了，要续写请写「（更新）」'; plan.push(p); continue; }
          // 本批内也要查重：只查库里的话，同批写两块同名「新建」会造出两张重名卡
          // （库里重名被拦、本批重名不拦，两条路径行为不一致）。实测确认。
          if (batchTaskTitles[title] && batchTaskTitles[title] < it.line) {
            p.err = '本批第 ' + batchTaskTitles[title] + ' 行已经新建了同名任务「' + title + '」——'
              + '要分两张卡请改个标题，要续写请合并成一个块';
            plan.push(p); continue;
          }
          if (!p.props['状态']) p.props['状态'] = IMP_DEFAULTS['状态'];
          if (!p.props['优先级']) p.props['优先级'] = IMP_DEFAULTS['优先级'];
          p.label = title;
        }
        if ('所在电脑' in p.props && p.props['所在电脑']) {
          if (!availableMachines[String(p.props['所在电脑']).replace(/^\s+|\s+$/g, '')]) {
            var ts1 = machineSuggest(p.props['所在电脑']);
            p.err = '电脑「' + p.props['所在电脑'] + '」没登记过' + (ts1 ? '（是不是想写 ' + ts1 + '？）'
              : (knownList ? '（可用：' + knownList + '）' : '——请先写一个「## 电脑（新建）」块登记'));
            plan.push(p); continue;
          }
        } else if (it.act === 'create') {
          p.err = knownList ? '缺「电脑」（可用：' + knownList + '）'
            : machineMissingHint();
          plan.push(p); continue;
        }
      } else {
        var repo = p.props['仓库'] || '';
        if (!repo) { p.err = '缺「仓库」'; plan.push(p); continue; }
        if (it.act === 'update') {
          var fg = findGhFlexible(repo, p.props['同步版本']);
          if (!fg) {
            p.err = '找不到这个仓库' + (p.props['同步版本'] ? '下版本为 ' + p.props['同步版本'] + ' 的' : '的') + '同步记录';
            plan.push(p); continue;
          }
          if (!fg.exact) {
            p.err = '这个仓库下没有版本为 ' + p.props['同步版本'] + ' 的记录（最近一条是 ' +
              (txt(fg.rec[F.g.versions]) || '—') + '）——版本要能对上';
            plan.push(p); continue;
          }
          p.target = fg.rec;
          p.label = repo + (p.props['同步版本'] ? ' ' + p.props['同步版本'] : '');
        } else {
          p.label = repo + (p.props['同步版本'] ? ' ' + p.props['同步版本'] : '');
          // 同仓库 + 同版本 已有记录：按「一份同步 = 一个版本的一次同步」这属重复。
          // 服务端不校验会照写（造出两条一模一样的），这里给提示但不硬拦——
          // 补录两个分支的同版本号是合理场景，由人判断。
          if (p.props['同步版本']) {
            var dupGh = findGhFlexible(repo, p.props['同步版本']);
            if (dupGh && dupGh.exact) {
              p.notes.push('⚠ 这个仓库下已经有版本为 ' + p.props['同步版本'] + ' 的同步记录了，'
                + '再写一条会是重复的——确认是补录吗？');
            }
          }
          if (!p.props['是否同步']) p.props['是否同步'] = IMP_DEFAULTS['是否同步'];
          if (!p.props['电脑']) { p.err = '缺「电脑」'; plan.push(p); continue; }
          if (!availableMachines[String(p.props['电脑']).replace(/^\s+|\s+$/g, '')]) {
            var gs0 = machineSuggest(p.props['电脑']);
            p.err = '电脑「' + p.props['电脑'] + '」没登记过' + (gs0 ? '（是不是想写 ' + gs0 + '？）'
              : (knownList ? '（可用：' + knownList + '）' : '——请先写一个「## 电脑（新建）」块登记'));
            plan.push(p); continue;
          }
        }
      }

      // 更新块不能没有东西可改，否则白写一次库
      if (!p.err && it.act === 'update' && !Object.keys(p.props).length && !p.newTitle && !p.newName && !it.todos.length) {
        p.err = '这个（更新）块没写任何要改的字段';
      }
      plan.push(p);
    }
    return plan;
  }

  var IMP_KIND_LABEL = { task: '任务', gh: '同步记录', machine: '电脑', account: '账号' };
  // 预览里「改了什么」的显示格式：日期截到分钟，布尔转成 是/否，
  // 否则扔一长串 ISO 给用户看，等于没说。
  function impFieldLabel(k, v) {
    if (v === true) return k + '=是';
    if (v === false) return k + '=否';
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) {
      return k + '=' + v.slice(0, 16).replace('T', ' ');
    }
    return k;
  }

  // 待办合并：更新语义是「按原文匹配已有项改勾选，匹配不上就追加」——
  // AI 续写时只会写自己刚做完的那几条，不该让它把整份待办列表重新抄一遍。
  function mergeTodos(oldText, incoming) {
    var exist = parseTodos(oldText);
    for (var i = 0; i < incoming.length; i++) {
      var inc = incoming[i], hit = false;
      for (var j = 0; j < exist.length; j++) {
        if (exist[j].text === inc.text) { exist[j].done = inc.done; hit = true; break; }
      }
      if (!hit) exist.push({ done: inc.done, text: inc.text });
    }
    var out = [];
    for (var k = 0; k < exist.length; k++) out.push((exist[k].done ? '[x] ' : '[ ] ') + exist[k].text);
    return out.join('\n');
  }

  // 第三步：执行。串行写，一条失败不中断整批，最后汇总成功/失败数。
  function applyImportPlan(plan, done) {
    var ok = 0, fail = 0, failed = [];
    var queue = [];
    for (var i = 0; i < plan.length; i++) if (!plan[i].err) queue.push(plan[i]);
    // 电脑块排到最前面落库：AI 可能把「## 电脑（新建）」写在任务之后，
    // 而任务/账号/同步都要引用电脑名。服务端不校验跨表引用（能写进去），
    // 但顺序反了会让这批记录短暂落在「未识别电脑」列——重排一次就省掉这个中间态。
    queue.sort(function (a, b) {
      var am = a.kind === 'machine' ? 0 : 1, bm = b.kind === 'machine' ? 0 : 1;
      return am - bm;
    });
    if (!queue.length) { done(0, 0, []); return; }
    var idx = 0;
    function step() {
      if (idx >= queue.length) { done(ok, fail, failed); return; }
      var p = queue[idx++];
      var props = {};
      for (var k in p.props) props[k] = p.props[k];
      if (p.kind === 'task' && p.todos.length) {
        props[F.t.todos] = p.act === 'update' && p.target
          ? mergeTodos(p.target[F.t.todos], p.todos)
          : p.todos.map(function (x) { return (x.done ? '[x] ' : '[ ] ') + x.text; }).join('\n');
      }
      // kind 是块类型（task/gh/machine/account），Repo 上挂的是表名
      // （tasks/github/machines/accounts）——别写混，否则 Repo[undefined] 直接抛错，整批静默不写。
      var table = p.kind === 'task' ? Repo.tasks
                : p.kind === 'gh' ? Repo.github
                : p.kind === 'machine' ? Repo.machines
                : Repo.accounts;
      var req = p.act === 'update'
        ? table.update(p.target._id, props)
        : table.create(props);
      req.then(function () { ok++; step(); })
         .catch(function (e) {
           fail++; failed.push(p.label + '：' + (e && e.message ? e.message : '写入失败'));
           step();
         });
    }
    step();
  }

  // 任务在「现状骨架」里的编号顺序。骨架按电脑分组输出，组内保持数据顺序，孤儿排最后。
  // 编号定位依赖这个顺序——两边必须用同一个函数，不能各写一份遍历。
  function outlineTaskOrder() {
    var out = [], i, k;
    var ms = sortedMachines();
    for (i = 0; i < ms.length; i++) {
      var mn = txt(ms[i][F.m.name]);
      for (k = 0; k < S.data.tasks.length; k++) {
        if (txt(S.data.tasks[k][F.t.machine]) === mn) out.push(S.data.tasks[k]);
      }
    }
    var known = {};
    for (i = 0; i < ms.length; i++) known[txt(ms[i][F.m.name])] = 1;
    for (i = 0; i < S.data.tasks.length; i++) {
      if (!known[txt(S.data.tasks[i][F.t.machine])]) out.push(S.data.tasks[i]);
    }
    return out;
  }
  // 「编号：<id>」→ 那张卡。用记录自身的 _id，不用位置序号——
  // 位置序号会随任何增/删/改顺序而位移：复制提示词后又加了一张卡，
  // 原来的 #1 就不再是那张卡了，导入会静默写错目标（实测已复现）。
  // _id 是稳定的，卡片被删则直接报「找不到」，也不会误写别人。
  function taskOutlineId(t) {
    var id = t && (t._id || t.id);
    return id ? String(id) : '';
  }
  function findTaskByOutlineId(id) {
    var key = String(id || '').replace(/^#/, '').replace(/^\s+|\s+$/g, '');
    if (!key) return null;
    for (var i = 0; i < S.data.tasks.length; i++) {
      if (taskOutlineId(S.data.tasks[i]) === key) return S.data.tasks[i];
    }
    return null;
  }

  /* ── 工作台现状骨架 ──
     提示词里带这个，AI 才知道哪些卡片已经存在（该续写）、哪些没有（该新建）。
     取舍：给得越多 AI 判断越准，但提示词越长越稀释格式说明。原则是——
     「该续写哪张卡」必需的信息都给（待办原文、更新时间、目录、账号池、电脑登录态），
     「这张卡做过什么」的细节不给（进度全文、交接内容）。
     待办原文只给进行中的任务（已完成的不需要续写），每条最多 5 条。 */
  function wbOutline() {
    var L = [], i, k;
    var ms = sortedMachines();
    var impSeq = 0;

    // ── 电脑 + 登录态 ──
    L.push('电脑（' + ms.length + ' 台）：');
    if (!ms.length) {
      L.push('  （还没登记任何电脑——「电脑」无从填写，请先写「## 电脑（新建）」块登记）');
    }
    for (i = 0; i < ms.length; i++) {
      var m = ms[i];
      L.push('  · ' + txt(m[F.m.name]) + (txt(m[F.m.place]) ? '（' + txt(m[F.m.place]) + '）' : '') +
        ' ｜ WB:' + (txt(m[F.m.wb]) || '未登录') + ' / TRAE:' + (txt(m[F.m.trae]) || '未登录'));
    }

    // ── 账号池 ──
    // 语义必须分开：这里的 WB/TRAE 是「机器登录态」的登录账号，
    // 而同步块的「账号」落到的是 GitHub 账号，两者不是一回事。
    // 旧文案写「同步记录的「账号」从这些里选」，AI 会把 WB-主号 填进 GitHub 账号列——
    // 实测库里 GitHub账号 全是 Simiely，属素材与程序不符（写脏数据）。
    var pool = { WorkBuddy: [], TRAE: [] };
    for (i = 0; i < S.data.accounts.length; i++) {
      var a = S.data.accounts[i], pl = txt(a[F.a.plat]), nm = txt(a[F.a.name]);
      if (pool[pl] && nm && pool[pl].indexOf(nm) < 0) pool[pl].push(nm);
    }
    var ghAcc = [], ghSeen = {};
    for (i = 0; i < S.data.gh.length; i++) {
      var ga = txt(S.data.gh[i][F.g.acc]);
      if (ga && !ghSeen[ga]) { ghSeen[ga] = 1; ghAcc.push(ga); }
    }
    L.push('');
    L.push('机器登录账号（WB/TRAE，只用于机器登录态，不要填进同步记录）：WorkBuddy → ' +
      (pool.WorkBuddy.length ? pool.WorkBuddy.join('、') : '（无）') + '；TRAE → ' +
      (pool.TRAE.length ? pool.TRAE.join('、') : '（无）'));
    L.push('GitHub 账号（同步记录的「账号」只能从这些里选）：' +
      (ghAcc.length ? ghAcc.join('、') : '（库里还没有同步记录，无从推断）'));

    // ── 任务 ──
    L.push('');
    if (!S.data.tasks.length) {
      L.push('已有任务：0 条（看板是空的，全部走「新建」）');
    } else {
      var nDoing = 0, nDone = 0;
      for (i = 0; i < S.data.tasks.length; i++) {
        if (txt(S.data.tasks[i][F.t.status]) === ST_DONE) nDone++; else nDoing++;
      }
      L.push('已有任务 ' + S.data.tasks.length + ' 条（进行中 ' + nDoing + ' / 已完成 ' + nDone + '）：');

      function taskBlock(t, indent) {
        var st = todoStat(t);
        var isDone = txt(t[F.t.status]) === ST_DONE;
        // #<id> 是给 AI 定位用的稳定编号——标题是长中文，AI 抄必错；
        // 用记录 id 而非位置序号，复制提示词后数据再变动也不会指错卡
        var head = indent + '· #' + (taskOutlineId(t) || ('i' + (++impSeq))) + ' ' + txt(t[F.t.title]) +
          ' ｜ ' + txt(t[F.t.status]) + ' ' + txt(t[F.t.prio]);
        var ut = toTime(normDate(t[F.t.updated]));
        head += ut ? ' ｜ ' + rel(t[F.t.updated]) + '更新' : ' ｜ 无更新时间';
        // 「久未动」= 进行中且超过 7 天没更新：AI 该优先续写这些
        if (isStale(t)) head += ' ⚠久未动';
        L.push(head);
        var dir = txt(t[F.t.dir]);
        if (dir) L.push(indent + '  目录：' + dir);
        // 待办原文对所有卡都给（含已完成的）：更新块靠原文匹配改勾选，
        // 看不到原文 AI 只能凭印象写，措辞一变就追加出重复项——这与 1.6.1 修的是同一类问题，
        // 当初为控长度只给「进行中」，等于把隐患留在了已完成的卡上。
        if (st.total) {
          L.push(indent + '  待办 ' + st.done + '/' + st.total + '：');
          var cap = Math.min(st.list.length, 5);
          for (var q = 0; q < cap; q++) {
            L.push(indent + '    ' + (st.list[q].done ? '[x] ' : '[ ] ') + st.list[q].text);
          }
          if (st.list.length > cap) L.push(indent + '    （还有 ' + (st.list.length - cap) + ' 条未列出）');
        } else {
          L.push(indent + '  （没有待办清单）');
        }
      }

      for (i = 0; i < ms.length; i++) {
        var mn = txt(ms[i][F.m.name]);
        var mine = [];
        for (k = 0; k < S.data.tasks.length; k++) {
          if (txt(S.data.tasks[k][F.t.machine]) === mn) mine.push(S.data.tasks[k]);
        }
        if (!mine.length) continue;
        L.push('[' + mn + ']');
        for (k = 0; k < mine.length; k++) taskBlock(mine[k], '  ');
      }
      var known = {};
      for (i = 0; i < ms.length; i++) known[txt(ms[i][F.m.name])] = 1;
      var orph = [];
      for (i = 0; i < S.data.tasks.length; i++) {
        if (!known[txt(S.data.tasks[i][F.t.machine])]) orph.push(S.data.tasks[i]);
      }
      if (orph.length) {
        L.push('[未识别电脑]');
        for (i = 0; i < orph.length; i++) {
          // 带上任务原本写的电脑名：AI 才知道该建议新建哪台电脑来归位
          L.push('  · ' + txt(orph[i][F.t.title]) + '（所在电脑写的是「' +
            txt(orph[i][F.t.machine]) + '」，没登记过——可写「## 电脑（新建）」补登记让它归位）');
        }
      }
    }

    // ── 仓库 ──
    L.push('');
    var groups = ghRepoGroups(1); // 全量口径：不受当前搜索 / 机器筛选影响
    if (!groups.length) {
      L.push('GitHub 仓库：0 个');
    } else {
      L.push('GitHub 仓库 ' + groups.length + ' 个：');
      for (i = 0; i < groups.length; i++) {
        var g = groups[i], un = 0;
        for (k = 0; k < g.records.length; k++) {
          if (txt(g.records[k][F.g.result]) === '未同步') un++;
        }
        var tail = [];
        tail.push(g.records.length + ' 条');
        tail.push('最近 ' + g.versions.slice(0, 3).join('/') + (g.versions.length > 3 ? '…' : ''));
        if (un) tail.push(un + ' 条未同步');
        if (g.pinned) tail.push('已置顶');
        if (g.archived) tail.push('已归档');
        if (g.machines.length) tail.push('电脑：' + g.machines.join('、'));
        L.push('  · ' + g.name + '（' + tail.join('，') + '）');
      }
    }
    return L.join('\n');
  }

  // 提示词：给 AI 的完整说明（现状骨架 + 输出格式 + 取值 + 规则）
  // 每张卡片的字段规范：「写这个键 → 落到哪一列 → 何时必填 → 取值要求」。
  // 这是提示词的核心——AI 照着填就不会错，错了也能自己对照发现。
  // 只保留两种卡片：任务看板、GitHub 同步看板（电脑/账号是辅助，不在主线里）。
  function impCardSpec() {
    var ms = sortedMachines(), i;
    var mnames = [];
    for (i = 0; i < ms.length; i++) mnames.push(txt(ms[i][F.m.name]));
    var empty = !mnames.length;          // 库里一台电脑都没有
    var mlist = mnames.length ? mnames.join(' / ') : '（库里还没有电脑，必须先用下面的「电脑」块登记）';
    var nTask = outlineTaskOrder().length;

    var specs = [];
    // 空库时把「电脑」块排在最前面并标注为前置——否则形成死锁：
    // 任务/同步都要求电脑已登记，报错让人「写个电脑块」，但提示词里没教怎么写。
    if (empty) {
      specs.push({
        head: '电脑（新建）　【前置：库里没有电脑时必须先写】',
        to: '机器登录态（machines）',
        locate: '放在整段文本的最前面，先于所有任务/同步块',
        fields: [
          ['机器名', '机器名', '必填', '电脑的名字。任务/同步块里写的「电脑」必须在这里登记过'],
          ['位置', '位置', '可选', '如：家 / 随身 / 客厅']
        ]
      });
    }
    return specs.concat([
      {
        head: '任务（新建） 或 任务（更新）',
        to: '任务看板（tasks）',
        locate: '（更新）用「编号」或「标题」定位已有卡片，二者选其一',
        fields: [
          ['编号', '（只用于定位，不入库）', '更新时 二选一',
           '照抄现状里任务行开头的 #xxx（那是卡片 id，稳定不变）。如：编号：'
           + (nTask ? taskOutlineId(outlineTaskOrder()[0]) : 'xxxxxxxx')
           + '。不要用数字序号——序号会随增删变动'],
          ['标题', '任务标题', '新建必填；更新时与「编号」二选一',
           '新建：不能与已有任务重名。更新：必须与现状里的标题一字不差，'
           + '（建议改用「编号」，标题太长容易抄错）'],
          ['电脑', '所在电脑', '新建必填；更新可选',
           '只能是：' + mlist],
          ['进度', '进度', '每次都写',
           '一句话，说清本次做了什么。这是卡片上唯一显示进展的地方'],
          ['待办', '待办', '可选',
           '多行，行首必须是 [x]（已完成）或 [ ]（未完成）。'
           + '更新时会按原文匹配已有项改勾选，匹配不上则追加——'
           + '所以请照抄现状里的待办原文，不要改写措辞'],
          ['交接', '交接内容', '可选', '下一步要注意什么 / 回滚点'],
          ['目录', '目录', '可选', '项目路径'],
          ['状态', '状态', '可选（不写默认 进行中）', '只能是 进行中 / 已完成'],
          ['优先级', '优先级', '可选（不写默认 P1）', '只能是 P0 / P1 / P2'],
          ['时间', '更新时间', '可选（不写默认此刻）', '2026-11-02 或 2026-11-02 14:30']
        ]
      },
      {
        head: '同步（新建）',
        to: 'GitHub 同步看板（github）',
        locate: '同步记录每次都是新增一条，没有「更新」',
        fields: [
          ['仓库', '仓库', '必填', '形如 Simiely/ae-tools，与现状里的仓库名一致'],
          ['电脑', '电脑', '必填', '只能是：' + mlist],
          ['版本', '同步版本', '每次都写', '形如 v1.5.9。一份同步 = 一个版本的一次同步'],
          ['内容', '内容', '必填', '一句话，这次同步了什么'],
          ['状态', '是否同步', '可选（不写默认 已同步）', '只能是 已同步 / 未同步'],
          ['账号', 'GitHub账号', '可选',
           '只能是 GitHub 账号名（如现状「GitHub 账号」列出的那些）。'
           + '不要填 WB/TRAE 登录账号——那是机器登录态用的，不是 GitHub 账号'],
          ['时间', '同步时间', '可选（不写默认此刻）', '2026-11-02 或 2026-11-02 14:30'],
          ['归档', '仓库归档', '可选', '是 / 否。仓库级属性，勾上则整个仓库归档'],
          ['置顶', '仓库置顶', '可选', '是 / 否。仓库级属性，勾上则整个仓库置顶']
        ]
      }
    ]);
  }

  function importPromptText() {
    var L = [], i, j;
    L.push('# Agent 工作台 · 批量导入');
    L.push('');
    L.push('你在给一个「Agent 工作台」写一段长文本，工作台会把每个块解析成一张卡片。');
    L.push('只输出文本本身，不要解释、不要代码块之外的闲话。');
    L.push('');
    L.push('## 一、工作台现状（决定你该新建还是续写）');
    L.push('');
    L.push(wbOutline());
    L.push('');
    L.push('判断规则：');
    L.push('- 上面现状里已经有的任务 → 写「## 任务（更新）」，用「编号：#xxx」定位（照抄卡片 id，最稳）');
    L.push('- 上面没有的工作 → 写「## 任务（新建）」');
    L.push('- 同步记录每次都是新增一条 → 一律写「## 同步（新建）」');
    if (!sortedMachines().length) {
      L.push('- **库里还没有任何电脑**：必须在最前面先写「## 电脑（新建）」块登记，'
        + '否则后面的任务/同步块都会因为「电脑没登记过」被拦下');
    }
    L.push('');
    L.push('## 二、两种卡片的格式');
    L.push('');
    L.push('块头决定写到哪张看板，块内的「键：值」决定写到哪一列。');
    L.push('');
    L.push('```');
    L.push(sortedMachines().length ? IMP_SAMPLE : IMP_SAMPLE_EMPTY);
    L.push('```');
    L.push('');
    L.push('## 三、字段规范（照着填就不会错）');
    L.push('');
    var specs = impCardSpec();
    for (i = 0; i < specs.length; i++) {
      var sp = specs[i];
      L.push('### 卡片：' + sp.head);
      L.push('写入看板：' + sp.to);
      L.push('定位方式：' + sp.locate);
      L.push('');
      for (j = 0; j < sp.fields.length; j++) {
        var f = sp.fields[j];
        L.push('- 写 `' + f[0] + '：` → 落到「' + f[1] + '」');
        L.push('  什么时候填：' + f[2]);
        L.push('  要求：' + f[3]);
      }
      L.push('');
    }
    L.push('## 四、硬性规则（违反会被拦下）');
    L.push('');
    for (i = 0; i < AI_CONTRACT.rules.length; i++) L.push('- ' + AI_CONTRACT.rules[i]);
    return L.join('\n');
  }

  /* ── 批量导入弹窗 ──
     两态：'input' 粘长文本 → 'preview' 看解析清单。写入前必须过预览，
     批量操作一旦写歪，靠人工逐条比对很难发现。 */
  var impState = { view: 'input', text: '', plan: null, parsed: null };

  function openImport() {
    impState.view = 'input';
    impState.plan = null;
    impState.parsed = null;
    renderImportSheet();
    $('impMask').classList.add('on');
    $('impDrawer').classList.add('on');
    var ta = $('impText');
    if (ta) setTimeout(function () { try { ta.focus(); } catch (e) {} }, 60);
  }
  function closeImport() {
    $('impMask').classList.remove('on');
    $('impDrawer').classList.remove('on');
  }

  function renderImportSheet() {
    var body = $('impBody'), foot = $('impFoot');
    if (!body || !foot) return;

    // 写入结果视图：失败时把每一条都列出来。
    // 原来只用 toast 显示 failed[0]，1.9 秒就没了，且批量导入失败多条时根本看不全。
    if (impState.view === 'result') {
      var r = impState.result || { ok: 0, fail: 0, failed: [] };
      var rh = '<div class="imp-sum">写入完成：成功 <b>' + r.ok + '</b> 条' +
        (r.fail ? ' · <span class="imp-err">失败 <b>' + r.fail + '</b> 条</span>' : '') + '</div>';
      if (r.failed.length) {
        rh += '<div class="imp-list">';
        for (var ri = 0; ri < r.failed.length; ri++) {
          rh += '<div class="imp-item bad"><span class="imp-act">失败</span><div class="imp-main">' +
            '<div class="imp-sub imp-err">' + escapeHtml(r.failed[ri]) + '</div></div></div>';
        }
        rh += '</div>';
      } else {
        rh += '<div class="imp-sum">全部写入成功</div>';
      }
      body.innerHTML = rh;
      foot.innerHTML = '<button class="btn-primary" id="impDone">完成</button>';
      $('impDone').addEventListener('click', function () { closeImport(); });
      return;
    }

    if (impState.view === 'format') {
      body.innerHTML = '<div class="ai-sec"><h4>输出格式</h4>' +
        '<div class="ai-pre">' + escapeHtml(IMP_SAMPLE) + '</div></div>' +
        '<div class="ai-sec"><h4>规则</h4><ul class="ai-note">' +
        '<li>块头 <span class="ai-enum">## 任务（新建）</span> / <span class="ai-enum">## 任务（更新）</span> / <span class="ai-enum">## 同步（新建）</span>' +
        ' / <span class="ai-enum">## 电脑（新建）</span> / <span class="ai-enum">## 账号（新建）</span>；不写括号里的动作默认是新建</li>' +
        '<li>块内写 <span class="ai-enum">字段名：值</span>（半角 : 也认）；待办直接写 <span class="ai-enum">[x] 已完成</span> / <span class="ai-enum">[ ] 未完成</span></li>' +
        '<li>（更新）块的定位键要一字不差：任务用「标题」、同步用「仓库」+「版本」、电脑用「机器名」；写「新标题：」/「新机器名：」可顺带改名</li>' +
        '<li>（更新）块的待办按原文匹配已有项改勾选，匹配不上就追加——<b>请照抄现状里的待办原文</b>，改写措辞会追加出重复项</li>' +
        '<li><span class="ai-enum">时间：</span>写真实发生时刻（2026-11-02 或 2026-11-02 14:30）；不写则补当前时间。任务→更新时间，同步→同步时间</li>' +
        '<li>勾选类写 <span class="ai-enum">是</span> / <span class="ai-enum">否</span>：同步的「归档」「置顶」是仓库级属性；账号的「当前」= 该电脑在用这个号</li>' +
        '<li>电脑名必须是已登记的，否则会被拦下并列出可用电脑名（不会静默落进「未识别电脑」列）——可先写「## 电脑（新建）」登记</li>' +
        '<li>账号只支持新建登记：改名是全局的、解绑只删本机那条，这两件事请在账号面板里做</li>' +
        // 上面两条已经提到「## 电脑（新建）」和账号块，就必须把字段也教全——
        // 只提块名不给字段 = 让人猜。主线是两种卡片，这两个是辅助块，单独成行说明。
        '<li><b>辅助块</b>（主线用不到，登记电脑/账号时才写）：'
        + '<span class="ai-enum">## 电脑（新建）</span> → 机器名、位置；'
        + '<span class="ai-enum">## 账号（新建）</span> → 账号名、平台（WorkBuddy / TRAE）、电脑、备注、当前（是 / 否）</li>' +
        '</ul></div>';
      foot.innerHTML = '<button class="btn-primary" id="impBack">返回</button>';
      $('impBack').addEventListener('click', function () { impState.view = 'input'; renderImportSheet(); });
      return;
    }

    if (impState.view !== 'preview' || !impState.plan) {
      body.innerHTML = '<div class="ai-sec"><h4>粘贴 AI 回写的长文本</h4>' +
        '<textarea id="impText" class="imp-ta" spellcheck="false" ' +
        'placeholder="## 任务（新建）&#10;标题：……&#10;电脑：……&#10;待办：&#10;[ ] 第一步"></textarea>' +
        '<div class="imp-hint" style="margin-top:8px">按「## 任务（新建）/（更新）」分节，块内写「字段名：值」，待办用行首 [x] / [ ]。' +
        '不确定格式就点右上角「格式说明」。</div></div>';
      var ta = $('impText');
      if (ta) {
        ta.value = impState.text || '';
        ta.addEventListener('input', function (e) { impState.text = e.target.value; });
      }
      foot.innerHTML = '<button class="btn-primary" id="impParse">解析并预览</button>' +
        '<button class="btn-ghost" id="impCancel">取消</button>';
      $('impCancel').addEventListener('click', closeImport);
      $('impParse').addEventListener('click', function () {
        var el = $('impText');
        impState.text = el ? el.value : '';
        if (!String(impState.text || '').replace(/\s/g, '')) { toast('先粘贴一段文本'); return; }
        impState.parsed = parseImportText(impState.text);
        impState.plan = buildImportPlan(impState.parsed);
        impState.view = 'preview';
        renderImportSheet();
      });
      return;
    }

    // ── 预览态 ──
    var plan = impState.plan, errs = impState.parsed ? impState.parsed.errors : [];
    var nNew = 0, nUpd = 0, nBad = 0, i;
    for (i = 0; i < plan.length; i++) {
      if (plan[i].err) nBad++;
      else if (plan[i].act === 'update') nUpd++;
      else nNew++;
    }
    // ── 同批多次命中同一条记录 ──
    // 执行阶段按顺序 PATCH 两次，后一次整体覆盖前一次——前一块写的进度/交接会静默丢失。
    // 不自动合并（合并语义要猜，容易猜错），但必须在预览里标出来让人看见并自己决定。
    var seenT = {}, nDup = 0;
    for (i = 0; i < plan.length; i++) {
      var q = plan[i];
      if (q.err || !q.target) continue;
      var tkey = q.kind + '|' + (q.target._id || q.target.id || '');
      if (seenT[tkey]) {
        nDup++;
        q.dupOfLine = seenT[tkey];
      } else {
        seenT[tkey] = q.line;
      }
    }
    var h = '<div class="imp-sum">解析结果：新增 <b>' + nNew + '</b> 条 · 更新 <b>' + nUpd + '</b> 条' +
      (nBad || errs.length ? ' · <span class="imp-err"><b>' + (nBad + errs.length) + '</b> 条有问题</span>' : '') + '</div>';
    if (nDup) {
      h += '<div class="imp-sum imp-err">⚠ 有 <b>' + nDup + '</b> 块与前面的块指向同一条记录，'
        + '后面的会覆盖前面的改动——要都保留请合并成一个块写</div>';
    }
    h += '<div class="imp-list">';
    for (i = 0; i < plan.length; i++) {
      var p = plan[i];
      if (p.err) {
        h += '<div class="imp-item bad"><span class="imp-act">跳过</span><div class="imp-main">' +
          '<div class="imp-title">' + escapeHtml(p.label || '第 ' + p.line + ' 行附近的块') + '</div>' +
          '<div class="imp-sub imp-err">' + escapeHtml(p.err) + '</div></div></div>';
        continue;
      }
      var fields = [];
      for (var k in p.props) fields.push(impFieldLabel(k, p.props[k]));
      var sub = [];
      var KIND_LABEL = { task: '任务', gh: '同步记录', machine: '电脑', account: '账号' };
      sub.push(KIND_LABEL[p.kind] || p.kind);
      if (fields.length) sub.push('改：' + fields.join('、'));
      if (p.kind === 'task' && p.todos.length) {
        // 原来无论匹配还是追加都写「追加 N 条」——预览在撒谎：
        // 用户以为会多出一条，其实只是勾了已有的一条；真要追加重复项时也看不出来。
        // 这里真的算一遍：匹配上几条、会新增几条，分别说。
        if (p.act === 'update') {
          var ex = parseTodos(p.target ? p.target[F.t.todos] : '');
          var nm = 0, na = 0;
          for (var ti = 0; ti < p.todos.length; ti++) {
            var hit = false;
            for (var tj = 0; tj < ex.length; tj++) if (ex[tj].text === p.todos[ti].text) { hit = true; break; }
            if (hit) nm++; else na++;
          }
          var bits = [];
          if (nm) bits.push('勾选已有 ' + nm + ' 条');
          if (na) bits.push('新增 ' + na + ' 条');
          sub.push('待办：' + (bits.join('，') || '无'));
        } else {
          sub.push('待办 ' + p.todos.length + ' 条');
        }
      }
      if (p.newTitle) sub.push('改名为：' + p.newTitle);
      if (p.act === 'update' && p.target) sub.push('匹配到已有记录');
      if (p.dupOfLine) sub.push('⚠ 与第 ' + p.dupOfLine + ' 行那块是同一条，会覆盖它的改动');
      for (var ni = 0; ni < (p.notes || []).length; ni++) sub.push(p.notes[ni]);
      h += '<div class="imp-item"><span class="imp-act">' + (p.act === 'update' ? '更新' : '新建') + '</span>' +
        '<div class="imp-main"><div class="imp-title">' + escapeHtml(p.label) + '</div>' +
        '<div class="imp-sub">' + escapeHtml(sub.join(' · ')) + '</div></div></div>';
    }
    for (i = 0; i < errs.length; i++) {
      h += '<div class="imp-item bad"><span class="imp-act">跳过</span><div class="imp-main">' +
        '<div class="imp-title">第 ' + errs[i].line + ' 行：' + escapeHtml(errs[i].raw || '') + '</div>' +
        '<div class="imp-sub imp-err">' + escapeHtml(errs[i].msg) + '</div></div></div>';
    }
    h += '</div>';
    if (!plan.length && !errs.length) {
      h += '<div class="imp-hint">没解析出任何块。块头要写成「## 任务（新建）」这样。</div>';
    }
    body.innerHTML = h;
    foot.innerHTML = (nNew + nUpd)
      ? '<button class="btn-primary" id="impApply">确认写入 ' + (nNew + nUpd) + ' 条</button>' +
        '<button class="btn-ghost" id="impBack">返回修改</button>'
      : '<button class="btn-primary" id="impBack">返回修改</button>';
    $('impBack').addEventListener('click', function () { impState.view = 'input'; renderImportSheet(); });
    var ap = $('impApply');
    if (ap) ap.addEventListener('click', function () {
      ap.disabled = true;
      ap.textContent = '写入中…';
      applyImportPlan(impState.plan, function (ok, fail, failed) {
        loadAllData(function () { render(); });
        if (fail) {
          // 有失败：留在弹窗里把每条原因列出来（toast 一闪而过看不全）
          impState.result = { ok: ok, fail: fail, failed: failed };
          impState.view = 'result';
          renderImportSheet();
        } else {
          closeImport();
          toast('已写入 ' + ok + ' 条');
        }
      });
    });
  }

  function showConfirm(title, text, onOk) {    $('cTitle').textContent = title;
    $('cText').textContent = text;
    pendingConfirm = onOk;
    $('cMask').classList.add('on');
    $('confirmModal').classList.add('on');
  }
  function closeConfirm() {
    pendingConfirm = null;
    $('cMask').classList.remove('on');
    $('confirmModal').classList.remove('on');
  }

  // 返回 Promise<boolean>：true = 已落库，false = 被服务端拒/网络失败。
  // 调用方要据此决定「内存里先改的值要不要还原」——不能靠事后对比内存（重拉是异步的，会读到中间态）
  function updateMachineFields(id, patch) {
    var m = findMachine(id);
    if (!m) return Promise.resolve(false);
    var props = {};
    if (patch.name != null) props[F.m.name] = { text: patch.name };
    if (patch.place != null) props[F.m.place] = { text: patch.place };
    if (patch.order != null) props[F.m.order] = { number: patch.order };
    if (patch.name != null) m[F.m.name] = patch.name;
    if (patch.place != null) m[F.m.place] = patch.place;
    if (patch.order != null) m[F.m.order] = patch.order;
    render();
    return Repo.machines.update(id, props)
      .then(function () { return true; })
      .catch(function (e) {
        console.error('[workbench] 机器更新失败', e);
        toast('更新失败');
        loadMachines(function (ms) { setData('machines', ms); render(); });
        return false;
      });
  }

  function renameMachine(id, newName) {
    var m = findMachine(id);
    if (!m) return;
    var old = txt(m[F.m.name]);
    var affected = [];
    for (var i = 0; i < S.data.tasks.length; i++) {
      if (txt(S.data.tasks[i][F.t.machine]) === old) affected.push(S.data.tasks[i]);
    }
    // 先在内存里把任务改到新名字。否则 updateMachineFields 内部的 render() 会
    // 因为机器名已改、任务的「所在电脑」还是旧名而匹配不上，导致整列任务从看板消失（P-01）
    for (var k = 0; k < affected.length; k++) affected[k][F.t.machine] = newName;

    updateMachineFields(id, { name: newName }).then(function (ok) {
      // ① 改名被服务端拒绝（重名 400）：把「先改掉的内存任务名」还原，并重拉机器表。
      //    不还原的话，整列任务会跑到别的电脑（或掉进「未识别电脑」列）（F-04）
      if (!ok) {
        for (var r = 0; r < affected.length; r++) affected[r][F.t.machine] = old;
        loadMachines(function (ms) { setData('machines', ms); render(); });
        render();
        return;
      }
      // ② 电脑身份有三份副本（machines 名 / accounts 所属电脑 / github 电脑）：
      //    服务端改名时会把账号搬过去，客户端必须重拉，否则胶囊会显示「未登录」（F-02）
      loadAccounts(function (accs) { setData('accounts', accs); render(); });
      // ③ GitHub「电脑」筛选若还指着旧名：旧名已不在机器表里，下拉显示「全部」但列表仍在筛（F-01）
      if (S.ui.ghFilter.machine === old) setGhFilter({ machine: '' });
      render();
      if (!affected.length) { toast('已重命名'); return; }
      var idx = 0, failed = 0;
      function next() {
        if (idx >= affected.length) {
          if (failed) {
            toast('已重命名，' + failed + ' 个任务同步失败，正在重新拉取');
            loadTasks(function (ts) { setData('tasks', ts); render(); });
          } else {
            toast('已重命名，同步更新 ' + affected.length + ' 个任务');
          }
          return;
        }
        var t = affected[idx++];
        var props = {};
        props[F.t.machine] = { text: newName };
        Repo.tasks.update(t._id, props)
          .catch(function (e) { failed++; console.error('[workbench] 任务机器同步失败', e); })
          .then(next);
      }
      next();
    });
  }

  function openMachineMenu(btn, id) {

    if (!m) return;
    var rect = btn.getBoundingClientRect();
    var menu = document.createElement('div');

    menu.style.top = (rect.bottom + 6) + 'px';
    // v1.0.2 精简：重命名 / 改位置 / 左右移列 都能直接在列头操作（点名字、点位置胶囊、拖 ⠿），
    // 菜单里重复一遍反而误点，只留删除。
    menu.innerHTML =

  function doMachineAction(act, id) {
    var m = findMachine(id);
    if (!m) return;
    // v1.0.2 起菜单只剩「删除」：改名/改位置/移列都在列头上直接做，菜单项已下线
    if (act === 'delete') {
      var used = 0;
      for (var i = 0; i < S.data.tasks.length; i++) if (txt(S.data.tasks[i][F.t.machine]) === txt(m[F.m.name])) used++;
      // 有任务也允许删：任务不会丢，会落到「未识别电脑」兜底列（v12 起的孤儿列机制）
      var msg = used
        ? '「' + txt(m[F.m.name]) + '」下还有 ' + used + ' 个任务。删除电脑后这些任务不会删，会留在看板的「未识别电脑」列（保留原电脑名）；之后新建同名电脑，它们会自动回到那一列。'
        : '「' + txt(m[F.m.name]) + '」会从看板移除，该电脑下没有任务。';
      showConfirm('删除电脑', msg, function () { doDeleteMachine(id); });
    }
  }
  function doDeleteMachine(id) {
    Repo.machines.remove(id).then(function () {
      var arr = [];
      var removedName = '';
      for (var i = 0; i < S.data.machines.length; i++) {
        if (S.data.machines[i]._id === id) removedName = txt(S.data.machines[i][F.m.name]);
        else arr.push(S.data.machines[i]);
      }
      setData('machines', arr);
      // 删电脑时同步清理指向它的 GitHub 筛选 ——
      // 否则筛选会指向一台不存在的电脑，渲染时只能靠兜底复位来收拾（那是补丁）。
      if (removedName && S.ui.ghFilter.machine === removedName) setGhFilter({ machine: '' });
      // 服务端删电脑会连带删掉它名下的账号（server.mjs:739）。客户端必须重拉账号池，
      // 否则共享池里会留着指向已删电脑的「幽灵登记」，别的电脑的「也在用」角标虚高（F-02）
      loadAccounts(function (accs) { setData('accounts', accs); render(); });
      render();
      toast('已删除电脑');
    }).catch(function (e) {
      console.error('[workbench] 删除机器失败', e);
      toast('删除失败');
    });
  }

  function addMachine(name, place) {
    name = (name || '').replace(/^\s+|\s+$/g, '');
    if (!name) { toast('名称不能为空'); return; }
    for (var i = 0; i < S.data.machines.length; i++) {
      if (txt(S.data.machines[i][F.m.name]) === name) { toast('已经有同名电脑了'); return; }
    }
    place = (place || '').replace(/^\s+|\s+$/g, '');
    var maxOrder = 0;
    for (var j = 0; j < S.data.machines.length; j++) {
      var o = S.data.machines[j][F.m.order];
      if (typeof o === 'number' && o > maxOrder) maxOrder = o;
    }
    var props = {};
    props[F.m.name] = { text: name };
    props[F.m.place] = { text: place };
    props[F.m.order] = { number: maxOrder + 1 };
    Repo.machines.create(props).then(function (r) {
      var rec = { _id: (r && (r.id || r._id)) };
      rec[F.m.name] = name;
      rec[F.m.place] = place;
      rec[F.m.order] = maxOrder + 1;
      S.data.machines.push(rec);
      render();
      toast('已添加 ' + name);
    }).catch(function (e) {
      console.error('[workbench] 添加电脑失败', e);
      toast('添加失败：' + ((e && e.message) || '网络错误'));
    });
  }


  // 账号变动都算一次「确认登录态」，机器表的最后确认跟着走
  function touchMachine(machineName) {
    var now = new Date().toISOString();
    for (var i = 0; i < S.data.machines.length; i++) {
      var m = S.data.machines[i];
      if (txt(m[F.m.name]) !== machineName) continue;
      m[F.m.confirmed] = now;
      Repo.machines.update(m._id, { '最后确认': { date: now } })
        .catch(function (e) { console.error('[workbench] 最后确认更新失败', e); });
      return;
    }
  }

  // 设为当前：同池其他账号全部取消，服务端也会再兜一次
  function setCurrentAcc(id) {
    var a = findAcc(id);
    if (!a) return;
    var mach = txt(a[F.a.mach]), plat = txt(a[F.a.plat]);
    var prev = currentAcc(mach, plat);
    if (prev && prev._id === id) return; // 已经是当前，重复点不做动作，也不关面板
    var now = new Date().toISOString();
    a[F.a.cur] = true;
    a[F.a.at] = now;
    if (prev) prev[F.a.cur] = false;
    render();
    paintAccPanel();
    var jobs = [Repo.accounts.update(id, { '当前': { checkbox: true }, '最后确认': { date: now } })];
    if (prev) jobs.push(Repo.accounts.update(prev._id, { '当前': { checkbox: false } }));
    Promise.all(jobs).then(function () {
      touchMachine(mach);
      toast(mach + ' → ' + txt(a[F.a.name]));
    }).catch(function (e) {
      console.error('[workbench] 切换账号失败', e);
      toast('切换失败，正在回滚');
      loadAccounts(function (accs) { setData('accounts', accs); render(); paintAccPanel(); });
    });
  }

  // 点共享名单里的一个号：本机登记过就切过去，没登记过就登记一条再切过去
  function pickSharedAcc(name) {
    var m = findMachine(accUI.mid);
    if (!m) return;
    var mach = txt(m[F.m.name]), plat = accPlat(accUI.key);
    var pool = accPool(mach, plat);
    for (var i = 0; i < pool.length; i++) {
      if (txt(pool[i][F.a.name]) === name) {
        if (pool[i][F.a.cur] === true) return; // 已经是当前，不做动作也不关面板
        setCurrentAcc(pool[i]._id);
        return;
      }
    }
    addAcc(mach, plat, name, { setCurrent: true });
  }

  // 新增账号：只往池里加一条，绝不动已有的号
  function addAcc(machineName, plat, name, opts) {
    var pool = accPool(machineName, plat);
    for (var i = 0; i < pool.length; i++) {
      if (txt(pool[i][F.a.name]) === name) { toast('这台电脑已经有同名账号了'); return; }
    }
    var prev = currentAcc(machineName, plat);
    var force = !!(opts && opts.setCurrent);
    var noCurrent = force || !prev;
    var order = 1;
    for (var j = 0; j < pool.length; j++) {
      if (typeof pool[j][F.a.order] === 'number' && pool[j][F.a.order] >= order) order = pool[j][F.a.order] + 1;
    }
    var now = new Date().toISOString();
    var props = {};
    props[F.a.name] = { text: name };
    props[F.a.plat] = { select: plat };
    props[F.a.mach] = { text: machineName };
    props[F.a.order] = { number: order };
    if (noCurrent) { props[F.a.cur] = { checkbox: true }; props[F.a.at] = { date: now }; }
    accUI.mode = 'list';
    paintAccPanel();
    Repo.accounts.create(props).then(function (r) {
      var rec = { _id: (r && (r.id || r._id)) };
      rec[F.a.name] = name;
      rec[F.a.plat] = plat;
      rec[F.a.mach] = machineName;
      rec[F.a.order] = order;
      rec[F.a.cur] = !!noCurrent;
      rec[F.a.at] = noCurrent ? now : '';
      S.data.accounts.push(rec);
      if (force && prev) {
        prev[F.a.cur] = false;
        Repo.accounts.update(prev._id, { '当前': { checkbox: false } }).catch(function () {});
      }
      render();
      paintAccPanel();
      touchMachine(machineName);
      toast(noCurrent ? ('已添加 ' + name + '（当前）') : ('已添加 ' + name));
    }).catch(function (e) {
      console.error('[workbench] 添加账号失败', e);
      toast('添加失败：' + ((e && e.message) || '网络错误'));
      loadAccounts(function (accs) { setData('accounts', accs); render(); paintAccPanel(); });
    });
  }

  // 改名是对共享账号本身的操作：同平台同名的每一条登记一起改，别的电脑看到的名字保持一致
  function renameAcc(a, name) {
    var old = txt(a[F.a.name]);
    var plat = txt(a[F.a.plat]);
    if (old === name) { accUI.mode = 'list'; paintAccPanel(); return; }
    var same = [];
    for (var i = 0; i < S.data.accounts.length; i++) {
      var x = S.data.accounts[i];
      if (txt(x[F.a.plat]) === plat && txt(x[F.a.name]) === old) same.push(x);
    }
    var touched = {};
    for (var j = 0; j < same.length; j++) {
      same[j][F.a.name] = name;
      touched[txt(same[j][F.a.mach])] = 1;
    }
    accUI.mode = 'list';
    render();
    paintAccPanel();
    var jobs = same.map(function (x) {
      return Repo.accounts.update(x._id, { '账号名': { text: name } });
    });
    Promise.all(jobs).then(function () {
      Object.keys(touched).forEach(function (mn) { touchMachine(mn); });
      toast(old + ' → ' + name + (same.length > 1 ? '（' + same.length + ' 台电脑同步）' : ''));
    }).catch(function (e) {
      console.error('[workbench] 账号改名失败', e);
      for (var k = 0; k < same.length; k++) same[k][F.a.name] = old;
      render();
      paintAccPanel();
      toast('改名失败');
    });
  }

  function confirmDelAcc(id) {
    var a = findAcc(id);
    if (!a) return;
    var nm = txt(a[F.a.name]);
    var mach = txt(a[F.a.mach]);
    var isCur = a[F.a.cur] === true;

    for (var i = 0; i < S.data.accounts.length; i++) {
      var x = S.data.accounts[i];
      if (x._id !== id && txt(x[F.a.name]) === nm && txt(x[F.a.plat]) === txt(a[F.a.plat])) others++;

    showConfirm('解除登记', '「' + nm + '」会从「' + mach + '」的账号列表里移除；' +
      (others ? '另外 ' + others + " 台电脑仍在用这个号，不受影响。" : '共享账号池里没有别的电脑在用，移除后这个号就没人登记了。') +
      (isCur ? '它正在使用中，移除后这台电脑会自动切到列表里的下一个账号。' : ''), function () { doDelAcc(id); });
  }

  // 确认框的「确定」在面板外，点它会顺带收起面板；删完把面板重新打开，别让人再点一次
  function reopenAccPanel() {

  function doDelAcc(id) {
    var a = findAcc(id);
    if (!a) return;
    var nm = txt(a[F.a.name]), mach = txt(a[F.a.mach]);
    setData('accounts', S.data.accounts.filter(function (x) { return x._id !== id; }));

      return new Promise(function (res) {
        loadAccounts(function (accs) { setData('accounts', accs); res(); });

  function delTask() {

  function buildHandoff(t) {
    var m = null;
    for (var i = 0; i < S.data.machines.length; i++) {
      if (txt(S.data.machines[i][F.m.name]) === txt(t[F.t.machine])) { m = S.data.machines[i]; break; }
    }
    var machineName = txt(t[F.t.machine]);
    var wbCur = m ? currentAcc(machineName, 'WorkBuddy') : null;
    var traeCur = m ? currentAcc(machineName, 'TRAE') : null;
    var wb = m ? (wbCur ? txt(wbCur[F.a.name]) : (txt(m[F.m.wb]) || '未登录')) : '—';
    var trae = m ? (traeCur ? txt(traeCur[F.a.name]) : (txt(m[F.m.trae]) || '未登录')) : '—';
    var pend = [];
    var list = parseTodos(t[F.t.todos]);
    for (var j = 0; j < list.length; j++) if (!list[j].done) pend.push(list[j].text);
    var lines = [];
    lines.push('接下来继续这个任务：' + txt(t[F.t.title]));
    lines.push('');
    lines.push('【工作目录】' + (txt(t[F.t.dir]) || '（未填）'));
    lines.push('【所在电脑】' + (txt(t[F.t.machine]) || '未指定'));
    lines.push('【登录账号】WorkBuddy: ' + wb + ' / TRAE: ' + trae);
    lines.push('');
    lines.push('【当前进度】');
    lines.push(txt(t[F.t.progress]) || '（未填）');
    lines.push('');
    if (pend.length) {
      lines.push('【未完成待办】');
      for (var k = 0; k < pend.length; k++) lines.push('- [ ] ' + pend[k]);
      lines.push('');
    }
    lines.push('【从哪里接着做】');
    lines.push(txt(t[F.t.handoff]) || '（未填）');
    return lines.join('\n');
  }

  function copyText(text, okMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }).catch(function () { fb(text, okMsg); });
    } else {
      fb(text, okMsg);
    }
  }
  function fb(text, okMsg) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast(okMsg); } catch (e) { toast('复制失败'); }
    document.body.removeChild(ta);
  }

  /* ===================== 账号面板：切换 / 新增 / 改名 / 删除 ===================== */
  // 四种操作都在同一层里完成，不再有「点一下就把某个号指派给这台机」的隐式写入：
  // 点账号行 = 设为当前；✎ = 只改名；✕ = 删一条；＋ = 往池里加一条（空输入框，不预填）。
  var accUI = { mid: '', key: '', mode: 'list', editId: '', draft: '' };

  function openAccPanel(btn, machineId, key) {
    closeMenus();
    var m = findMachine(machineId);
    if (!m) return;
    accUI = { mid: machineId, key: key, mode: 'list', editId: '', draft: '' };
    var rect = btn.getBoundingClientRect();
    var menu = document.createElement('div');
    menu.className = 'menu acc-panel';
    menu.setAttribute('data-acc-panel', machineId + ':' + key);
    menu.style.left = Math.max(12, Math.min(rect.left, window.innerWidth - 316)) + 'px';
    menu.style.top = (rect.bottom + 6) + 'px';
    document.body.appendChild(menu);
    paintAccPanel();
  }

  // 其他电脑用过的账号名只作输入建议：点了是填进输入框，不会写库
  function accSuggestHTML(machineName, plat) {
    var seen = {}, out = '';
    function add(v) {
      v = txt(v);
      if (!v || v === '未登录' || seen[v]) return;
      seen[v] = 1;
      out += '<option value="' + escapeHtml(v) + '"><' + '/option>';
    }
    for (var i = 0; i < S.data.accounts.length; i++) {
      var a = S.data.accounts[i];
      if (txt(a[F.a.plat]) !== plat) continue;
      if (txt(a[F.a.mach]) === machineName) continue;
      add(a[F.a.name]);
    }
    return out ? '<datalist id="accSuggest">' + out + '<' + '/datalist>' : '';
  }

  // 图标用内联 SVG 而不是 ✎ / ✕：符号字形在不同系统上大小、粗细、有无都不可控，
  // 内网 Linux 上甚至可能没字形。这里统一成 11px 描边图标。
  var ICO_EDIT = '<svg viewBox="0 0 12 12" aria-hidden="true">' +
    '<path d="M2.1 9.9l.5-2.3 5.5-5.5a1 1 0 0 1 1.4 0l.4.4a1 1 0 0 1 0 1.4L4.4 9.4l-2.3.5z" ' +
    'fill="none" stroke="currentColor" stroke-width="1.05" stroke-linejoin="round"/><' + '/svg>';
  var ICO_DEL = '<svg viewBox="0 0 12 12" aria-hidden="true">' +
    '<path d="M3.3 3.3l5.4 5.4M8.7 3.3l-5.4 5.4" fill="none" stroke="currentColor" ' +
    'stroke-width="1.25" stroke-linecap="round"/><' + '/svg>';

  // 一行 = 共享名单里的一个账号名。✎ 是全局改名，✕ 只解除这台电脑的登记（别的电脑不受影响）
  function accRowHTML(e) {
    var mine = e.mine;
    var on = !!e.cur;
    var id = mine ? mine._id : (e.recs[0] && e.recs[0]._id);
    var tip = on ? '这台电脑正在用'
      : (mine ? '点一下切到这个号' : '共享账号，点一下在这台电脑上使用');
    var right = on
      ? (e.curOthers && e.curOthers.length
        ? '<span class="tag warn" title="这个号在别的电脑上也是当前">' +
          escapeHtml(e.curOthers[0]) + (e.curOthers.length > 1 ? ' 等 ' + e.curOthers.length + ' 台' : '') + ' 也在用<' + '/span>'
        : '<span class="tag">当前<' + '/span>')
      : (mine ? '<span class="tag sub">已登记<' + '/span>'
        : (e.others.length ? '<span class="tag sub">' + escapeHtml(e.others[0]) + ' 在用<' + '/span>' : ''));
    return '<div class="acc-row' + (on ? ' on' : '') + '" data-acc-pick="' + escapeHtml(e.name) + '"' +
        ' title="' + tip + '">' +
      '<span class="dot"></span>' +
      '<span class="nm">' + escapeHtml(e.name) + '<' + '/span>' +
      right +
      '<span class="ops">' +
        '<button class="acc-ico" data-acc-rename="' + escapeHtml(id) + '" title="改名（全库同步）" aria-label="改名">' + ICO_EDIT + '</button>' +
        (mine ? '<button class="acc-ico danger" data-acc-del="' + escapeHtml(mine._id) +
          '" title="解除这台电脑对这个号的登记" aria-label="解除登记">' + ICO_DEL + '</button>' : '') +
      '<' + '/span>' +
    '<' + '/div>';
  }

  function paintAccPanel() {
    var menu = document.querySelector('[data-acc-panel="' + accUI.mid + ':' + accUI.key + '"]');
    if (!menu) return;
    var m = findMachine(accUI.mid);
    if (!m) { closeMenus(); return; }
    var plat = accPlat(accUI.key);
    var machineName = txt(m[F.m.name]);
    var pool = accShared(plat, machineName);
    var platLabel = accUI.key === 'wb' ? 'WorkBuddy' : 'TRAE';

    var body;
    if (!pool.length) {
      body = '<div class="acc-empty">还没有登记任何 ' + platLabel +
        ' 账号。点下面「＋ 新增账号」加一个，之后每台电脑都能从这里选。</div>';
    } else {
      body = '<div class="acc-list">';
      for (var i = 0; i < pool.length; i++) body += accRowHTML(pool[i]);
      body += '<' + '/div>';
    }

    var foot;
    if (accUI.mode === 'add' || accUI.mode === 'rename') {
      var sug = accSuggestHTML(machineName, plat);
      foot = '<div class="acc-form">' +
          '<input class="inline-input" type="text" maxlength="80" autocomplete="off" spellcheck="false"' +
            (sug ? ' list="accSuggest"' : '') +
            ' placeholder="账号名 / 邮箱" value="' + escapeHtml(accUI.draft) + '" data-acc-field>' +
          sug +
          '<div class="acc-form-btns">' +
            '<button data-acc-cancel>取消</button>' +
            '<button class="primary" data-acc-save="1">' + (accUI.mode === 'rename' ? '保存' : '添加') + '</button>' +
          '<' + '/div>' +
        '<' + '/div>';
    } else {
      var hasCur = !!currentAcc(machineName, plat);
      foot = '<div class="acc-foot">' +
        '<button data-acc-add="' + escapeHtml(accUI.mid) + ':' + accUI.key + '">＋ 新增账号</button>' +
        (hasCur ? '<button data-acc-clear="' + escapeHtml(accUI.mid) + ':' + accUI.key + '">清除登录态</button>' : '') +
      '<' + '/div>';
    }

    menu.innerHTML = '<div class="mh">' + platLabel + ' 账号 · ' + escapeHtml(machineName) +
      '<' + '/div>' + body + foot;

    // 贴到视口下沿时往上翻，避免面板被裁掉
    var anchor = document.querySelector('[data-switch="' + accUI.mid + ':' + accUI.key + '"]');
    if (anchor) {
      var r = anchor.getBoundingClientRect();
      var h = menu.offsetHeight;
      var top = r.bottom + 6;
      if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - 6 - h);
      menu.style.top = top + 'px';
      menu.style.left = Math.max(12, Math.min(r.left, window.innerWidth - menu.offsetWidth - 12)) + 'px';
    }

    if (accUI.mode !== 'list') {
      var input = menu.querySelector('[data-acc-field]');
      if (input) {
        input.addEventListener('click', function (e) { e.stopPropagation(); });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); commitAccForm(); }
          else if (e.key === 'Escape') { e.preventDefault(); cancelAccForm(); }
        });
        input.focus();
        try { input.select(); } catch (err) {}
      }
    }
  }

  // 清除登录态：账号仍登记着，但当前没在用（等值于「这台机现在没登这个平台」）
  function clearCurrentAcc() {
    var m = findMachine(accUI.mid);
    if (!m) return;
    var mach = txt(m[F.m.name]), plat = accPlat(accUI.key);
    var cur = currentAcc(mach, plat);
    if (!cur) return;
    cur[F.a.cur] = false;
    render();
    paintAccPanel();
    Repo.accounts.update(cur._id, { '当前': { checkbox: false } })
      .then(function () { touchMachine(mach); toast('已清除登录态，账号仍在列表里'); })
      .catch(function (e) {
        console.error('[workbench] 清除登录态失败', e);
        toast('清除失败');
        loadAccounts(function (accs) { setData('accounts', accs); render(); paintAccPanel(); });
      });
  }

  function startAccAdd() {    if (!accUI.mid) return;
    accUI.mode = 'add';
    accUI.editId = '';
    accUI.draft = '';
    paintAccPanel();
  }

  function startAccRename(id) {
    var a = findAcc(id);
    if (!a) return;
    accUI.mode = 'rename';
    accUI.editId = id;
    accUI.draft = txt(a[F.a.name]);
    paintAccPanel();
  }

  function cancelAccForm() {
    accUI.mode = 'list';
    accUI.editId = '';
    accUI.draft = '';
    paintAccPanel();
  }

  function commitAccForm() {
    var menu = document.querySelector('[data-acc-panel="' + accUI.mid + ':' + accUI.key + '"]');
    var m = findMachine(accUI.mid);
    if (!menu || !m) return;
    var input = menu.querySelector('[data-acc-field]');
    var v = input ? input.value.replace(/^\s+|\s+$/g, '') : '';
    if (!v) { toast('账号名不能为空'); if (input) input.focus(); return; }
    if (/[\r\n]/.test(v)) { toast('账号名不能换行'); if (input) input.focus(); return; }
    if (accUI.mode === 'rename') {
      var a = findAcc(accUI.editId);
      if (!a) { cancelAccForm(); return; }
      renameAcc(a, v);
    } else {
      addAcc(txt(m[F.m.name]), accPlat(accUI.key), v);
    }
  }

  function closeMenus() {
    var ms = document.querySelectorAll('.menu');
    for (var i = 0; i < ms.length; i++) ms[i].parentNode.removeChild(ms[i]);
  }

  var dragCol = null, dragCard = null, dragFromMachineId = null, dragMoved = false, justDragged = false;

  // 把卡片移到另一台电脑的列里：改「所在电脑」并写库
  function dropCardIntoColumn(cardEl, toColId) {
    if (!cardEl || !toColId) return;
    var t = findTask(cardEl.getAttribute('data-task-id'));
    var m = findMachine(toColId);
    if (!t || !m) return;
    var name = txt(m[F.m.name]);
    if (txt(t[F.t.machine]) === name) return;
    t[F.t.machine] = name;
    var props = {};
    props[F.t.machine] = { text: name };
    Repo.tasks.update(t._id, props)
      .then(function () { toast('已移到「' + name + '」'); })
      .catch(function (e) {
        console.error('[workbench] 移动任务失败', e);
        toast('移动失败，正在回滚');
        loadTasks(function (ts) { setData('tasks', ts); render(); });
      });
  }

  function persistColumnOrder() {
    var cols = $('board').querySelectorAll('.col[data-machine-id]');
    var i = 0, failed = 0;
    function next() {
      // 逐条写：中途失败只影响那一条，但必须如实说，不能默默「保存成功」
      if (i >= cols.length) {
        toast(failed ? ('列顺序有 ' + failed + ' 条没保存上，再拖一次即可') : '列顺序已保存');
        return;
      }
      var id = cols[i].getAttribute('data-machine-id');
      var order = i + 1;
      i++;
      var m = findMachine(id);
      if (m) m[F.m.order] = order;
      Repo.machines.update(id, { '排序': { number: order } })
        .catch(function (e) { failed++; console.error('[workbench] 列顺序保存失败', e); })
        .then(next);
    }
    next();
  }

  function persistCardOrder(body) {
    var cards = body.querySelectorAll('.card[data-task-id]');
    var i = 0, failed = 0;
    function next() {
      if (i >= cards.length) {
        toast(failed ? ('任务顺序有 ' + failed + ' 条没保存上，再拖一次即可') : '任务顺序已保存');
        return;
      }
      var id = cards[i].getAttribute('data-task-id');
      var order = i + 1;
      i++;
      var t = findTask(id);
      if (t) t[F.t.order] = order;
      Repo.tasks.update(id, { '排序': { number: order } })
        .catch(function (e) { failed++; console.error('[workbench] 任务顺序保存失败', e); })
        .then(next);
    }
    next();
  }

  // 拖拽刚结束时抑制一次点击：拖完松手浏览器仍会派发 click，
  // 不抑制就会把「拖拽落点」当成「点开了别的卡」
  function markJustDragged() {
    justDragged = true;
    setTimeout(function () { justDragged = false; }, 120);
  }

  // 列拖：拖列头 ⠿ 手柄，只负责「列的顺序」。
  // 投放判定按几何来：与被拖列同一行 → clientX 判左右；换行到别的行 → clientY 判上下。
  // （列宽自适应，列可能并排也可能换行，只用一个轴一定判错）
  function bindColumnDrag(board) {
    board.addEventListener('dragstart', function (e) {
      var handle = e.target.closest ? e.target.closest('.drag-handle') : null;
      if (!handle) return;
      var col = handle.closest('.col');
      if (!col) return;
      dragCol = col;
      dragMoved = false;
      col.classList.add('dragging');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'col');
      }
    });

    board.addEventListener('dragover', function (e) {
      if (!dragCol) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      var target = e.target.closest ? e.target.closest('.col') : null;
      // 兜底列不是真实电脑，不能作为投放目标
      if (!target || target === dragCol || target.classList.contains('col-orphan')) return;
      var r = target.getBoundingClientRect();
      var dr = dragCol.getBoundingClientRect();
      var sameRow = Math.abs(dr.top - r.top) < dr.height / 2;
      var after = sameRow
        ? ((e.clientX - r.left) > r.width / 2)
        : ((e.clientY - r.top) > r.height / 2);
      board.insertBefore(dragCol, after ? target.nextSibling : target);
      dragMoved = true;
    });

    board.addEventListener('dragend', function () {
      if (!dragCol) return;
      dragCol.classList.remove('dragging');
      dragCol = null;
      if (!dragMoved) return;
      persistColumnOrder();
      markJustDragged();
    });
  }

  // 卡片拖：列内排序 + 跨列移动。dragover 只改 DOM，**顺序只在 dragend 落库**，
  // 否则拖一次会按中途经过的位置写十几次库。
  function bindCardDrag(board) {
    board.addEventListener('dragstart', function (e) {
      var card = e.target.closest ? e.target.closest('.card') : null;
      if (!card) return;
      dragCard = card;
      dragMoved = false;
      var fromCol = card.closest ? card.closest('.col') : null;
      dragFromMachineId = fromCol ? fromCol.getAttribute('data-machine-id') : null;
      card.classList.add('dragging');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'card');
      }
    });

    board.addEventListener('dragover', function (e) {
      if (!dragCard) return;
      var body = e.target.closest ? e.target.closest('.col-body') : null;
      if (!body) return;
      var destCol = body.closest ? body.closest('.col') : null;
      // 兜底列不是真实电脑，不能作为投放目标
      if (!destCol || destCol.classList.contains('col-orphan')) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      var over = e.target.closest('.card');
      if (!over) {
        if (body !== dragCard.parentNode) {
          var ph = body.querySelector('.col-empty');
          if (ph) body.insertBefore(dragCard, ph); else body.appendChild(dragCard);
          dragMoved = true;
        }
        return;
      }
      if (over === dragCard) return;
      var rect = over.getBoundingClientRect();
      // 落在卡片下半 → 插到它后面，上半 → 插到它前面
      if ((e.clientY - rect.top) > rect.height / 2) body.insertBefore(dragCard, over.nextSibling);
      else body.insertBefore(dragCard, over);
      dragMoved = true;
    });

    board.addEventListener('dragend', function () {
      if (!dragCard) return;
      var body2 = dragCard.parentNode;
      var cardEl = dragCard;
      dragCard.classList.remove('dragging');
      dragCard = null;
      if (dragMoved && body2) {
        var toCol = body2.closest ? body2.closest('.col') : null;
        var toId = toCol ? toCol.getAttribute('data-machine-id') : null;
        var crossed = !!(toId && dragFromMachineId && toId !== dragFromMachineId);
        if (crossed) dropCardIntoColumn(cardEl, toId);
        // 搜索态下卡片位置不代表真实顺序：只允许换电脑，不保存顺序
        if (!S.ui.q) persistCardOrder(body2);
        else toast('搜索状态下只移动电脑，不保存卡片顺序');
      }
      dragFromMachineId = null;
      if (dragMoved) markJustDragged();
    });
  }

  // 装配：列拖与卡片拖各自独立监听（两边都只认自己的状态，
  // 同一时刻 dragCol / dragCard 只有一个非空，所以互不干扰）
  function bindDrag() {
    var board = $('board');
    bindColumnDrag(board);
    bindCardDrag(board);
    board.addEventListener('drop', function (e) { e.preventDefault(); });
  }


  // ── 全局点击路由表（重构第 4 步）──
  // 委托是「先匹配先执行」。以前顺序由代码位置表达，改一个分支要数一遍上下文；
  // 现在顺序就是数组顺序：加路由只要插到对的位置，越具体的越靠前。
  // 每项：sel 选择器 / stop 是否 stopPropagation / run(命中节点, 事件)
  // 铁律：整卡判定（[data-open] / [data-repo-open]）必须排在所有「卡内按钮」之后。
  var CLICK_ROUTES = [
    // 空态里的两个「清除」：只清这一块的搜索词 / 筛选，不动其它状态
    { sel: '[data-clear-view]', stop: true, run: function () {
      var qEl = $('q');
      if (qEl) qEl.value = '';
      setUi('q', '');
      renderSummary();
      renderBoard();
      renderGithub(); // 搜索同时作用于 GitHub 看板，清词也要把它一起放开
    } },
    { sel: '[data-clear-gh-filter]', stop: true, run: function () {
      setGhFilter({ machine: '', unsync: false });
      renderGithub();
    } },
    // 管理模式的批量操作按钮，优先于其它点击行为
    { sel: '[data-mb]', stop: true, run: function (n) { manageAct(n.getAttribute('data-mb'), n); } },
    { sel: '[data-add]', stop: true, run: function (n) {
      var what = n.getAttribute('data-add');
      closeMenus();
      if (what === 'task') {
        // 没有登记电脑时任务无处安放，先提示而不是打开空表单
        if (!S.data.machines.length) { toast('先加一台电脑，任务才有地方放'); return; }
        gotoSheet({ kind: 'taskForm', id: null, repo: '' }, 'root');
      }
      else if (what === 'gh') gotoSheet({ kind: 'ghForm', id: null, repo: '' }, 'root');
      else if (what === 'import') openImport();
      else if (what === 'machine') openMachineModal();
      else if (what === 'guide') openAiGuide();
    } },
    { sel: '[data-sel-prio]', run: function (n) {
      closeMenus();
      batchUpdateTasks(Object.keys(S.sel.tasks), { '优先级': { select: n.getAttribute('data-sel-prio') } });
    } },
    { sel: '[data-sel-move]', run: function (n) {
      closeMenus();
      batchUpdateTasks(Object.keys(S.sel.tasks), { '所在电脑': { text: n.getAttribute('data-sel-move') } });
    } },
    // 列头账号胶囊 → 账号面板（切换 / 新增 / 改名 / 删除 都在面板里）
    { sel: '[data-switch]', stop: true, run: function (n) {
      var parts = n.getAttribute('data-switch').split(':');
      openAccPanel(n, parts[0], parts[1]);
    } },
    { sel: '[data-acc-rename]', stop: true, run: function (n) { startAccRename(n.getAttribute('data-acc-rename')); } },
    { sel: '[data-acc-del]', stop: true, run: function (n) { confirmDelAcc(n.getAttribute('data-acc-del')); } },
    { sel: '[data-acc-pick]', stop: true, run: function (n) { pickSharedAcc(n.getAttribute('data-acc-pick')); } },
    { sel: '[data-acc-add]', stop: true, run: function () { startAccAdd(); } },
    { sel: '[data-acc-clear]', stop: true, run: function () { clearCurrentAcc(); } },
    { sel: '[data-acc-save]', stop: true, run: function () { commitAccForm(); } },
    { sel: '[data-acc-cancel]', stop: true, run: function () { cancelAccForm(); } },
    // 任务详情的就地编辑（状态 / 优先级 / 待办 / 文字）：
    // 这四类必须排在 [data-edit] 之前，否则详情里的标题会被通用行内编辑抢走
    { sel: '[data-dt-set]', run: function (n) {
      closeMenus();
      var dsv = n.getAttribute('data-dt-set').split('|');
      applyDtSet(dsv[0], dsv[1]);

  (function bindHeatTip() {
    var tip = null;
    function hide() {
      if (tip) { tip.style.display = 'none'; }
    }
    function show(cell) {
      if (!tip) {
        tip = document.createElement('div');
        tip.className = 'hm-tip';
        tip.style.display = 'none';
        document.body.appendChild(tip);
      }
      var day = cell.getAttribute('data-hm-day');
      var n = parseInt(cell.getAttribute('data-hm-n'), 10) || 0;
      tip.innerHTML = '<b>' + day + '</b>' + (n ? '更新 ' + n + ' 个仓库' : '无更新');
      var r = cell.getBoundingClientRect();
      tip.style.display = 'block';
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
      var y = r.top - th - 8;
      if (y < 8) y = r.bottom + 8;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function (e) {
      var c = e.target.closest ? e.target.closest('.hm[data-hm-day]') : null;
      if (c) { show(c); return; }
      hide();
    });
    window.addEventListener('scroll', hide, true);
  })();

  (function bindSplit() {
    var mainEl = document.querySelector('main');
    var boardEl = $('viewBoard');
    var divEl = $('splitDivider');
    if (!mainEl || !boardEl || !divEl) return;
    var KEY = 'awb.wbSplitPct'; // 左栏宽度百分比（30–75）
    function applyPct(p) {
      if (!p || isNaN(p)) return;
      p = Math.max(30, Math.min(75, p));
      boardEl.style.width = p + '%';
    }
    function savePct() {
      try {
        var mw = mainEl.getBoundingClientRect().width;
        if (mw > 0) localStorage.setItem(KEY, String(boardEl.getBoundingClientRect().width / mw * 100));
      } catch (err) {}
    }
    try {
      var saved = parseFloat(localStorage.getItem(KEY));
      if (!isNaN(saved)) applyPct(saved);
    } catch (err) {}

    var dragging = false;
    function pointX(ev) { return (ev.touches && ev.touches.length) ? ev.touches[0].clientX : ev.clientX; }
    function onMove(ev) {
      if (!dragging) return;
      var rect = mainEl.getBoundingClientRect();
      if (!rect.width) return;
      applyPct((pointX(ev) - rect.left) / rect.width * 100);
      if (ev.cancelable) ev.preventDefault();
    }
    function onUp() {
      if (!dragging) return;
      dragging = false;
      divEl.classList.remove('drag');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      paneMax = ''; // 手动拖过就退出放大态
      try { localStorage.setItem('awb.wbPaneMax', ''); } catch (err2) {}
      savePct();
    }
    function onDown(ev) {
      dragging = true;
      divEl.classList.add('drag');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';
      if (ev.cancelable) ev.preventDefault();
    }
    divEl.addEventListener('mousedown', onDown);
    divEl.addEventListener('touchstart', onDown, { passive: false });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);
  })();

  // ── 看板视图状态：单一入口 ──
  // 视图定义（VIEW 表）与取数规则（viewMatch）都在业务层，见上方注释。
  // 这里只负责：切换视图 + 同步分段按钮高亮 + 重渲染。
  //
  // 语义依据：
  //   ToggleGroup 规范「点一下换了同一空间里显示哪份数据 → Tabs Pill」
  //   Radii Filter Chips 规范：不能出现「看起来被选中、但实际没有过滤内容」
  // 唯一的视图状态修改入口。
  // v 一定是合法视图值 —— 所有调用点都经过 viewOfSeg / viewOfKpi 映射（返回字面量），
  // 所以这里不需要「非法值兜底」的守卫：查表查不到就是 bug，应当立刻暴露而不是被静默吞掉。
  function setView(v) {
    setUi('view', v);
    var segEl = $('segTabs');
    if (segEl) {
      var want = VIEW_SEG_OF[v];
      var bs = segEl.querySelectorAll('button');
      for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-s') === want);

    renderSummary();
    renderBoard();
