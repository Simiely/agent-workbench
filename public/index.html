<script>
(function () {
  'use strict';

  var DATABASE_ID = 'tasks'; // Agent 任务台账
  var DB_MACHINE = 'machines'; // 机器登录态
  var DB_GITHUB = 'github'; // GitHub 同步记录

  var F = {
    t: { title: '任务标题', status: '状态', prio: '优先级', machine: '所在电脑', dir: '目录',
         progress: '进度', todos: '待办', handoff: '交接内容', updated: '更新时间', order: '排序' },
    m: { name: '机器名', place: '位置', wb: 'WorkBuddy账号', trae: 'TRAE账号', confirmed: '最后确认', order: '排序' },
    g: { time: '同步时间', machine: '电脑', account: 'GitHub账号', repo: '仓库', content: '内容', versions: '同步版本', result: '是否同步', archived: '仓库归档' }
  };
  var ST_DOING = '进行中', ST_DONE = '已完成';
  var STALE_MS = 7 * 86400000; // 「久未动」阈值：进行中且 7 天没更新

  // 数据层：本地 REST 适配器（零依赖，五个方法与页面业务代码一一对应）
function localDb() {
  function jf(url, opt) {
    return fetch(url, opt).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  var J = { 'Content-Type': 'application/json' };
  return {
    getSchema: function (o) { return jf('/api/schema?db=' + encodeURIComponent(o.databaseId)); },
    query: function (o) { return jf('/api/query?db=' + encodeURIComponent(o.databaseId)); },
    addRecord: function (o) {
      return jf('/api/records', { method: 'POST', headers: J, body: JSON.stringify({ db: o.databaseId, properties: o.properties }) });
    },
    updateRecord: function (o) {
      return jf('/api/records/' + encodeURIComponent(o.recordId), { method: 'PATCH', headers: J, body: JSON.stringify({ db: o.databaseId, properties: o.properties }) });
    },
    deleteRecord: function (o) {
      return jf('/api/records/' + encodeURIComponent(o.recordId) + '?db=' + encodeURIComponent(o.databaseId), { method: 'DELETE' });
    }
  };
}
var db = localDb();

  var S = {
    machines: [],
    tasks: [],
    gh: [],
    ghFilter: { machine: '', unsync: false },
    ghIntensityRange: 'month', // 开发强度范围：week 本周 / month 本月 / 90 近3个月
    hmYear: null,         // 日历弹窗当前查看的年份（null = 打开时落到当年）
    showHmNum: (function () { try { return localStorage.getItem('awb.hmnum') !== '0'; } catch (e) { return true; } })(), // 默认开，除非手动关过,
    ghExpanded: {},
    opts: { status: [], prio: [], wb: [], trae: [], ghResult: [] },
    q: '',
    // 弹窗（sheet）状态：单一枚举，每个值自带全部上下文，不再靠多个布尔拼装
    // kind: taskDetail 任务详情(只读) / taskForm 任务表单 / ghForm 同步记录表单 /
    //       repoDetail 仓库详情(只读)
    // id 就是「当前操作对象」—— 保存/删除/复制交接都从它取，不再另存一份。
    sheet: { kind: '', id: null, repo: '' },
    // 弹窗导航栈：钻取时压入来源视图，「返回」时弹出并重绘。
    // 每项是一个完整的 sheet 描述，可直接重建成界面 —— 所以返回不需要重新查数据源。
    sheetStack: [],
    view: 'doing', // 看板视图（单一枚举）：doing 进行中 / all 全部 / done 已完成 / att 需要关注 / todo 未勾待办
    manage: false, // 管理模式：批量选择与批量操作
    aiMachine: '', // AI 指南里选中的机器名（决定示例 payload 的「所在电脑」）
    ready: false
  };

  function $(id) { return document.getElementById(id); }
  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"\x27]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function txt(v) { return (v == null) ? '' : String(v); }
  function toTime(v) {
    if (!v) return 0;
    var t = new Date(v).getTime();
    return isNaN(t) ? 0 : t;
  }
  function rel(v) {
    var t = toTime(v);
    if (!t) return '—';
    var diff = (Date.now() - t) / 1000;
    if (diff < 90) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    var d = Math.floor(diff / 86400);
    if (d < 30) return d + ' 天前';
    return Math.floor(d / 30) + ' 个月前';
  }
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast on';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 1900);
  }
  // 每条待办带上「原始行号」，勾选时只改那一行，别的行（含空行、缩进）原样保留
  function parseTodos(text) {
    var out = [], lines = txt(text).split('\n');
    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var line = raw.replace(/^\s+|\s+$/g, '');
      if (!line) continue;
      var m = line.match(/^\[(x|X|\s*)\]\s*(.*)$/);
      if (m) out.push({ done: /x/i.test(m[1]), text: m[2], line: i });
      else out.push({ done: false, text: line, line: i });
    }
    return out;
  }
  function todoStat(task) {
    var list = parseTodos(task[F.t.todos]);
    var done = 0;
    for (var i = 0; i < list.length; i++) if (list[i].done) done++;
    return { total: list.length, done: done, list: list };
  }

  function setBind() { /* 资料库版的平台标注机制；本地版无此层 */ }

  function paged(fetchPage, cb) {
    var acc = [], guard = 0;
    function step(cursor) {
      if (guard > 100) { cb(acc, null); return; }
      guard++;
      fetchPage(cursor)
        .then(function (r) {
          var rows = (r && r.results) || [];
          acc = acc.concat(rows);
          var next = r && r.nextCursor;
          if (r && r.hasMore && next && next !== cursor && rows.length) step(next);
          else cb(acc, null);
        })
        .catch(function (err) {
          console.error('[workbench] 数据加载失败', err);
          cb(acc, err);
        });
    }
    step(undefined);
  }

  function loadTasks(cb) {
    paged(function (cursor) {
      return db.query({ databaseId: DATABASE_ID, pageSize: 200, startCursor: cursor });
    }, cb);
  }

  function loadMachines(cb) {
    paged(function (cursor) {
      return db.query({ databaseId: DB_MACHINE, pageSize: 200, startCursor: cursor });
    }, cb);
  }

  function readOpts(schema, key, fieldName) {
    var props = (schema && schema.properties) || [];
    for (var i = 0; i < props.length; i++) {
      if (props[i].name === fieldName) {
        var cfg = props[i].config || {};
        var list = cfg.options || [];
        for (var j = 0; j < list.length; j++) S.opts[key].push(list[j].text);
      }
    }
  }

  function loadAllData(cb) {
    db.getSchema({ databaseId: DATABASE_ID }).then(function (s1) {
      readOpts(s1, 'status', F.t.status);
      readOpts(s1, 'prio', F.t.prio);
      return db.getSchema({ databaseId: DB_MACHINE });
    }).then(function (s2) {
      readOpts(s2, 'wb', F.m.wb);
      readOpts(s2, 'trae', F.m.trae);
      return db.getSchema({ databaseId: DB_GITHUB });
    }).then(function (s3) {
      readOpts(s3, 'ghResult', F.g.result);
    }).catch(function (e) {
      console.error('[workbench] schema 加载失败', e);
    }).then(function () {
      loadMachines( function (ms, e1) {
        S.machines = ms;
        loadTasks( function (ts, e2) {
          S.tasks = ts;
          loadGithub( function (gh, e3) {
            S.gh = gh;
            S.ready = true;
            cb(e1 || e2 || e3);
          });
        });
      });
    });
  }

  function doingTasks() {
    var out = [];
    for (var i = 0; i < S.tasks.length; i++) {
      if (txt(S.tasks[i][F.t.status]) !== ST_DONE) out.push(S.tasks[i]);
    }
    return out;
  }
  function doneTasks() {
    var out = [];
    for (var i = 0; i < S.tasks.length; i++) {
      if (txt(S.tasks[i][F.t.status]) === ST_DONE) out.push(S.tasks[i]);
    }
    return out;
  }
  function match(t) {
    if (!S.q) return true;
    var q = S.q.toLowerCase();
    var blob = (txt(t[F.t.title]) + ' ' + txt(t[F.t.progress]) + ' ' + txt(t[F.t.dir]) + ' ' + txt(t[F.t.handoff]) + ' ' + txt(t[F.t.todos])).toLowerCase();
    return blob.indexOf(q) >= 0;
  }

  // 空看板时要说清「为什么空」，并给出一步清除的入口。
  // 依据：UI Coach Filter UX「让人能说清列表为什么短，否则筛选 UI 就失败了」；
  // Baymard「必须明确高亮当前生效的筛选，让人立刻明白结果为什么这样」。
  // 注意区分两类原因：视图（分段 + KPI 过滤）与单纯的「这台电脑没有任务」——
  // 后者不是筛选造成的，不该显示「清除筛选」。
  function emptyReason() {
    // 搜索是叠加在任意视图上的文本匹配，属于真·筛选 → 要给清除入口
    if (S.q) {
      return '搜索「' + S.q + '」没有匹配的任务<br>' +
        '<button class="mini" data-clear-view="1">清除搜索</button>';
    }
    // 其余情况是「这个视图下这台电脑本来就没有任务」→ 不是筛选，不给清除按钮
    if (S.view === 'done') return '这台电脑下还没有已完成的任务';
    if (S.view === 'att') return '这台电脑下没有需要关注的任务';
    if (S.view === 'todo') return '这台电脑下没有欠账的任务';
    if (S.view === 'all') return '这台电脑下还没有任务';
    return '这台电脑下没有进行中的任务';
  }

  // 列头计数的单位词：跟着当前视图走
  function viewCountUnit() {
    if (S.view === 'all') return '个';
    if (S.view === 'done') return '个已完成';
    if (S.view === 'att') return '个需关注';
    if (S.view === 'todo') return '个有欠账';
    return '个进行中';
  }

  function isStale(t) {
    if (txt(t[F.t.status]) === ST_DONE) return false;
    var u = toTime(t[F.t.updated]);
    return u > 0 && (Date.now() - u) > STALE_MS;
  }
  function staleDays(t) {
    return Math.floor((Date.now() - toTime(t[F.t.updated])) / 86400000);
  }
  // ── 视图定义：5 个合法视图，每个自带完整取数规则 ──
  //
  // 为什么是单一枚举而不是「分段 × 过滤」两维：两个维度必然能组合出无意义组合
  // （已完成 ∩ 需要关注 恒为空集），于是就得加守卫去拦截非法组合——那是补丁压补丁。
  // 守卫越多，状态越难推理，迟早出现「显示激活但内容没变」的自相矛盾状态。
  //
  // 单一枚举后合法视图只有 5 个，不存在「组合」这回事，于是不需要任何守卫。
  // 注意 att / todo 的规则本身就限定在「进行中」内 —— 它们不是叠加在分段上的过滤器，
  // 而是独立的完整视图（分段按钮对应关系见 VIEW_SEG_OF）。
  var VIEW = {
    doing: function (t) { return txt(t[F.t.status]) !== ST_DONE; },
    all:   function (t) { return true; },
    done:  function (t) { return txt(t[F.t.status]) === ST_DONE; },
    att:   function (t) {
      if (txt(t[F.t.status]) === ST_DONE) return false;
      return isStale(t) || txt(t[F.t.prio]) === 'P0';
    },
    todo:  function (t) {
      if (txt(t[F.t.status]) === ST_DONE) return false;
      var st = todoStat(t);
      return st.total > st.done;
    }
  };
  // 视图 → 分段按钮（data-s）值。att/todo 归到「进行中」分段，
  // 因为它们的取数范围就是进行中的任务。
  var VIEW_SEG_OF = { doing: '进行中', all: '全部', done: '已完成', att: '进行中', todo: '进行中' };

  // 任务是否属于当前视图。规则在 VIEW 表里，这里只做查表调用。
  function viewMatch(t) {
    return VIEW[S.view](t);
  }

  function renderSummary() {
    var doing = doingTasks(), done = doneTasks();
    var att = 0, unt = 0;
    for (var i = 0; i < doing.length; i++) {
      if (isStale(doing[i]) || txt(doing[i][F.t.prio]) === 'P0') att++;
      var st = todoStat(doing[i]);
      if (st.total > st.done) unt++;
    }
    function kpi(cls, k, num, lab, hint, active) {
      return '<button class="kpi ' + cls + (active ? ' on' : '') + '" data-k="' + k + '">' +
        '<span class="num">' + num + '</span><span class="lab">' + lab + '</span>' +
        (hint ? '<span class="hint">' + hint + '</span>' : '') + '<' + '/button>';
    }
    // KPI 卡片的高亮 = 它是否就是当前视图：
    //   「进行中」→ 当前是进行中视图且没有二级过滤
    //   「需要关注 / 未勾待办」→ 当前生效的 KPI 过滤
    //   「已完成」→ 当前是已完成视图
    // 这样任何时刻只有一个卡片亮起，用户一眼知道自己在哪个视图里。
    // KPI 卡片高亮 = 它对应的视图就是当前视图。任何时刻最多一个亮起。
    var hAtt = att ? 'P0 · 久未动' : '';
    var hTodo = '点击筛选';
    var hDone = S.view === 'done' ? '当前视图' : '点击切换视图';
    $('summary').innerHTML = '<div class="kpis">' +
      kpi('', '', doing.length, '进行中', '默认视图', S.view === 'doing') +
      kpi('alert', 'att', att, '需要关注', hAtt, S.view === 'att') +
      kpi('warn', 'todo', unt, '未勾待办', hTodo, S.view === 'todo') +
      kpi('good', 'done', done.length, '已完成', hDone, S.view === 'done') +
      '<' + '/div>';
  }

  function accPill(m, key) {
    var field = key === 'wb' ? F.m.wb : F.m.trae;
    var val = txt(m[field]);
    var label = key === 'wb' ? 'WB' : 'TRAE';
    var empty = (!val || val === '未登录');
    return '<button class="acc ' + (empty ? 'empty' : '') + '" data-switch="' + escapeHtml(m._id) + ':' + key + '">' +
      '<span class="led"></span><span class="pf">' + label + '<' + '/span>' +
      '<span class="an">' + (empty ? '未登录' : escapeHtml(val)) + '</span></button>';
  }

  function cardHTML(t) {
    var st = todoStat(t);
    var isDone = txt(t[F.t.status]) === ST_DONE;
    var pct = st.total ? Math.round(st.done / st.total * 100) : 0;
    // v16 卡面瘦身：标题 / 元数据行 / 进度一句话 / 待办进度条；操作按钮 hover 才出现
    var meta =
      '<span class="prio ' + escapeHtml(txt(t[F.t.prio])).toLowerCase() + '">' + escapeHtml(txt(t[F.t.prio]) || '—') + '<' + '/span>' +
      '<span class="c-mach">🖥 ' + escapeHtml(txt(t[F.t.machine]) || '未指定') + '<' + '/span>' +
      '<span class="c-age">' + rel(t[F.t.updated]) + '<' + '/span>' +
      (!isDone && isStale(t) ? '<span class="stale">久未动 ' + staleDays(t) + ' 天</span>' : '');
    var prog = txt(t[F.t.progress])
      ? '<div class="c-prog">' + escapeHtml(t[F.t.progress]) + '<' + '/div>' : '';
    var todo = st.total
      ? '<div class="c-todo"><div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<span class="tnum">' + st.done + '/' + st.total + ' 待办</span></div>' : '';
    return '<div class="card' + (txt(t[F.t.prio]) === 'P0' && !isDone ? ' p0' : '') + (isDone ? ' done' : '') +
        '" data-task-id="' + escapeHtml(t._id) + '" data-open="' + escapeHtml(t._id) + '"' +
        ' draggable="' + (isDone || S.manage ? 'false' : 'true') + '">' +
      '<span class="sel-box">✓</span>' +
      '<div class="c-title" title="点击查看详情">' + escapeHtml(t[F.t.title]) + '<' + '/div>' +
      '<div class="c-meta">' + meta + '<' + '/div>' +
      prog + todo +
      '<div class="c-actions">' +
        '<button class="mini" data-copy="' + escapeHtml(t._id) + '">复制交接</button>' +
        '<button class="mini" data-edit-task="' + escapeHtml(t._id) + '">编辑</button>' +
        '<button class="dots" data-task-menu="' + escapeHtml(t._id) + '" title="更多操作">⋯</button>' +
      '<' + '/div>' +
    '<' + '/div>';
  }

  function sortedMachines() {
    var arr = [];
    for (var i = 0; i < S.machines.length; i++) arr.push(S.machines[i]);
    arr.sort(function (a, b) {
      var na = (typeof a[F.m.order] === 'number') ? a[F.m.order] : 9999;
      var nb = (typeof b[F.m.order] === 'number') ? b[F.m.order] : 9999;
      if (na !== nb) return na - nb;
      return txt(a[F.m.name]) < txt(b[F.m.name]) ? -1 : 1;
    });
    return arr;
  }

  function byOrder(a, b) {
    var oa = (typeof a[F.t.order] === 'number') ? a[F.t.order] : 9999;
    var ob = (typeof b[F.t.order] === 'number') ? b[F.t.order] : 9999;
    if (oa !== ob) return oa - ob;
    var pa = txt(a[F.t.prio]), pb = txt(b[F.t.prio]);
    if (pa !== pb) return pa < pb ? -1 : 1;
    return toTime(b[F.t.updated]) - toTime(a[F.t.updated]);
  }

  function renderBoard() {
    // 视图决定取哪些任务：doing 进行中 / all 全部 / done 已完成 / att 需要关注 / todo 未勾待办
    var list = S.tasks.slice();
    var host = $('board');
    var out = '';
    var machines = sortedMachines();
    for (var i = 0; i < machines.length; i++) {
      var m = machines[i];
      var items = [];
      for (var j = 0; j < list.length; j++) {
        if (txt(list[j][F.t.machine]) === txt(m[F.m.name]) && match(list[j]) && viewMatch(list[j])) items.push(list[j]);
      }
      items.sort(byOrder);
      var body = '';
      if (!items.length) {
        body = '<div class="col-empty">' + emptyReason() + '<' + '/div>';
      } else {
        for (var n = 0; n < items.length; n++) body += cardHTML(items[n]);
      }
      out += '<section class="col" data-machine-id="' + escapeHtml(m._id) + '">' +
        '<div class="col-head">' +
          '<div class="ch-top">' +
            '<span class="drag-handle" draggable="true" title="拖动调整顺序">⠿</span>' +
            '<span class="ch-name" data-edit="machineName" data-id="' + escapeHtml(m._id) + '" title="点击可直接改名">' + escapeHtml(m[F.m.name]) + '<' + '/span>' +
            (m[F.m.place]
              ? '<span class="ch-place" data-edit="machinePlace" data-id="' + escapeHtml(m._id) + '" title="点击可改位置标签">' + escapeHtml(m[F.m.place]) + '<' + '/span>'
              : '<span class="ch-place empty" data-edit="machinePlace" data-id="' + escapeHtml(m._id) + '" title="点击添加位置标签">＋位置<' + '/span>') +
            '<span class="ch-count"><b>' + items.length + '</b> ' + viewCountUnit() + '<' + '/span>' +
            '<button class="dots" data-machine-menu="' + escapeHtml(m._id) + '" title="机器操作">⋯</button>' +
          '<' + '/div>' +
          '<div class="ch-acc">' + accPill(m, 'wb') + accPill(m, 'trae') + '<' + '/div>' +
        '<' + '/div>' +
        '<div class="col-body">' + body + '<' + '/div>' +
      '<' + '/section>';
    }
    // 兜底列：所在电脑对不上任何一台已登记电脑的任务，不能就这么从看板上消失（P-05/P-06）
    var known = {};
    for (var q = 0; q < machines.length; q++) known[txt(machines[q][F.m.name])] = 1;
    var orphans = [];
    for (var w = 0; w < list.length; w++) {
      if (!known[txt(list[w][F.t.machine])] && match(list[w]) && viewMatch(list[w])) orphans.push(list[w]);
    }
    if (orphans.length) {
      orphans.sort(byOrder);
      var obody = '';
      for (var oi = 0; oi < orphans.length; oi++) obody += cardHTML(orphans[oi]);
      out += '<section class="col col-orphan">' +
        '<div class="col-head">' +
          '<div class="ch-top">' +
            '<span class="ch-name">未识别电脑</span>' +
            '<span class="ch-count"><b>' + orphans.length + '</b> 个待归位</span>' +
          '<' + '/div>' +
          '<div class="ch-acc"><span class="orphan-hint">「所在电脑」对不上任何一台，点卡片改掉</span></div>' +
        '<' + '/div>' +
        '<div class="col-body">' + obody + '<' + '/div>' +
      '<' + '/section>';
    }
    if (!machines.length && !orphans.length) {
      out = '<div class="col"><div class="col-body"><div class="col-empty">还没有登记电脑，点右上角「＋ 新增 → 添加电脑」加一台。</div></div></div>';
    }
    host.innerHTML = out;
    var heads = host.querySelectorAll('.col-head');
    for (var h = 0; h < heads.length; h++) setBind(heads[h], DB_MACHINE);
  }

  function render() {
    renderSummary();
    renderBoard();
    renderGithub();
    syncSel();
    renderManageBar();
  }

  function findTask(id) {
    for (var i = 0; i < S.tasks.length; i++) if (S.tasks[i]._id === id) return S.tasks[i];
    return null;
  }

  /* ===================== GitHub 同步板块 ===================== */
  function loadGithub(cb) {
    paged(function (cursor) {
      return db.query({ databaseId: DB_GITHUB, pageSize: 200, startCursor: cursor });
    }, cb);
  }
  function ghRecId(r) { return r && (r._id || r.id); }
  function normDate(v) {
    if (v == null) return null;
    if (typeof v === 'string') return v;
    if (typeof v === 'object') {
      if (v.value != null) return v.value;
      if (v.date != null) return v.date;
      if (v.text != null) return v.text;
    }
    return v;
  }
  function fmtDateTime(v) {
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function toLocalInput(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function ghRepoGroups() {
    var map = {}, arr = [];
    for (var i = 0; i < S.gh.length; i++) {
      var r = S.gh[i];
      var name = txt(r[F.g.repo]) || '未命名仓库';
      if (!map[name]) {
        map[name] = { name: name, records: [], latest: 0, versions: [], machines: [], accounts: [], archived: false };
        arr.push(map[name]);
      }
      var g = map[name];
      g.records.push(r);
      var t = toTime(normDate(r[F.g.time]));
      if (t > g.latest) g.latest = t;
      var vs = txt(r[F.g.versions]).split(/[\n,，]/);
      for (var vi = 0; vi < vs.length; vi++) {
        var v = vs[vi].replace(/^\s+|\s+$/g, '');
        if (v && g.versions.indexOf(v) < 0) g.versions.push(v);
      }
      var mc = txt(r[F.g.machine]); if (mc && g.machines.indexOf(mc) < 0) g.machines.push(mc);
      var ac = txt(r[F.g.account]); if (ac && g.accounts.indexOf(ac) < 0) g.accounts.push(ac);
      if (r[F.g.archived]) g.archived = true; // 仓库归档是仓库级属性：任一条记录勾了就算
    }
    for (var j = 0; j < arr.length; j++) {
      arr[j].records.sort(function (a, b) { return toTime(normDate(b[F.g.time])) - toTime(normDate(a[F.g.time])); });
    }
    var out = [];
    for (var k = 0; k < arr.length; k++) {
      if (S.ghFilter.machine && arr[k].machines.indexOf(S.ghFilter.machine) < 0) continue;
      out.push(arr[k]);
    }
    out.sort(function (a, b) { return b.latest - a.latest; });
    return out;
  }

  function resClass(v) {
    // v16 语义：是否同步。兼容历史遗留值（成功→已同步，其余一律按未同步）
    if (v === '已同步' || /成功/.test(v)) return 'ok';
    if (!v) return '';
    return 'un';
  }

  function repoEntryHTML(r) {
    var d = normDate(r[F.g.time]);
    var vs = txt(r[F.g.versions]).split(/[\n,，]/).map(function (s) { return s.replace(/^\s+|\s+$/g, ''); }).filter(function (s) { return s; });
    var res = txt(r[F.g.result]);
    var resHtml = res ? '<span class="re-res ' + resClass(res) + '">' + escapeHtml(res) + '<' + '/span>' : '';
    return '<div class="repo-entry" data-gh-id="' + escapeHtml(ghRecId(r)) + '">' +
      '<span class="sel-box">✓</span>' +
      '<span class="re-time">' + (d ? fmtDateTime(d).slice(5) : '—') + '<' + '/span>' +
      '<span class="re-ver">' + escapeHtml(vs.join(' / ') || '—') + '<' + '/span>' +
      resHtml +
      '<span class="re-who">' + escapeHtml((txt(r[F.g.account]) || '') + (txt(r[F.g.machine]) ? ' · ' + txt(r[F.g.machine]) : '')) + '<' + '/span>' +
      '<span class="re-content">' + escapeHtml(txt(r[F.g.content]) || '') + '<' + '/span>' +
      '<button class="dots re-dots" data-gh-menu="' + escapeHtml(ghRecId(r)) + '" title="操作">⋯</button>' +
    '<' + '/div>';
  }

  /* ── 仓库详情（只读）──
     记录优先模式的延伸：点仓库卡 → 先看这个仓库的整体情况（统计/版本/全部记录），
     要改哪一条再点那条记录进编辑态。跟任务详情是同一套交互逻辑。 */
  function renderRepoDetail(repoName) {
    var g = null;
    var groups = ghRepoGroups();
    for (var i = 0; i < groups.length; i++) if (groups[i].name === repoName) { g = groups[i]; break; }
    if (!g) { toast('这个仓库下没有记录'); return false; }
    $('drawerTitle').textContent = repoName;
    setSheetFoot({ save: false, edit: false, copy: false, repoAdd: true, repoCopy: true, del: false });

    var unsync = 0;
    for (var f = 0; f < g.records.length; f++) if (txt(g.records[f][F.g.result]) === '未同步') unsync++;

    var html = '';
    // 概要：最近同步 / 记录数 / 未同步数 / 归档状态
    html += '<div class="dt-sec">' +
      '<div class="dt-tags">' +
        '<span class="dt-tag">' + g.records.length + ' 条记录</span>' +
        (unsync ? '<span class="dt-tag prio-p1">' + unsync + ' 条未同步</span>' : '') +
        (g.archived ? '<span class="dt-tag">已归档</span>' : '') +
        (g.latest ? '<span class="dt-tag">最近 ' + escapeHtml(fmtDateTime(g.latest)) + '</span>' : '') +
      '<' + '/div>' +
      (g.machines.length || g.accounts.length ?
        '<div class="dt-meta" style="margin-top:9px">' +
          g.machines.map(function (m) { return '<span>🖥 ' + escapeHtml(m) + '</span>'; }).join('') +
          g.accounts.map(function (a) { return '<span>@' + escapeHtml(a) + '</span>'; }).join('') +
        '<' + '/div>' : '') +
    '<' + '/div>';

    // 版本
    if (g.versions.length) {
      html += '<div class="dt-sec"><div class="dt-label">版本</div><div class="repo-vers">' +
        g.versions.map(function (v) { return '<span class="gh-ver">v <b>' + escapeHtml(v.replace(/^v/i, '')) + '</b></span>'; }).join('') +
        '<' + '/div><' + '/div>';
    }

    // 全部同步记录（倒序），点一条 → 进那条记录的编辑态
    html += '<div class="dt-sec"><div class="dt-label">全部记录</div><div class="rd-list">';
    for (var r = 0; r < g.records.length; r++) {
      var rec = g.records[r];
      var d = normDate(rec[F.g.time]);
      var vs = txt(rec[F.g.versions]).split(/[\n,，]/).map(function (s) { return s.replace(/^\s+|\s+$/g, ''); }).filter(function (s) { return s; });
      var res = txt(rec[F.g.result]);
      html += '<button class="rd-row" data-gh-open="' + escapeHtml(ghRecId(rec)) + '">' +
        '<span class="rd-time">' + (d ? escapeHtml(fmtDateTime(d)) : '—') + '<' + '/span>' +
        '<span class="rd-ver">' + escapeHtml(vs.join(' / ') || '—') + '<' + '/span>' +
        '<span class="re-res ' + resClass(res) + '">' + escapeHtml(res || '—') + '<' + '/span>' +
        '<span class="rd-content">' + escapeHtml(txt(rec[F.g.content]) || '（无内容）') + '<' + '/span>' +
        '<span class="rd-chev">›</span>' +
      '<' + '/button>';
    }
    html += '<' + '/div><' + '/div>';

    $('drawerBody').innerHTML = html;
    setBind($('drawerBody'), DB_GITHUB);
    return true;
  }

  function repoCardHTML(g) {
    var expanded = !!S.ghExpanded[g.name];
    var shown = expanded ? g.records : g.records.slice(0, 3);
    var verHtml = '';
    var vers = g.versions.slice(0, 8);
    for (var i = 0; i < vers.length; i++) verHtml += '<span class="gh-ver">v <b>' + escapeHtml(vers[i].replace(/^v/i, '')) + '<' + '/b></span>';
    if (!verHtml) verHtml = '<span class="gh-ver">—</span>';
    var metaHtml = '';
    for (var m = 0; m < g.machines.length; m++) metaHtml += '<span class="badge">🖥 ' + escapeHtml(g.machines[m]) + '<' + '/span>';
    for (var a = 0; a < g.accounts.length; a++) metaHtml += '<span class="badge">@' + escapeHtml(g.accounts[a]) + '<' + '/span>';
    var rows = '';
    for (var e = 0; e < shown.length; e++) rows += repoEntryHTML(shown[e]);
    var latestStr = g.latest ? fmtDateTime(g.latest) : '—';
    var ageStr = g.latest ? rel(g.latest) : '';
    var moreBtn = g.records.length > 3 ? '<button class="link-btn" data-repo-toggle="' + escapeHtml(g.name) + '">' + (expanded ? '收起' : '查看全部 ' + g.records.length + ' 条') + '<' + '/button>' : '';
    var unsync = 0;
    for (var f = 0; f < g.records.length; f++) {
      if (txt(g.records[f][F.g.result]) === '未同步') unsync++;
    }
    var unsyncHtml = unsync ? '<span class="repo-unsync">' + unsync + ' 条未同步<' + '/span>' : '';
    // 整卡可点：判定范围挂在卡片容器上，跟任务看板的 .card 一样。
    // 仓库名降级为纯文本（不再单独可点），复制链接独立成按钮。
    return '<div class="repo-card" data-repo="' + escapeHtml(g.name) + '" data-repo-open="' + escapeHtml(g.name) + '" title="点击查看仓库详情">' +
      '<div class="repo-head">' +
        '<span class="repo-name">' + escapeHtml(g.name) + '</span>' +
        unsyncHtml +
        '<span class="repo-count">' + g.records.length + ' 条' + '<' + '/span>' +
        (g.archived ? '<span class="archtag">已归档<' + '/span>' : '') +
        '<button class="repo-copy" data-copy-repo="https://github.com/' + escapeHtml(g.name) + '" title="复制仓库链接">⧉ 复制链接</button>' +
        '<button class="repo-del" data-mb="del-repo" data-repo="' + escapeHtml(g.name) + '" title="删除该仓库的全部同步记录">删整仓</button>' +
      '<' + '/div>' +
      '<div class="repo-sub">最近 ' + escapeHtml(latestStr) + (ageStr ? '<span class="sub">' + escapeHtml(ageStr) + '<' + '/span>' : '') + '<' + '/div>' +
      '<div class="repo-vers">' + verHtml + '<' + '/div>' +
      '<div class="repo-meta">' + metaHtml + '<' + '/div>' +
      '<div class="repo-entries">' + rows + '<' + '/div>' +
      '<div class="repo-foot">' + moreBtn + '<button class="link-btn" data-repo-add="' + escapeHtml(g.name) + '">＋ 记录同步<' + '/button>' + '<' + '/div>' +
    '<' + '/div>';
  }

  // ===== 开发强度 =====
  // 按天统计「有更新的仓库数」（同一仓库当天多次同步只算一次）。
  // 返回 { 'YYYY-MM-DD': { n: 去重仓库数, repos: [仓库名] } }，头部柱状图与全年日历共用。
  function ghDailyMap() {
    var byDay = {};
    for (var i = 0; i < S.gh.length; i++) {
      var r = S.gh[i];
      var t = toTime(normDate(r[F.g.time]));
      if (!t) continue;
      var d = new Date(t);
      var key = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      if (!byDay[key]) byDay[key] = { repos: {} };
      var repo = txt(r[F.g.repo]) || '未命名仓库';
      byDay[key].repos[repo] = 1;
    }
    var out = {};
    for (var k in byDay) {
      var names = Object.keys(byDay[k].repos);
      out[k] = { n: names.length, repos: names };
    }
    return out;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  // ===== 开发强度 · 头部 =====
  // 三种范围都是「完整周期」，可能包含未来几天（未来画灰格、不写数字）：
  //   week  本周    = 本周一 ~ 本周日（恒 7 格）
  //   week  本周    = 1 排，周一 ~ 周日（恒 7 格）
  //   month 本月    = 2 排，上半月(1~15) / 下半月(16~月末)，合计画满整月
  //   q3    近3个月 = 3 排，最近 3 个自然月各一排（含本月，new Date 负月自动进位）
  // 单一入口 giRangeRows(range) 返回 [{start, end, label}]，渲染与测试都只认它。
  function giRangeRows(range) {
    var DAY = 86400000;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var ts = today.getTime();
    var wd = (today.getDay() + 6) % 7; // 周一 = 0
    if (range === 'week') return [{ start: ts - wd * DAY, end: ts + (6 - wd) * DAY, label: '本周' }];
    if (range === 'month') {
      var y = today.getFullYear(), m = today.getMonth();
      return [
        { start: new Date(y, m, 1).getTime(), end: new Date(y, m, 15).getTime(), label: '上半月' },
        { start: new Date(y, m, 16).getTime(), end: new Date(y, m + 1, 0).getTime(), label: '下半月' }
      ];
    }
    var rows = [];
    for (var i = 2; i >= 0; i--) {
      var yy = today.getFullYear(), mm = today.getMonth() - i;
      rows.push({ start: new Date(yy, mm, 1).getTime(), end: new Date(yy, mm + 1, 0).getTime(), label: (mm + 1) + '月' });
    }
    return rows;
  }
  function giLevel(n) { return n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n === 3 ? 3 : 4; }

  // 数字自适应：格子有多大数字就多大（短边的约 45%，夹在 9~20px），写入面板级 CSS 变量。
  // 拖动分隔条 / 放大本栏 / 窗口缩放都会经 ResizeObserver 重新触发。
  function fitGiNum() {
    var host = $('ghIntensity');
    if (!host) return;
    var cell = host.querySelector('.gi-cell:not(.future)') || host.querySelector('.gi-cell');
    if (!cell) return;
    var r = cell.getBoundingClientRect();
    if (r.width < 4 || r.height < 4) return;
    // 高度上给格内小日期（约 10px）留位，再按短边 45% 取字号
    var size = Math.max(9, Math.min(20, Math.round(Math.min(r.width, r.height - 12) * 0.45)));
    host.style.setProperty('--gi-num', size + 'px');
  }

  // 头部：多排方块格子热力（每排一段日期，旧 → 新，周期末日在最右），有更新的格子写数字。
  // 点面板任意处（范围按钮除外）→ 打开全年日历弹窗。
  function renderGhIntensity() {
    var host = $('ghIntensity');
    if (!host) return;
    // 高度与任务看板的 KPI 四方块（2×2 + 间距）对齐：动态读取，不硬编码
    var kEl = document.querySelector('#summary .kpis');
    if (kEl && kEl.offsetHeight > 0) host.style.minHeight = (kEl.offsetHeight + 12) + 'px'; // +12 = KPI 块的 margin-bottom

    var head = '<div class="gi-head">' +
      '<div class="gi-label"><b>开发强度</b><span>每天更新的仓库数</span></div>' +
      '<div class="gi-ranges">' +
        '<button class="gi-range' + (S.ghIntensityRange === 'week' ? ' on' : '') + '" data-gi-range="week">本周</button>' +
        '<button class="gi-range' + (S.ghIntensityRange === 'month' ? ' on' : '') + '" data-gi-range="month">本月</button>' +
        '<button class="gi-range' + (S.ghIntensityRange === 'q3' ? ' on' : '') + '" data-gi-range="q3">近3个月</button>' +
      '<' + '/div>' +
      '<span class="gi-open">点开看全年日历 ›</span>' +
      '<' + '/div>';

    var map = ghDailyMap();
    var DAY = 86400000;
    var todayTs = new Date(); todayTs.setHours(0, 0, 0, 0); todayTs = todayTs.getTime();
    var rows = giRangeRows(S.ghIntensityRange);

    var hasData = false;
    for (var r = 0; r < rows.length && !hasData; r++) {
      for (var ts0 = rows[r].start; ts0 <= rows[r].end; ts0 += DAY) {
        var e0 = map[dayKey(ts0)];
        if (e0 && e0.n > 0) { hasData = true; break; }
      }
    }
    if (!hasData) {
      host.innerHTML = head + '<div class="gi-empty">这段时间还没有同步记录，写一笔就能看到每天的更新强度。</div>';
      return;
    }

    var body = '';
    for (var r2 = 0; r2 < rows.length; r2++) {
      var row = rows[r2];
      var cells = '';
      for (var i = 0, ts = row.start; ts <= row.end; i++, ts += DAY) {
        var key = dayKey(ts);
        var en = map[key];
        var n = en ? en.n : 0;
        var future = ts > todayTs;
        var lv = giLevel(n);
        // 日期写进方块里（小字在下方）；有更新的格子再叠大数字
        var dl = new Date(ts);
        var inner = '<em>' + dl.getDate() + '</em>' + ((!future && n) ? '<i>' + n + '</i>' : '');
        var tip = future ? key.slice(5) + ' · 还没到' : key.slice(5) + (n ? ' · 更新 ' + n + ' 个仓库' : ' · 无更新');
        cells += '<span class="gi-cell l' + lv + (future ? ' future' : '') + '" data-gi-day="' + key + '" data-gi-n="' + n + '"' +
          ' title="' + tip + '">' + inner + '<' + '/span>';
      }
      body += '<div class="gi-rowblock">' +
        '<span class="gi-rowlabel">' + row.label + '</span>' +
        '<div class="gi-chart">' + cells + '<' + '/div>' +
        '<' + '/div>';
    }
    host.innerHTML = head + '<div class="gi-rows">' + body + '<' + '/div>';
    requestAnimationFrame(fitGiNum);
  }

  // 弹窗：按年展示的日历热力图（GitHub contributions 风格），可切换年份。
  // 行 = 周一到周日，列 = 周；格子颜色分 5 档；可开「显示数字」；悬停显示当天更新的仓库。
  function renderIntensitySheet() {
    $('drawerTitle').textContent = '开发强度 · 日历';
    setSheetFoot({ save: false, edit: false, copy: false, repoAdd: false, repoCopy: false, del: false });
    var map = ghDailyMap();
    var DAY = 86400000;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var thisYear = today.getFullYear();
    if (typeof S.hmYear !== 'number' || S.hmYear > thisYear) S.hmYear = thisYear;
    var yearStart = new Date(S.hmYear, 0, 1).getTime();
    var yearEnd = new Date(S.hmYear, 11, 31).getTime();
    var end = yearEnd; // 每一年的格子都显示完全：当年也画到 12/31，未来日期是灰色空格
    var startWd = (new Date(yearStart).getDay() + 6) % 7; // 周一 = 0
    var gridStart = yearStart - startWd * DAY;
    var weeks = Math.ceil((end - gridStart + DAY) / DAY / 7);

    var nav =
      '<div class="hm-nav">' +
        '<button class="hm-navbtn" data-hm-year="prev" title="上一年">‹</button>' +
        '<b>' + S.hmYear + '</b>' +
        '<button class="hm-navbtn" data-hm-year="next" title="下一年"' + (S.hmYear >= thisYear ? ' disabled' : '') + '>›</button>' +
      '<' + '/div>';
    var numBtn = '<button class="hm-numtoggle' + (S.showHmNum ? ' on' : '') + '" data-hm-num="1" title="在格子里显示当天的仓库数">显示数字</button>';

    var wds = '<div class="hm-wds">';
    for (var wi = 0; wi < 7; wi++) wds += '<span>' + (wi % 2 === 0 ? '一二三四五六日'.charAt(wi) : '') + '</span>';
    wds += '<' + '/div>';

    var months = [], cols = '', activeDays = 0, totalN = 0, maxN = 0, prevMonth = -1;
    for (var w = 0; w < weeks; w++) {
      var col = '', colMonth = -1;
      for (var d = 0; d < 7; d++) {
        var ts = gridStart + (w * 7 + d) * DAY;
        if (ts < yearStart || ts > end) { col += '<span class="hm blank"></span>'; continue; }
        if (d === 0) colMonth = new Date(ts).getMonth();
        var key = dayKey(ts);
        var e = map[key];
        var n = e ? e.n : 0;
        if (n > 0) { activeDays++; totalN += n; }
        if (n > maxN) maxN = n;
        var lv = n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n === 3 ? 3 : 4;
        var num = (S.showHmNum && n) ? '<i>' + n + '</i>' : '';
        col += '<span class="hm l' + lv + '" data-hm-day="' + key + '" data-hm-n="' + n + '">' + num + '</span>';
      }
      if (colMonth >= 0 && colMonth !== prevMonth) {
        months.push('<span style="left:' + (w / weeks * 100).toFixed(2) + '%">' + (colMonth + 1) + '月</span>');
        prevMonth = colMonth;
      }
      cols += '<div class="hm-week">' + col + '<' + '/div>';
    }

    var legend = '<span>少</span>';
    for (var l = 0; l <= 4; l++) legend += '<span class="hm l' + l + '"></span>';
    legend += '<span>多</span>';

    $('drawerBody').innerHTML =
      '<div class="hm-wrap">' +
        '<div class="hm-head">' + nav +
          '<div class="hm-summary">' + S.hmYear + ' 年 · <b>' + activeDays + '</b> 天有更新 · 共 <b>' + totalN + '</b> 仓库次 · 单日最多 <b>' + maxN + '</b></div>' +
          numBtn +
        '<' + '/div>' +
        '<div class="hm-scroll">' +
          '<div class="hm-months">' + months.join('') + '<' + '/div>' +
          '<div class="hm-flex">' + wds + '<div class="hm-grid">' + cols + '<' + '/div><' + '/div>' +
        '<' + '/div>' +
        '<div class="hm-legend">' + legend + '<' + '/div>' +
      '<' + '/div>';
    return true;
  }

  function renderGithub() {
    var groups = ghRepoGroups();
    // 「未同步」筛选：只看有未同步版本的仓库
    if (S.ghFilter.unsync) {
      var kept = [];
      for (var u = 0; u < groups.length; u++) {
        var gu = groups[u], nu = 0;
        for (var ur = 0; ur < gu.records.length; ur++) if (txt(gu.records[ur][F.g.result]) === '未同步') nu++;
        if (nu) kept.push(gu);
      }
      groups = kept;
    }
    var repoSet = {}, last30 = 0, unsyncN = 0, archN = 0, cutoff = Date.now() - 30 * 86400000;
    for (var i = 0; i < S.gh.length; i++) {
      var r = S.gh[i];
      if (txt(r[F.g.repo])) repoSet[txt(r[F.g.repo])] = 1;
      if (txt(r[F.g.result]) === '未同步') unsyncN++;
      var t = toTime(normDate(r[F.g.time]));
      if (t && t >= cutoff) last30++;
    }
    for (var a = 0; a < groups.length; a++) if (groups[a].archived) archN++;
    function gkpi(cls, k, num, lab) {
      return '<button class="kpi ' + cls + (k === 'unsync' && S.ghFilter.unsync ? ' on' : '') + '" data-gk="' + k + '" title="' + lab + '">' +
        '<span class="num">' + num + '</span><span class="lab">' + lab + '</span>' +
        '<' + '/button>';
    }
    $('ghKpis').innerHTML =
      gkpi('', '', Object.keys(repoSet).length, '仓库') +
      gkpi('', '', last30, '近30天版本') +
      gkpi('warn', 'unsync', unsyncN, '未同步') +
      gkpi('', '', archN, '已归档');
    renderGhIntensity();

    var mSel = $('ghF_machine');
    if (mSel) {
      var html = '<option value="">全部</option>';
      for (var k = 0; k < S.machines.length; k++) {
        var mn = txt(S.machines[k][F.m.name]);
        html += '<option value="' + escapeHtml(mn) + '">' + escapeHtml(mn) + '<' + '/option>';
      }
      mSel.innerHTML = html;
      mSel.value = S.ghFilter.machine;
    }

    var host = $('ghList');
    if (!groups.length) {
      // 空态要说清是哪个筛选造成的，并给出清除入口（与任务看板同一原则）
      var ghFilters = [];
      if (S.ghFilter.machine) ghFilters.push('电脑 ' + S.ghFilter.machine);
      if (S.ghFilter.unsync) ghFilters.push('未同步');
      host.innerHTML = ghFilters.length
        ? '<div class="col-empty">当前筛选：' + ghFilters.join(' + ') + '<br>没有匹配的仓库<br>' +
          '<button class="mini" data-clear-gh-filter="1">清除筛选</button></div>'
        : '<div class="col-empty">' + (S.gh.length ? '没有匹配的仓库' : '还没有同步记录，点右上角「＋ 新增 → 记录一次同步」记一笔。') + '</div>';
      return;
    }
    if (!host) return;
    if (!groups.length) {
      host.innerHTML = '<div class="col-empty">' + (S.gh.length ? '无匹配筛选' : '还没有同步记录，点右上角「＋ 新增 → 记录一次同步」记一笔。') + '<' + '/div>';
      setBind(host, DB_GITHUB);
      return;
    }
    var out = '';
    for (var j = 0; j < groups.length; j++) out += repoCardHTML(groups[j]);
    host.innerHTML = out;
    setBind(host, DB_GITHUB);
  }

  function findGh(id) {
    for (var i = 0; i < S.gh.length; i++) if (ghRecId(S.gh[i]) === id) return S.gh[i];
    return null;
  }

  // 渲染同步记录表单（新增或编辑）。纯渲染，不改导航状态 —— 返回上一层时能原样重建。
  function renderGhForm(id, presetRepo) {
    var rec = id ? findGh(id) : null;
    var d;
    if (rec) {
      d = {
        time: normDate(rec[F.g.time]),
        machine: txt(rec[F.g.machine]),
        account: txt(rec[F.g.account]),
        repo: txt(rec[F.g.repo]),
        content: txt(rec[F.g.content]),
        versions: txt(rec[F.g.versions]),
        result: txt(rec[F.g.result]),
        archived: !!rec[F.g.archived]
      };
    } else {
      d = { time: new Date().toISOString(), machine: (S.machines[0] ? txt(S.machines[0][F.m.name]) : ''), account: '', repo: presetRepo || '', content: '', versions: '', result: '已同步', archived: false };
    }

    $('drawerTitle').textContent = id ? '同步记录详情' : '记录同步';
    setSheetFoot({ save: true, edit: false, copy: false, repoAdd: false, repoCopy: false, del: !!id });

    var mOpts = '<option value="">—</option>';
    for (var k = 0; k < S.machines.length; k++) {
      var mn = txt(S.machines[k][F.m.name]);
      mOpts += '<option value="' + escapeHtml(mn) + '"' + (mn === d.machine ? ' selected' : '') + '>' + escapeHtml(mn) + '<' + '/option>';
    }
    var repoOpts = '', seenRepo = {};
    for (var ri = 0; ri < S.gh.length; ri++) {
      var rn = txt(S.gh[ri][F.g.repo]);
      if (rn && !seenRepo[rn]) { seenRepo[rn] = 1; repoOpts += '<option value="' + escapeHtml(rn) + '">'; }
    }
    // 老记录的「是否同步」若已不在选项集里，补进去，否则下拉会默认选中第一项，保存时把原值悄悄改掉
    var resOpts = S.opts.ghResult.length ? S.opts.ghResult.slice(0) : ['已同步', '未同步'];
    if (d.result && resOpts.indexOf(d.result) < 0) resOpts.unshift(d.result);

    $('drawerBody').innerHTML =
      '<div class="field"><label>同步时间</label><input id="gf_time" type="datetime-local" value="' + toLocalInput(d.time) + '"></div>' +
      '<div class="row2">' +
        '<div class="field"><label>电脑</label><select id="gf_machine">' + mOpts + '<' + '/select></div>' +

  function collectGhProps() {
    if (!$('gf_repo')) return null;
    var timeVal = ($('gf_time') && $('gf_time').value) ? new Date($('gf_time').value).toISOString() : new Date().toISOString();
    function clean(v) { return (v || '').replace(/^\s+|\s+$/g, ''); }
    var p = {};
    p[F.g.time] = { date: timeVal };
    p[F.g.machine] = { text: clean($('gf_machine') ? $('gf_machine').value : '') };
    p[F.g.account] = { text: clean($('gf_account') ? $('gf_account').value : '') };
    p[F.g.repo] = { text: clean($('gf_repo') ? $('gf_repo').value : '') };
    p[F.g.content] = { text: clean($('gf_content') ? $('gf_content').value : '') };
    p[F.g.versions] = { text: clean($('gf_versions') ? $('gf_versions').value : '') };
    p[F.g.result] = { select: ($('gf_result') && $('gf_result').value) ? $('gf_result').value : '' };
    p[F.g.archived] = { checkbox: !!( $('gf_arch') && $('gf_arch').checked ) };
    return p;
  }

  function saveGh() {
    if (!db) return;
    var props = collectGhProps();
    if (!props) { toast('表单没准备好，请重新打开'); return; }
    var id = S.sheet.id;   // 当前层就是这条记录
    $('saveBtn').disabled = true;
    var p;
    if (id) p = db.updateRecord({ databaseId: DB_GITHUB, recordId: id, properties: props });
    else p = db.addRecord({ databaseId: DB_GITHUB, properties: props });
    p.then(function (rr) {
      var newId = id || (rr && (rr.id || rr._id));
      if (!id) {
        var rec = { _id: newId };
        for (var key in props) if (props.hasOwnProperty(key)) rec[key] = props[key][Object.keys(props[key])[0]];
        S.gh.unshift(rec);
      } else {
        var t = findGh(newId);
        if (t) for (var k2 in props) if (props.hasOwnProperty(k2)) t[k2] = props[k2][Object.keys(props[k2])[0]];
      }
      $('saveBtn').disabled = false;
      // 保存后：若有上一层就退回上一层（用户能看到刚改的那条），否则关闭整个弹窗
      if (S.sheetStack.length) { backSheet(); } else { closeDrawer(); }
      renderGithub();
      toast(id ? '已保存' : '已记录');
    }).catch(function (e) {
      console.error('[workbench] GitHub 记录保存失败', e);
      $('saveBtn').disabled = false;
      toast('保存失败，请稍后重试');
    });
  }

  function delGh(id) {
    if (!id) return;
    var rec = findGh(id);
    showConfirm('删除同步记录', '「' + (rec ? (txt(rec[F.g.repo]) || txt(rec[F.g.content]) || '这条记录') : '') + '」删除后无法恢复。', function () {
      db.deleteRecord({ databaseId: DB_GITHUB, recordId: id }).then(function () {
        var arr = [];
        for (var i = 0; i < S.gh.length; i++) if (ghRecId(S.gh[i]) !== id) arr.push(S.gh[i]);
        S.gh = arr;
        // 删除后：若有上一层就退回上一层（列表里那条已消失），否则关闭弹窗
        if (S.sheetStack.length) { backSheet(); } else { closeDrawer(); }
        renderGithub();
        toast('已删除');
      }).catch(function (e) {
        console.error('[workbench] 删除失败', e);
        toast('删除失败');
      });
    });
  }

  // 依据：Oracle Manage Object「View Object: 只读展示 / Edit Object: 进入可编辑态」；

      for (var i = 0; i < todos.length; i++) {

  // 直接进编辑态（卡片「编辑」按钮 / 详情弹窗里的「编辑」都走它）
  // 渲染任务表单（新建 / 编辑）。返回 false 表示这条任务已不存在，调用方负责回退。
  function openTaskEditor(id) {
    var t = id ? findTask(id) : null;
    if (id && !t) return false;
    if (!id) {
      // 新建任务：带出上次的草稿，省得重填

      t[F.t.machine] = S.machines[0] ? txt(S.machines[0][F.m.name]) : '';
      var draft = loadDraft();
      if (draft) {
        t[F.t.title] = draft.title || '';
        t[F.t.prio] = draft.prio || t[F.t.prio];
        t[F.t.machine] = draft.machine || t[F.t.machine];
        t[F.t.dir] = draft.dir || '';
        t[F.t.progress] = draft.progress || '';
        t[F.t.todos] = draft.todos || '';

  // 渲染任务表单（编辑态）。从详情态切进来时复用，所以不碰弹窗的形态 class。

      mOpts = '<option value="' + escapeHtml(curMachine) + '" selected>' +
        (curMachine ? escapeHtml(curMachine) + '（未登记）' : '— 未指定 —') + '<' + '/option>' + mOpts;
    }
      var todoText = txt(d[F.t.todos]);
      // 抽屉里的可点勾选清单：卡面瘦身之后，勾待办移到这里（点一下直接写库）

      var checklist = '';
      if (stList.length) {

            '<span class="box' + (stList[ti].done ? ' on' : '') + '">✓</span>' +

        '<div class="field"><label>状态</label><select id="f_status">' + optionsHTML(S.opts.status.length ? S.opts.status : [ST_DOING, ST_DONE], txt(d[F.t.status])) + '</select></div>' +
        '<div class="field"><label>优先级</label><select id="f_priority">' + optionsHTML(S.opts.prio.length ? S.opts.prio : ['P0', 'P1', 'P2'], txt(d[F.t.prio])) + '</select></div>' +
      '<' + '/div>' +
      '<div class="field"><label>所在电脑</label><select id="f_machine">' + mOpts + '</select></div>' +
      '<div class="field"><label>工作目录</label><input id="f_dir" class="mono" value="' + escapeHtml(d[F.t.dir]) + '" placeholder="D:\\dev\\项目名"></div>' +
      '<div class="field"><label>当前进度</label><textarea id="f_progress">' + escapeHtml(d[F.t.progress]) + '</textarea></div>' +
      checklist +
      '<div class="field"><label>待办原文</label><textarea id="f_todos" placeholder="一行一条，已完成写 [x]">' + escapeHtml(todoText) + '<' + '/textarea>' +
        '<div class="hint">一行一条；已完成的行首写 [x]</div></div>' +
      '<div class="field"><label>交接内容</label><textarea id="f_handoff" style="min-height:92px">' + escapeHtml(d[F.t.handoff]) + '<' + '/textarea>' +
        '<div class="hint">复制交接时这段会一并给到 agent</div></div>';

    setBind($('drawerBody'), DATABASE_ID);

  /* ── 居中弹窗（sheet）：视图栈 ──────────────────────────────
     一个弹窗承载一条「视图路径」：仓库详情 → 某条记录的编辑表单。
     每层是一个完整的视图描述 {kind, id, repo}，压在 S.sheetStack 里；
     S.sheet 是当前层。返回时弹出上一层并重新渲染它 —— 因为每层都能被
     纯渲染函数重建，所以「返回」不需要重新查数据源，也不会丢失上下文。

     三种进入方式，语义清晰、不需要守卫：
       push   —— 从当前视图钻取到下一层（保留上一层，可返回）
       root   —— 从看板直接进入，清空栈（顶层，无上一层可返回）

     标题栏的返回箭头只在栈非空时出现。 */
  function openSheet() {
    $('mask').classList.add('on');
    $('drawer').classList.add('on');
  }

  // 渲染一层视图。返回 false 表示这一层已失效（记录被删等），调用方负责回退。
  // 入口就设好 S.sheet，这样「打开」与「返回」走的是同一条路径，状态不会漂。
  // 当前操作对象一律从 S.sheet.id 推导，不再另存 editing / ghEditing ——
  // 同一个事实只存一份，否则迟早出现「两个地方记的不是同一件事」。
  function renderSheetLayer(layer) {
    S.sheet = layer;
    // 日历热力图一年 53 周 + 大格子（可显示数字），需要超宽面板；其余层恢复标准宽
    $('drawer').classList.toggle('xl', layer.kind === 'intensity');
    if (layer.kind === 'taskDetail') {
      var t = findTask(layer.id);
      if (!t) return false;
      $('drawerTitle').textContent = '任务详情';
      setSheetFoot({ save: false, edit: true, copy: true, repoAdd: false, repoCopy: false, del: true });
      return renderTaskDetail(t);
    }
    if (layer.kind === 'taskForm') {
      // 表单层的标题/底栏由 openTaskEditor 负责（它还要处理草稿）
      return openTaskEditor(layer.id);
    }
    if (layer.kind === 'ghForm') {
      return renderGhForm(layer.id, layer.repo);
    }
    if (layer.kind === 'repoDetail') {
      return renderRepoDetail(layer.repo);
    }
    if (layer.kind === 'intensity') {
      return renderIntensitySheet();
    }
    return false;
  }

  // 进入一层视图。mode: 'push' 保留上一层 | 'root' 清空栈。
  function gotoSheet(layer, mode) {
    if (mode === 'push') S.sheetStack.push(S.sheet);
    else S.sheetStack = [];
    if (!renderSheetLayer(layer)) {
      // 这一层渲染不出来（数据没了）→ 回退到上一层；再不行就关闭
      if (S.sheetStack.length) { backSheet(); } else { closeDrawer(); }
      return;
    }
    syncSheetNav();
    openSheet();
  }

  // 返回上一层
  function backSheet() {
    if (!S.sheetStack.length) { closeDrawer(); return; }
    var prev = S.sheetStack.pop();
    if (!renderSheetLayer(prev)) {
      // 上一层也失效了 → 继续往上退
      backSheet();
      return;
    }
    syncSheetNav();
    openSheet();
  }

  // 返回箭头的显隐由「栈里还有没有上一层」唯一决定
  function syncSheetNav() {
    $('drawerBack').style.display = S.sheetStack.length ? '' : 'none';
  }

  function closeDrawer() {
    $('mask').classList.remove('on');
    $('drawer').classList.remove('on');
    $('drawer').classList.remove('wide');
    $('drawer').classList.remove('xl'); // 日历弹窗的加宽修饰一并还原
    S.sheet = { kind: '', id: null, repo: '' };
    S.sheetStack = [];
    syncSheetNav();
    setSheetFoot({ save: false, edit: false, copy: false, repoAdd: false, repoCopy: false, del: false });
  }
  // 底栏按钮一次性按当前面板设定，避免各处零散地改 style.display
  function setSheetFoot(f) {
    $('saveBtn').style.display = f.save ? '' : 'none';
    $('editBtn').style.display = f.edit ? '' : 'none';
    $('copyBtn').style.display = f.copy ? '' : 'none';
    $('repoAddBtn').style.display = f.repoAdd ? '' : 'none';
    $('repoCopyBtn').style.display = f.repoCopy ? '' : 'none';
    $('delBtn').style.display = f.del ? '' : 'none';
  }

  // 唯一的提交入口：按弹窗类型分流，不再用「记录 id 是否为 null」当判据（P-02/P-03）
  function submitDrawer() {
    if (S.sheet.kind === 'ghForm') { saveGh(); return; }
    if (S.sheet.kind === 'taskForm') { saveTask(); return; }
  }

  var DRAFT_KEY = 'awb.taskdraft';
  var draftTimer = null;

  function readForm() {
    return {
      title: $('f_title') ? $('f_title').value : '',
      status: $('f_status') ? $('f_status').value : ST_DOING,
      prio: $('f_priority') ? $('f_priority').value : 'P1',
      machine: $('f_machine') ? $('f_machine').value : '',
      dir: $('f_dir') ? $('f_dir').value : '',
      progress: $('f_progress') ? $('f_progress').value : '',
      todos: $('f_todos') ? $('f_todos').value : '',
      handoff: $('f_handoff') ? $('f_handoff').value : ''
    };
  }
  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(readForm())); } catch (e) {}
  }
  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  }
  function loadDraft() {
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function collectProps() {
    if (!$('f_title') || !$('f_machine')) return null;
    var p = {};
    p[F.t.title] = { text: $('f_title').value.replace(/^\s+|\s+$/g, '') };
    p[F.t.status] = { select: $('f_status').value };
    p[F.t.prio] = { select: $('f_priority').value };
    p[F.t.machine] = { text: $('f_machine').value };
    p[F.t.dir] = { text: $('f_dir').value.replace(/^\s+|\s+$/g, '') };
    p[F.t.progress] = { text: $('f_progress').value.replace(/^\s+|\s+$/g, '') };
    p[F.t.todos] = { text: $('f_todos').value };
    p[F.t.handoff] = { text: $('f_handoff').value.replace(/^\s+|\s+$/g, '') };
    p[F.t.updated] = { date: new Date().toISOString() };
    return p;
  }

  function saveTask() {
    if (!db) return;
    var props = collectProps();
    if (!props) { toast('表单没准备好，请重新打开'); return; }
    var id = S.sheet.id;   // 当前层就是这条任务
    if (!props[F.t.title].text) { toast('任务标题不能为空'); return; }
    if (id) {
      var rec0 = findTask(id);
      if (rec0) {
        props = stripUnchanged(props, rec0);
        var realKeys = 0;
        for (var dk in props) if (props.hasOwnProperty(dk) && dk !== F.t.updated) realKeys++;
        if (!realKeys) { closeDrawer(); toast('没有改动'); return; }
      }
    }
    $('saveBtn').disabled = true;
    var p;
    if (id) {
      p = db.updateRecord({ databaseId: DATABASE_ID, recordId: id, properties: props });
    } else {
      p = db.addRecord({ databaseId: DATABASE_ID, properties: props });
    }
    p.then(function (r) {
      var newId = id || (r && (r.id || r._id));
      var found = null;
      for (var i = 0; i < S.tasks.length; i++) {
        if (S.tasks[i]._id === newId) { found = S.tasks[i]; break; }
      }
      if (found) applyProps(found, props);
      else if (!id && newId) S.tasks.unshift(applyProps({ _id: newId }, props));
      if (!id) clearDraft();
      $('saveBtn').disabled = false;
      // 保存后：若有上一层就退回上一层（用户能看到刚改的内容），否则关闭整个弹窗
      if (S.sheetStack.length) { backSheet(); } else { closeDrawer(); }
      render();

  function propValue(v) {
    v = v || {};
    if (v.text != null) return v.text;
    if (v.select != null) return v.select;
    if (v.date != null) return v.date;
    if (v.number != null) return v.number;
    if (v.checkbox != null) return v.checkbox;
    return '';
  }

  // 把 properties 增量合并进本地记录。不重建对象，避免丢掉这次没提交的字段（如「排序」）
  function applyProps(rec, props) {
    for (var k in props) {
      if (props.hasOwnProperty(k)) rec[k] = propValue(props[k]);
    }
    return rec;
  }

  // 编辑已有任务时只提交真正变了的字段，两台机器各改各的不会互相覆盖（P-10）
  function stripUnchanged(props, rec) {
    var out = {};
    for (var k in props) {
      if (!props.hasOwnProperty(k)) continue;
      if (k === F.t.updated) { out[k] = props[k]; continue; }
      if (txt(rec[k]) !== txt(propValue(props[k]))) out[k] = props[k];
    }
    return out;
  }

  function toggleTodo(id, lineNo) {
    var t = findTask(id);
    if (!t) return;
    var lines = txt(t[F.t.todos]).split('\n');
    if (lineNo < 0 || lineNo >= lines.length) return;
    var raw = lines[lineNo];
    var m = raw.match(/^(\s*)\[(x|X|\s*)\]\s*(.*)$/);
    if (m) {
      var wasDone = /x/i.test(m[2]);
      lines[lineNo] = m[1] + (wasDone ? '[ ] ' : '[x] ') + m[3];
    } else if (raw.replace(/^\s+|\s+$/g, '')) {
      // 没有勾选框前缀的自由行：补一个已完成标记，保留原缩进
      lines[lineNo] = raw.match(/^\s*/)[0] + '[x] ' + raw.replace(/^\s+|\s+$/g, '');
    } else {
      return;
    }
    var txtNew = lines.join('\n');
    var props = {};
    props[F.t.todos] = { text: txtNew };
    props[F.t.updated] = { date: new Date().toISOString() };
    t[F.t.todos] = txtNew;
    t[F.t.updated] = props[F.t.updated].date;
    render();
    db.updateRecord({ databaseId: DATABASE_ID, recordId: id, properties: props }).catch(function (e) {
      console.error('[workbench] 待办更新失败', e);
      toast('更新失败，正在回滚');

        S.tasks = ts;

  }

  function startEdit(el) {
    if (!el || el.tagName === 'INPUT') return;
    var kind = el.getAttribute('data-edit');
    var id = el.getAttribute('data-id');
    var raw = el.textContent;
    var oldVal = (raw === '＋位置') ? '' : raw;

    var input = document.createElement('input');
    input.className = 'inline-input';
    input.value = oldVal;
    if (kind === 'machineName') input.style.width = Math.max(96, el.offsetWidth + 26) + 'px';
    else if (kind === 'machinePlace') input.style.width = Math.max(58, el.offsetWidth + 18) + 'px';
    else input.style.width = '100%';

    el.style.display = 'none';
    el.parentNode.insertBefore(input, el.nextSibling);
    input.focus();
    input.select();

    var settled = false;
    function restore(val) {
      if (settled) return;
      settled = true;
      if (input.parentNode) input.parentNode.removeChild(input);
      el.style.display = '';
      if (val != null) el.textContent = val;
    }
    function commit() {
      if (settled) return;
      var v = input.value.replace(/^\s+|\s+$/g, '');
      restore(v || oldVal);
      if (!v || v === oldVal) return;
      if (kind === 'machineName') renameMachine(id, v);
      else if (kind === 'machinePlace') { updateMachineFields(id, { place: v }); toast('位置已更新'); }
      else if (kind === 'taskTitle') updateTaskFields(id, { title: v });
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); restore(oldVal); }
    });
    input.addEventListener('blur', commit);
    input.addEventListener('click', function (e) { e.stopPropagation(); });
  }

  function batchUpdateTasks(ids, props) {
    if (!ids.length) return;
    var now = new Date().toISOString();
    Promise.all(ids.map(function (id) {
      var t = findTask(id);
      if (!t) return null;
      for (var k in props) if (props.hasOwnProperty(k)) t[k] = props[k][Object.keys(props[k])[0]];
      t[F.t.updated] = now;
      var p = JSON.parse(JSON.stringify(props));
      p[F.t.updated] = { date: now };
      return db.updateRecord({ databaseId: DATABASE_ID, recordId: id, properties: p }).catch(function (e) {
        console.error('[workbench] 批量更新失败', id, e);
        return null;
      });
    })).then(function () {
      toast('已更新 ' + ids.length + ' 个任务');
      selTasks = {};
      render();
    });
  }
  function batchDeleteTasks(ids) {
    Promise.all(ids.map(function (id) {
      return db.deleteRecord({ databaseId: DATABASE_ID, recordId: id }).catch(function (e) { console.error('[workbench] 批量删除失败', id, e); return null; });

  function updateMachineFields(id, patch) {
    var m = findMachine(id);
    if (!m) return Promise.resolve();
    var props = {};
    if (patch.name != null) props[F.m.name] = { text: patch.name };
    if (patch.place != null) props[F.m.place] = { text: patch.place };
    if (patch.order != null) props[F.m.order] = { number: patch.order };
    if (patch.name != null) m[F.m.name] = patch.name;
    if (patch.place != null) m[F.m.place] = patch.place;
    if (patch.order != null) m[F.m.order] = patch.order;
    render();
    return db.updateRecord({ databaseId: DB_MACHINE, recordId: id, properties: props })
      .catch(function (e) {
        console.error('[workbench] 机器更新失败', e);
        toast('更新失败');
        loadMachines(function (ms) { S.machines = ms; render(); });
      });
  }

  function renameMachine(id, newName) {
    var m = findMachine(id);
    if (!m) return;
    var old = txt(m[F.m.name]);
    var affected = [];
    for (var i = 0; i < S.tasks.length; i++) {
      if (txt(S.tasks[i][F.t.machine]) === old) affected.push(S.tasks[i]);
    }
    // 先在内存里把任务改到新名字。否则 updateMachineFields 内部的 render() 会
    // 因为机器名已改、任务的「所在电脑」还是旧名而匹配不上，导致整列任务从看板消失（P-01）
    for (var k = 0; k < affected.length; k++) affected[k][F.t.machine] = newName;

    updateMachineFields(id, { name: newName }).then(function () {
      if (!affected.length) { toast('已重命名'); return; }
      var idx = 0, failed = 0;
      function next() {
        if (idx >= affected.length) {
          if (failed) {
            toast('已重命名，' + failed + ' 个任务同步失败，正在重新拉取');
            loadTasks(function (ts) { S.tasks = ts; render(); });
          } else {
            toast('已重命名，同步更新 ' + affected.length + ' 个任务');
          }
          return;
        }
        var t = affected[idx++];
        var props = {};
        props[F.t.machine] = { text: newName };
        db.updateRecord({ databaseId: DATABASE_ID, recordId: t._id, properties: props })
          .catch(function (e) { failed++; console.error('[workbench] 任务机器同步失败', e); })
          .then(next);
      }
      next();
    });
  }

  function moveMachine(id, dir) {
    var arr = sortedMachines();
    var pos = -1;
    for (var i = 0; i < arr.length; i++) if (arr[i]._id === id) pos = i;
    if (pos < 0) return;
    var target = pos + dir;
    if (target < 0 || target >= arr.length) { toast('已经到边上了'); return; }
    var a = arr[pos], b = arr[target];
    var oa = (typeof a[F.m.order] === 'number') ? a[F.m.order] : pos + 1;
    var ob = (typeof b[F.m.order] === 'number') ? b[F.m.order] : target + 1;
    a[F.m.order] = ob;
    b[F.m.order] = oa;
    render();
    var p1 = db.updateRecord({ databaseId: DB_MACHINE, recordId: a._id, properties: { '排序': { number: ob } } });
    var p2 = db.updateRecord({ databaseId: DB_MACHINE, recordId: b._id, properties: { '排序': { number: oa } } });
    Promise.all([p1, p2]).catch(function (e) {
      console.error('[workbench] 排序保存失败', e);
      toast('顺序保存失败');
      loadMachines(function (ms) { S.machines = ms; render(); });
    });
  }

  function doMachineAction(act, id) {
    var m = findMachine(id);
    if (!m) return;
    if (act === 'rename') { editMachineInline(id, 'name'); return; }
    if (act === 'place') { editMachineInline(id, 'place'); return; }
    if (act === 'left' || act === 'right') { moveMachine(id, act === 'left' ? -1 : 1); return; }
    if (act === 'delete') {
      var used = 0;
      for (var i = 0; i < S.tasks.length; i++) if (txt(S.tasks[i][F.t.machine]) === txt(m[F.m.name])) used++;
      // 有任务也允许删：任务不会丢，会落到「未识别电脑」兜底列（v12 起的孤儿列机制）
      var msg = used
        ? '「' + txt(m[F.m.name]) + '」下还有 ' + used + ' 个任务。删除电脑后，这些任务会移到「未识别电脑」列，任务本身不会被删除。'
        : '「' + txt(m[F.m.name]) + '」会从看板移除，该电脑下没有任务。';
      showConfirm('删除电脑', msg, function () { doDeleteMachine(id); });
    }
  }
  function doDeleteMachine(id) {
    db.deleteRecord({ databaseId: DB_MACHINE, recordId: id }).then(function () {
      var arr = [];
      var removedName = '';
      for (var i = 0; i < S.machines.length; i++) {
        if (S.machines[i]._id === id) removedName = txt(S.machines[i][F.m.name]);
        else arr.push(S.machines[i]);
      }
      S.machines = arr;
      // 删电脑时同步清理指向它的 GitHub 筛选 ——
      // 否则筛选会指向一台不存在的电脑，渲染时只能靠兜底复位来收拾（那是补丁）。
      if (removedName && S.ghFilter.machine === removedName) S.ghFilter.machine = '';
      render();
      toast('已删除电脑');
    }).catch(function (e) {
      console.error('[workbench] 删除机器失败', e);
      toast('删除失败');
    });
  }

  function addMachine(name, place) {
    name = (name || '').replace(/^\s+|\s+$/g, '');
    if (!name) { toast('名称不能为空'); return; }
    for (var i = 0; i < S.machines.length; i++) {
      if (txt(S.machines[i][F.m.name]) === name) { toast('已经有同名电脑了'); return; }
    }
    place = (place || '').replace(/^\s+|\s+$/g, '');
    var maxOrder = 0;
    for (var j = 0; j < S.machines.length; j++) {
      var o = S.machines[j][F.m.order];
      if (typeof o === 'number' && o > maxOrder) maxOrder = o;
    }
    var props = {};
    props[F.m.name] = { text: name };
    props[F.m.place] = { text: place };
    props[F.m.order] = { number: maxOrder + 1 };
    db.addRecord({ databaseId: DB_MACHINE, properties: props }).then(function (r) {
      var rec = { _id: (r && (r.id || r._id)) };
      rec[F.m.name] = name;
      rec[F.m.place] = place;
      rec[F.m.order] = maxOrder + 1;
      S.machines.push(rec);
      render();
      toast('已添加 ' + name);
    }).catch(function (e) {
      console.error('[workbench] 添加电脑失败', e);
      toast('添加失败');
    });
  }

  function buildHandoff(t) {
    var m = null;
    for (var i = 0; i < S.machines.length; i++) {
      if (txt(S.machines[i][F.m.name]) === txt(t[F.t.machine])) { m = S.machines[i]; break; }
    }
    var wb = m ? (txt(m[F.m.wb]) || '未登录') : '—';
    var trae = m ? (txt(m[F.m.trae]) || '未登录') : '—';
    var pend = [];
    var list = parseTodos(t[F.t.todos]);
    for (var j = 0; j < list.length; j++) if (!list[j].done) pend.push(list[j].text);
    var lines = [];
    lines.push('接下来继续这个任务：' + txt(t[F.t.title]));
    lines.push('');
    lines.push('【工作目录】' + (txt(t[F.t.dir]) || '（未填）'));
    lines.push('【所在电脑】' + (txt(t[F.t.machine]) || '未指定'));
    lines.push('【登录账号】WorkBuddy: ' + wb + ' / TRAE: ' + trae);
    lines.push('');
    lines.push('【当前进度】');
    lines.push(txt(t[F.t.progress]) || '（未填）');
    lines.push('');
    if (pend.length) {
      lines.push('【未完成待办】');
      for (var k = 0; k < pend.length; k++) lines.push('- [ ] ' + pend[k]);
      lines.push('');
    }
    lines.push('【从哪里接着做】');
    lines.push(txt(t[F.t.handoff]) || '（未填）');
    return lines.join('\n');
  }

      if (i >= cols.length) { toast('列顺序已保存'); return; }

      i++;

        .catch(function (e) { console.error('[workbench] 列顺序保存失败', e); })
        .then(next);
    }
    next();

  function bindDrag() {
    var board = $('board');

    board.addEventListener('dragstart', function (e) {
      var handle = e.target.closest ? e.target.closest('.drag-handle') : null;
      if (handle) {
        var col = handle.closest('.col');
        if (!col) return;
        dragCol = col;
        dragMoved = false;
        col.classList.add('dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', 'col');
        }
        return;
      }
      var card = e.target.closest ? e.target.closest('.card') : null;
      if (card) {
        dragCard = card;
        dragMoved = false;
        var fromCol = card.closest ? card.closest('.col') : null;
        dragFromMachineId = fromCol ? fromCol.getAttribute('data-machine-id') : null;
        card.classList.add('dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', 'card');
        }
      }
    });

    board.addEventListener('dragover', function (e) {
      if (dragCard) {
        var body = e.target.closest ? e.target.closest('.col-body') : null;
        if (!body) return;
        var destCol = body.closest ? body.closest('.col') : null;
        // 兜底列不是真实电脑，不能作为投放目标
        if (!destCol || destCol.classList.contains('col-orphan')) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        var over = e.target.closest('.card');
        if (!over) {
          if (body !== dragCard.parentNode) {
            var ph = body.querySelector('.col-empty');
            if (ph) body.insertBefore(dragCard, ph); else body.appendChild(dragCard);
            dragMoved = true;
          }
          return;
        }
        if (over === dragCard) return;
        var rect = over.getBoundingClientRect();
        var after = (e.clientY - rect.top) > rect.height / 2;
        if (after) body.insertBefore(dragCard, over.nextSibling);
        else body.insertBefore(dragCard, over);
        dragMoved = true;
        return;
      }
      if (dragCol) {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        var target = e.target.closest ? e.target.closest('.col') : null;
        if (!target || target === dragCol || target.classList.contains('col-orphan')) return;
        var r = target.getBoundingClientRect();
        // 列宽自适应后，列可能并排（同一行）也可能换行（多行）。
        // 与被拖列同一行 → 按 clientX 判断左右；不同行 → 按 clientY 判断上下。
        var dr = dragCol.getBoundingClientRect();
        var sameRow = Math.abs(dr.top - r.top) < dr.height / 2;
        var after = sameRow
          ? ((e.clientX - r.left) > r.width / 2)
          : ((e.clientY - r.top) > r.height / 2);
        board.insertBefore(dragCol, after ? target.nextSibling : target);
        dragMoved = true;
      }
    });

    board.addEventListener('drop', function (e) { e.preventDefault(); });

    board.addEventListener('dragend', function () {
      if (dragCard) {
        var body2 = dragCard.parentNode;
        var cardEl = dragCard;
        dragCard.classList.remove('dragging');
        dragCard = null;
        if (dragMoved && body2) {
          var toCol = body2.closest ? body2.closest('.col') : null;
          var toId = toCol ? toCol.getAttribute('data-machine-id') : null;
          var crossed = !!(toId && dragFromMachineId && toId !== dragFromMachineId);
          if (crossed) dropCardIntoColumn(cardEl, toId);
          if (!S.q) persistCardOrder(body2);
          else toast('搜索状态下只移动电脑，不保存卡片顺序');
        }
        dragFromMachineId = null;
      }
      if (dragCol) {
        dragCol.classList.remove('dragging');
        dragCol = null;
        if (dragMoved) persistColumnOrder();
      }
      if (dragMoved) {
        justDragged = true;
        setTimeout(function () { justDragged = false; }, 120);
      }
    });
  }

  (function bindHeatTip() {
    var tip = null;
    function hide() {
      if (tip) { tip.style.display = 'none'; }
    }
    function show(cell) {
      if (!tip) {
        tip = document.createElement('div');
        tip.className = 'hm-tip';
        tip.style.display = 'none';
        document.body.appendChild(tip);
      }
      var day = cell.getAttribute('data-hm-day');
      var n = parseInt(cell.getAttribute('data-hm-n'), 10) || 0;
      tip.innerHTML = '<b>' + day + '</b>' + (n ? '更新 ' + n + ' 个仓库' : '无更新');
      var r = cell.getBoundingClientRect();
      tip.style.display = 'block';
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
      var y = r.top - th - 8;
      if (y < 8) y = r.bottom + 8;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function (e) {
      var c = e.target.closest ? e.target.closest('.hm[data-hm-day]') : null;
      if (c) { show(c); return; }
      hide();
    });
    window.addEventListener('scroll', hide, true);
  })();

  (function bindSplit() {
    var mainEl = document.querySelector('main');
    var boardEl = $('viewBoard');
    var divEl = $('splitDivider');
    if (!mainEl || !boardEl || !divEl) return;
    var KEY = 'awb.wbSplitPct'; // 左栏宽度百分比（30–75）
    function applyPct(p) {
      if (!p || isNaN(p)) return;
      p = Math.max(30, Math.min(75, p));
      boardEl.style.width = p + '%';
    }
    function savePct() {
      try {
        var mw = mainEl.getBoundingClientRect().width;
        if (mw > 0) localStorage.setItem(KEY, String(boardEl.getBoundingClientRect().width / mw * 100));
      } catch (err) {}
    }
    try {
      var saved = parseFloat(localStorage.getItem(KEY));
      if (!isNaN(saved)) applyPct(saved);
    } catch (err) {}

    var dragging = false;
    function pointX(ev) { return (ev.touches && ev.touches.length) ? ev.touches[0].clientX : ev.clientX; }
    function onMove(ev) {
      if (!dragging) return;
      var rect = mainEl.getBoundingClientRect();
      if (!rect.width) return;
      applyPct((pointX(ev) - rect.left) / rect.width * 100);
      if (ev.cancelable) ev.preventDefault();
    }
    function onUp() {
      if (!dragging) return;
      dragging = false;
      divEl.classList.remove('drag');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      paneMax = ''; // 手动拖过就退出放大态
      try { localStorage.setItem('awb.wbPaneMax', ''); } catch (err2) {}
      savePct();
    }
    function onDown(ev) {
      dragging = true;
      divEl.classList.add('drag');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';
      if (ev.cancelable) ev.preventDefault();
    }
    divEl.addEventListener('mousedown', onDown);
    divEl.addEventListener('touchstart', onDown, { passive: false });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);
  })();

  // 两个区域的折叠 / 展开（各自独立，可同时全收起或全展开）
  // ── 小标题点击：本栏放到最大（另一栏收到最小），再点还原 ──
  // 默认 GitHub 看板最大化（用户主视角：先看哪些仓库有未同步版本，再看任务）
  var paneMax = '';
  function applyPaneMax() {
    var boardEl = $('viewBoard');
    if (!boardEl) return;
    if (paneMax === 'board') boardEl.style.width = '75%';
    else if (paneMax === 'gh') boardEl.style.width = '30%';
    else {
      var saved = 58;
      try { saved = parseFloat(localStorage.getItem('awb.wbSplitPct')) || 58; } catch (err) {}
      boardEl.style.width = saved + '%';
    }
    var tb = $('tBoard'), tg = $('tGh');
    if (tb) tb.classList.toggle('on', paneMax === 'board');
    if (tg) tg.classList.toggle('on', paneMax === 'gh');
  }
  (function bindPaneMax() {
    var tb = $('tBoard'), tg = $('tGh');
    if (!tb || !tg) return;
    tb.addEventListener('click', function (e) {
      e.stopPropagation(); closeMenus();
      paneMax = (paneMax === 'board' ? '' : 'board'); applyPaneMax();
      try { localStorage.setItem('awb.wbPaneMax', paneMax); } catch (err) {}
    });
    tg.addEventListener('click', function (e) {
      e.stopPropagation(); closeMenus();
      paneMax = (paneMax === 'gh' ? '' : 'gh'); applyPaneMax();
      try { localStorage.setItem('awb.wbPaneMax', paneMax); } catch (err) {}
    });
    try {
      var saved = localStorage.getItem('awb.wbPaneMax');
      paneMax = (saved === 'board' || saved === 'gh') ? saved : 'gh'; // 默认 GitHub 看板最大化
    } catch (err) { paneMax = 'gh'; }
    applyPaneMax();
    // 窗口尺寸变化时重算列宽（容器宽度变了，列宽下限要跟着变）
  })();

  // ── 看板视图状态：单一入口 ──
  // 视图定义（VIEW 表）与取数规则（viewMatch）都在业务层，见上方注释。
  // 这里只负责：切换视图 + 同步分段按钮高亮 + 重渲染。
  //
  // 语义依据：
  //   ToggleGroup 规范「点一下换了同一空间里显示哪份数据 → Tabs Pill」
  //   Radii Filter Chips 规范：不能出现「看起来被选中、但实际没有过滤内容」
  // 唯一的视图状态修改入口。
  // v 一定是合法视图值 —— 所有调用点都经过 viewOfSeg / viewOfKpi 映射（返回字面量），
  // 所以这里不需要「非法值兜底」的守卫：查表查不到就是 bug，应当立刻暴露而不是被静默吞掉。
  function setView(v) {
    S.view = v;
    var segEl = $('segTabs');
    if (segEl) {
      var want = VIEW_SEG_OF[v];
      var bs = segEl.querySelectorAll('button');
      for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-s') === want);
    }
    renderSummary();
    renderBoard();
  }
  // 分段按钮 → 视图
  function viewOfSeg(segName) {
    if (segName === '全部') return 'all';
    if (segName === '已完成') return 'done';
    return 'doing';
  }
  // KPI 卡片 → 视图（点已激活的卡片回到默认视图，即取消该视图）
  function viewOfKpi(key) {
    if (key === 'done') return 'done';
    if (key === 'att') return 'att';
    if (key === 'todo') return 'todo';
    return 'doing';
  }

  (function bindSeg() {
    var seg = $('segTabs');
    if (!seg) return;
    seg.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      setView(viewOfSeg(b.getAttribute('data-s')));
    });
  })();

  // ── 左 KPI 条：与分段映射到同一组视图，保证两种入口行为一致 ──
  (function bindKpis() {
    var host = $('summary');
    if (!host) return;
    host.addEventListener('click', function (e) {
      var k = e.target.closest ? e.target.closest('.kpi') : null;
      if (!k) return;
      var key = k.getAttribute('data-k');
      var target = viewOfKpi(key);
      // 点当前已激活的卡片 → 回到默认视图（取消）
      setView(S.view === target ? 'doing' : target);
    });
  })();

  if (!db) {
    var ph = document.createElement('div');
    ph.className = 'col-empty';
    ph.style.padding = '48px 24px';
    ph.textContent = '连不上本地服务：请先在工具目录运行 node server.mjs，再刷新本页。';
    $('board').appendChild(ph);
    $('summary').innerHTML = '<span class="hint">未连接本地服务</span>';
    return;
  }

  bindDrag();

  loadAllData(function (err) {
    render();
    if (err) toast('部分数据加载失败，可刷新重试');
  });
})();
</script>
</body>
</html>
