<!DOCTYPE html>
<html data-theme="dark" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Agent 工作台</title>
<style>
  :root[data-theme="dark"] {
    /* 暖黑：默认主题。暗底 + 纸面 + 陶土主色，避免纯黑纯灰的「机房感」 */
    --bg: #191512;
    --panel: #221D19;
    --panel-2: #2A2420;
    --panel-3: #332B25;
    --border: rgba(255, 236, 214, .07);
    --border-strong: rgba(255, 236, 214, .14);
    --text: #F1E9DD;
    --text-2: #B5A695;
    --text-3: #807264;
    --accent: #E08362;
    --accent-soft: rgba(224, 131, 98, .14);
    --done: #8FB884;
    --done-soft: rgba(143, 184, 132, .14);
    --ok: #8FB884;
    --ok-soft: rgba(143, 184, 132, .14);
    --warn: #D9A451;
    --warn-soft: rgba(217, 164, 81, .14);
    --danger: #E07A72;
    --danger-soft: rgba(224, 122, 114, .14);
    --shadow: none; /* 装饰阴影一律去掉：大范围投影让页面发灰，只保留 0 模糊的焦点/选中描边 */
    /* 实心按钮：暖黑下用「亮底深字」，白字在 #E08362 上只有 2.6:1 */
    --btn-bg: #E08362;
    --btn-bg-hover: #EFA184;
    --btn-fg: #241A14;
    /* 弹窗（居中 sheet）配色：深色下是暖色磨砂玻璃 */
    --mask-bg: rgba(10, 8, 6, .55);
    --mask-bg-solid: rgba(10, 8, 6, .92);
    --sheet-bg: rgba(34, 29, 25, .94);
    --sheet-border: rgba(255, 236, 214, .09);
    --sheet-shadow: none; /* 弹窗也去掉大投影，靠遮罩与圆角分层 */
  }
  :root[data-theme="light"] {
    /* 暖白：奶油底 + 纸白面，读起来像纸不做成玻璃 */
    --bg: #F4EEE4;
    --panel: #FFFCF6;
    --panel-2: #F6EFE4;
    --panel-3: #EDE3D4;
    --border: rgba(120, 92, 62, .12);
    --border-strong: rgba(120, 92, 62, .22);
    --text: #2C2621;
    --text-2: #6E6357;
    --text-3: #9C8F80;
    --accent: #C0603F;
    --accent-soft: rgba(192, 96, 63, .10);
    --done: #5C7F58;
    --done-soft: rgba(92, 127, 88, .12);
    --ok: #5C7F58;
    --ok-soft: rgba(92, 127, 88, .12);
    --warn: #BE8A35;
    --warn-soft: rgba(190, 138, 53, .13);
    --danger: #AF4640;
    --danger-soft: rgba(175, 70, 64, .10);
    --shadow: none; /* 同暖黑：装饰阴影全部去掉 */
    /* 实心按钮：暖白下用深陶土底 + 白字 */
    --btn-bg: #C0603F;
    --btn-bg-hover: #A94E30;
    --btn-fg: #FFF8F2;
    /* 弹窗（居中 sheet）配色：浅色下是暖白磨砂玻璃 */
    --mask-bg: rgba(58, 44, 30, .34);
    --mask-bg-solid: rgba(58, 44, 30, .86);
    --sheet-bg: rgba(255, 252, 246, .94);
    --sheet-border: rgba(120, 92, 62, .10);
    --sheet-shadow: none;
  }
  /* ── 浮层动效令牌（与主题无关，全局一套）──
     苹果动效规范：spring 曲线用 cubic-bezier(0.32,0.72,0,1)，进场从容、退场利落。
     进出不对称靠「transition 定义在目标状态上」实现，不需要 JS 计时器。 */
  :root {
    --ease-spring: cubic-bezier(.32, .72, 0, 1);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --dur-in: 340ms;
    --dur-out: 200ms;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
  /* 滚动条适配主题：细、暗、hover 提亮；浅色模式走同一套变量 */
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-strong); border-radius: 6px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  /* 键盘焦点：只在键盘操作时显示环（鼠标点击不亮），不覆盖输入框自己的描边方案 */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card:focus-visible, .repo-card:focus-visible { outline-offset: 1px; }
  input, textarea, select { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .topbar {
    flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 22px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand h1 { font-size: 15px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
  .brand .ver {
    font-size: 10.5px; color: var(--text-3); background: var(--panel-3);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; line-height: 14px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .spacer { flex: 1; }
  .search {
    display: flex; align-items: center; gap: 7px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 9px; padding: 0 10px; height: 33px; width: 300px;
    transition: border-color .15s;
  }
  .search:focus-within { border-color: var(--border-strong); }
  .search input { background: none; border: none; outline: none; width: 100%; font-size: 12.5px; }
  .search input::placeholder { color: var(--text-3); }
  .icon-btn {
    width: 33px; height: 33px; display: grid; place-items: center; border-radius: 9px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text-2); transition: .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .ghost-btn {
    height: 33px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text-2); font-size: 12.5px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .ghost-btn .tick { color: var(--done); }
  .btn-primary {
    height: 33px; padding: 0 14px; border-radius: 9px; background: var(--accent);
    color: #fff; font-size: 12.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn-primary:hover { filter: brightness(1.08); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: row; padding: 0 16px 10px; }

  .summary {
    flex: none; display: block;
    padding: 2px 0 0; font-size: 11.5px; color: var(--text-3);
  }
  .check-line { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); cursor: pointer; padding: 7px 0; }
  .check-line input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

  /* ===== AI 写入指南 ===== */
  .ai-sec { margin-bottom: 18px; }
  .ai-sec h4 { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 7px; display: flex; align-items: center; gap: 7px; }
  .ai-sec h4 .dbid { font-size: 10px; color: var(--text-3); font-family: ui-monospace, Consolas, monospace; background: var(--panel-3); border-radius: 4px; padding: 1px 5px; }
  .ai-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .ai-table th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 10.5px; padding: 4px 7px; border-bottom: 1px solid var(--border); }
  .ai-table td { padding: 5px 7px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
  .ai-table td:first-child { color: var(--text); font-weight: 500; white-space: nowrap; }
  .ai-table td.req { color: var(--danger); text-align: center; }
  .ai-table td.opt { color: var(--text-3); text-align: center; }
  .ai-enum { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; color: var(--accent); }
  .ai-note { font-size: 11.5px; color: var(--text-2); line-height: 1.75; }
  .ai-note li { margin: 0 0 4px 16px; }
  .ai-pre {
    font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--text-2);
    background: var(--panel-3); border-radius: 8px; padding: 10px 12px; overflow-x: auto; line-height: 1.6; white-space: pre;
  }
  .ai-warn { color: var(--warn); }

  /* ===== 批量导入：长文本输入 + 解析预览 ===== */
  .imp-ta {
    width: 100%; min-height: 240px; resize: vertical; box-sizing: border-box;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.7;
    color: var(--text); background: var(--panel-3);
    border: 1px solid var(--border-strong); border-radius: 10px; padding: 11px 13px;
  }
  .imp-ta:focus { outline: none; border-color: var(--accent); }
  .imp-hint { font-size: 11.5px; color: var(--text-3); line-height: 1.7; }
  /* 预览清单：一行一条待写入的变更，左侧动作标签区分新建 / 更新 */
  .imp-list { display: flex; flex-direction: column; gap: 7px; }
  .imp-item {
    display: flex; align-items: flex-start; gap: 9px; padding: 9px 11px;
    border-radius: 9px; background: var(--panel-2); border: 1px solid var(--border);
  }
  .imp-item.bad { background: var(--warn-soft); border-color: var(--warn); }
  .imp-act {
    flex: none; font-size: 10px; line-height: 16px; padding: 0 6px; border-radius: 4px;
    background: var(--accent); color: var(--btn-fg); margin-top: 1px;
  }
  .imp-item.bad .imp-act { background: var(--warn); }
  .imp-main { min-width: 0; flex: 1; }
  .imp-title { font-size: 12.5px; color: var(--text); font-weight: 500; word-break: break-all; }
  .imp-sub { font-size: 11px; color: var(--text-3); margin-top: 3px; line-height: 1.6; }
  .imp-sum { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
  .imp-sum b { color: var(--text); }
  .imp-err { color: var(--warn); }

  .ai-pick { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 8px; }
  .ai-pick select {
    background: var(--panel-3); border: 1px solid var(--border-strong); border-radius: 8px;
    color: var(--text); font-size: 12.5px; padding: 6px 10px; min-width: 220px; outline: none; cursor: pointer;
  }
  .ai-pick select:focus { border-color: var(--accent); }
  .ai-pick-tip { font-size: 11px; color: var(--text-3); }

  /* ===== 管理模式：批量选择与批量操作 ===== */
  .ghost-btn.on { color: var(--accent); border-color: var(--accent); }
  .sel-box {
    position: absolute; top: 9px; left: 9px; width: 16px; height: 16px;
    border: 1.5px solid var(--border-strong); border-radius: 4px; background: var(--panel);
    display: none; place-items: center; font-size: 10px; line-height: 1; color: transparent; flex: none;
  }
  body.manage .sel-box { display: grid; }
  body.manage .card, body.manage .repo-entry { padding-left: 32px; }
  body.manage .repo-entry { position: relative; cursor: pointer; }
  body.manage .card { cursor: pointer; }
  body.manage .card .c-actions, body.manage .repo-entry .re-dots { display: none !important; }
  body.manage .card .c-title[data-edit] { cursor: pointer; }
  .card.sel, .repo-entry.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .repo-entry.sel { border-radius: 6px; }
  .card.sel .sel-box, .repo-entry.sel .sel-box { background: var(--accent); border-color: var(--accent); color: #fff; }
  .manage-bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 12px;
    padding: 8px 12px; z-index: 45; box-shadow: var(--shadow); max-width: 94vw;
  }
  .manage-bar .m-count { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .manage-bar .m-group { display: flex; gap: 6px; align-items: center; }
  .manage-bar .m-group + .m-group { border-left: 1px solid var(--border); padding-left: 10px; }
  .manage-bar button {
    font-size: 12px; padding: 5px 10px; border-radius: 7px;
    border: 1px solid var(--border-strong); color: var(--text-2); transition: .15s; white-space: nowrap;
  }
  .manage-bar button:hover { color: var(--text); border-color: var(--text-3); }
  .manage-bar button.danger { color: var(--danger); border-color: var(--danger-soft); }
  .manage-bar button.danger:hover { border-color: var(--danger); }
  .summary .hint { margin-left: auto; }

  .board {
    flex: 1; min-height: 0;
    /* 列宽自适应（与 GitHub 看板 .gh-list 同一套机制）：
       auto-fill + minmax(min(100%, 300px), 1fr) —— 宽度够就并排放更多列，
       放不下的自动换到下一行；min() 里的 100% 保证列永不超过容器宽度，
       因此永远不会出现横向滚动条。
       min(100%, 300px) 里 100% 在前很关键：写成 min(300px, 100%) 时
       auto-fit 会把每行算成 1 列（百分比基准不同）。 */
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 13px; overflow-x: hidden; overflow-y: auto; padding-bottom: 2px;
    align-content: start;
  }
  .col {
    display: flex; flex-direction: column; min-height: 0;
    /* grid/flex 子项默认 min-width:auto 会拒绝收缩到内容以下，导致列被内容撑破、
       重新出现横向滚动条。这里显式归零，让列宽完全由 grid 决定（MDN: min-width:0）。*/
    min-width: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  }
  .col.col-orphan { border-style: dashed; background: transparent; }
  .col-orphan .ch-name { color: var(--warn); cursor: default; }
  .col-orphan .ch-acc .orphan-hint { font-size: 10.5px; color: var(--text-3); line-height: 1.5; }
  .col-head {
    flex: none; padding: 12px 14px 11px; border-bottom: 1px solid var(--border); min-width: 0;
  }
  .ch-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .ch-name { font-size: 14px; font-weight: 600; letter-spacing: .1px; overflow-wrap: anywhere; }
  .ch-place { font-size: 9.5px; color: var(--text-3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .ch-count { margin-left: auto; font-size: 11px; color: var(--text-3); }
  .ch-count b { color: var(--text); font-weight: 600; font-size: 13px; }
  .ch-acc { display: flex; gap: 6px; flex-wrap: wrap; }
  .acc {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px;
    padding: 2px 8px 2px 6px; border-radius: 6px; background: var(--panel-2);
    border: 1px solid var(--border); transition: border-color .15s;
  }
  .acc:hover { border-color: var(--border-strong); }
  .acc .pf { font-size: 9px; color: var(--text-3); letter-spacing: .3px; }
  .acc .an { font-weight: 500; color: var(--text-2); }
  .acc.empty .an { color: var(--text-3); font-weight: 400; }
  .acc .led { width: 5px; height: 5px; border-radius: 50%; background: var(--done); }
  .acc.empty .led { background: var(--text-3); }

  .col-body {
    /* 每列独立纵向滚动（经典看板形态：列头固定，卡片区自己滚） */
    flex: 1; min-height: 0; overflow-y: auto; padding: 10px; min-width: 0;
    display: flex; flex-direction: column; gap: 9px;
  }
  .col-empty { padding: 26px 10px; text-align: center; font-size: 11.5px; color: var(--text-3); }

  .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 13px; transition: border-color .15s;
  }
  .card:hover { border-color: var(--border-strong); }
  .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 13px; transition: border-color .15s; position: relative;
    min-width: 0;
  }
  .card:hover { border-color: var(--border-strong); }
  .card.p0 { border-left: 3px solid var(--danger); }
  .card.done { opacity: .55; cursor: default; }
  .card.done:hover { border-color: var(--border); }
  /* v16 卡面瘦身：只留 标题 / 元数据行 / 进度一句话 / 待办进度条，操作收进 hover */
  .c-title { font-size: 13.5px; font-weight: 600; line-height: 1.4; padding-right: 4px; overflow-wrap: anywhere; }
  .c-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 6px; font-size: 10.5px; color: var(--text-3); }
  .c-meta .prio { margin-top: 0; }
  /* 窄列时（列宽被自适应压缩）机器名/久未动标记允许换行，否则 nowrap 的最小内容宽度
     会把列撑破、重新出现横向滚动条 */
  .c-mach { white-space: nowrap; overflow-wrap: anywhere; }
  .stale { color: var(--warn); background: var(--warn-soft); border-radius: 4px; font-size: 10px; padding: 0 5px; line-height: 16px; white-space: nowrap; }
  .c-prog {
    margin-top: 7px; font-size: 12px; color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .c-todo { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .c-todo .bar { flex: 1; height: 4px; background: var(--panel-3); border-radius: 2px; overflow: hidden; }
  .c-todo .bar i { display: block; height: 100%; background: var(--done); border-radius: 2px; }
  .c-todo .tnum { font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums; flex: none; white-space: nowrap; }
  .c-actions { position: absolute; top: 8px; right: 9px; display: none; gap: 4px; align-items: center; }
  .card:hover .c-actions, .card:focus-within .c-actions { display: flex; }
  .c-actions .mini {
    font-size: 11px; padding: 3px 9px; border-radius: 6px;
    background: var(--panel-3); border: 1px solid var(--border-strong); color: var(--text-2);
  }
  .c-actions .mini:hover { color: var(--text); border-color: var(--text-3); }
  /* 空看板里的「清除筛选」按钮（不在 .c-actions 下，需要独立样式） */
  .col-empty .mini {
    margin-top: 9px; font-size: 11px; padding: 4px 11px; border-radius: 6px;
    background: var(--panel-3); border: 1px solid var(--border-strong); color: var(--text-2);
  }
  .col-empty .mini:hover { color: var(--text); border-color: var(--text-3); }
  .col-empty .clear-hint { color: var(--text-3); font-size: 11px; }
  .prio { font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 1px 5px; border-radius: 4px; flex: none; }
  .prio.p0 { color: #F0736F; background: rgba(240,115,111,.11); }
  .prio.p1 { color: var(--warn); background: rgba(240,162,46,.11); }
  .prio.p2 { color: var(--text-3); background: var(--panel-3); }
  .c-age { font-size: 10px; color: var(--text-3); white-space: nowrap; }
  .dots {
    width: 20px; height: 20px; flex: none; display: grid; place-items: center;
    border-radius: 5px; color: var(--text-3); font-size: 14px; line-height: 1;
  }
  .dots:hover { background: var(--panel-3); color: var(--text); }

  .ch-name[data-edit], .ch-place[data-edit], .c-title[data-edit] { cursor: text; }
  .ch-name[data-edit]:hover, .ch-place[data-edit]:hover {
    background: var(--panel-3); box-shadow: 0 0 0 3px var(--panel-3); border-radius: 4px;
  }

  /* v16：进度一句话在卡面单行截断（.c-prog），待办用进度条（.c-todo）；旧的多行块已删 */
  .path { font-size: 10px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

  .todo-item { display: flex; align-items: flex-start; gap: 7px; padding: 3px 0; font-size: 11.5px; cursor: pointer; }
  .todo-item .box {

  /* ── 统一居中弹窗（Sheet）────────────────────────────────────────
     苹果规范落地（依据 Apple HIG + Apple Motion）：
     ① modal presentation 用 92%→100% scale + opacity，不是从边缘滑入；
     ② Materialize, don't just fade —— 玻璃表面进出时同时动画 blur 半径与 scale；
     ③ 空间一致性：进场与退场走同一条路径（都从中心缩放）；
     ④ 进出时长不对称：进场 340ms（spring 曲线，从容），退场 200ms（利落）；
     ⑤ 可中断：用 CSS transition 而非 keyframes，中途反向时从当前值接续。
     实现要点：transition 定义在「目标状态」上 —— .on 用进场合奏，非 .on 用退场合奏，
     于是同一个 class 切换自动获得不对称时长，不需要任何 JS 计时器或守卫。
     降级：prefers-reduced-motion → 只做 opacity 交叉淡入，去掉 scale 与 spring。
     磨砂玻璃四件套：blur + 半透明背景 + 1px 半透明边框 + 柔和阴影；
     blur 半径 14px（10–20px 是性能与观感的平衡区）；必须 @supports 与
     prefers-reduced-transparency 双重降级，不支持时退回实体深色背景保证对比度。 */
  .drawer-mask, .modal-mask {
    position: fixed; inset: 0;
    background: var(--mask-bg);
    opacity: 0; pointer-events: none;
    /* visibility 延迟到退场结束再落：关闭状态下元素完全不渲染，
       backdrop-filter 不产生持续开销；打开时 visibility 立刻生效，blur 才有动画起点。 */
    visibility: hidden;
    transition: opacity var(--dur-out) linear, backdrop-filter var(--dur-out) linear,
                visibility 0s linear var(--dur-out);
  }
  .drawer-mask.on, .modal-mask.on {
    opacity: 1; pointer-events: auto; visibility: visible;
    transition: opacity var(--dur-in) var(--ease-out), backdrop-filter var(--dur-in) var(--ease-out),
                visibility 0s linear 0s;
  }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .drawer-mask, .modal-mask {
      -webkit-backdrop-filter: blur(0px) saturate(100%);
      backdrop-filter: blur(0px) saturate(100%);
    }
    .drawer-mask.on, .modal-mask.on {
      -webkit-backdrop-filter: blur(14px) saturate(115%);
      backdrop-filter: blur(14px) saturate(115%);
    }
  }
  @media (prefers-reduced-transparency: reduce) {
    .drawer-mask, .modal-mask {
      -webkit-backdrop-filter: none; backdrop-filter: none;
      background: var(--mask-bg-solid);
    }
  }

  .drawer, .modal {
    position: fixed; left: 50%; top: 50%;
    width: min(680px, 92vw); max-height: min(84vh, 780px);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translate(-50%, -50%) scale(.92);
    opacity: 0; pointer-events: none; visibility: hidden;
    border: 1px solid var(--sheet-border); border-radius: 16px;
    background: var(--sheet-bg);
    box-shadow: none;
    transition: transform var(--dur-out) var(--ease-out), opacity var(--dur-out) linear,
                visibility 0s linear var(--dur-out);
  }
  .drawer.on, .modal.on {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1; pointer-events: auto; visibility: visible;
    transition: transform var(--dur-in) var(--ease-spring), opacity var(--dur-in) var(--ease-out),
                visibility 0s linear 0s;
  }
  /* 层级：抽屉在底，确认框/添加电脑在其上（叠层时上层的遮罩不会和下层打架） */
  .drawer-mask { z-index: 40; }
  .drawer { z-index: 41; }
  .modal-mask { z-index: 44; }
  .modal { z-index: 45; }
  /* 内容多的面板（AI 指南、仓库详情）用更宽的版心 */
  .drawer.wide, .modal.wide { width: min(760px, 94vw); }
  .drawer.xl { width: min(1320px, 96vw); max-height: min(90vh, 880px); }
  .modal.sm { width: min(430px, 92vw); }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .drawer.on, .modal, .modal.on {
      transform: translate(-50%, -50%);
      transition: opacity 120ms linear, visibility 0s linear 0s;
    }
    .drawer:not(.on), .modal:not(.on) { transition: opacity 120ms linear, visibility 0s linear 120ms; }
    .drawer-mask, .drawer-mask.on, .modal-mask, .modal-mask.on {
      transition: opacity 120ms linear, visibility 0s linear 0s;
    }
    .drawer-mask:not(.on), .modal-mask:not(.on) { transition: opacity 120ms linear, visibility 0s linear 120ms; }
  }
  /* 标题栏：返回箭头（可选）| 标题 | 关闭。标题 flex:1 占满中间，关闭按钮自然靠右。 */
  .drawer-head { display: flex; align-items: center; gap: 9px; padding: 14px 17px; border-bottom: 1px solid var(--border); }
  .drawer-head h3 { font-size: 12.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-body { padding: 15px 17px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 13px; }
  .field label { display: block; font-size: 10.5px; color: var(--text-3); margin-bottom: 4px; font-weight: 500; }
  .field input, .field textarea, .field select {

  .dt-path {

  .dt-todo-mark {
    width: 15px; height: 15px; border-radius: 4px; flex: none; margin-top: 2px;
    border: 1px solid var(--border-strong); display: grid; place-items: center; font-size: 9px; color: transparent;
  }
  .dt-todo-row.done .dt-todo-mark { background: var(--done); border-color: var(--done); color: #06281E; }
  .dt-meta { font-size: 11px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 12px; }

  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }

  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px);
    background: var(--panel-3); border: 1px solid var(--border-strong); color: var(--text);
    padding: 8px 15px; border-radius: 8px; font-size: 12px; z-index: 60;
    opacity: 0; pointer-events: none; transition: .2s; box-shadow: var(--shadow);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  .menu {
    position: fixed; z-index: 50; background: var(--panel-3); border: 1px solid var(--border-strong);
    border-radius: 9px; padding: 5px; box-shadow: var(--shadow); min-width: 178px;
  }
  .menu .mh { font-size: 9.5px; color: var(--text-3); padding: 4px 9px 5px; letter-spacing: .5px; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 7px 9px; font-size: 12px; border-radius: 6px; text-align: left; }
  .menu button:hover { background: var(--accent-soft); color: var(--accent); }
  .menu .pick { width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); flex: none; }
  .menu .pick.cur { background: var(--accent); }
  .acc .cnt { font-size: 9px; color: var(--text-3); border: 1px solid var(--border); border-radius: 5px; padding: 0 3px; line-height: 12px; }
  /* 账号面板：列头胶囊 → 切换 / 新增 / 改名 / 删除。
     z-index 压在确认弹窗（44）之下，删除确认时不会被面板挡住。 */
  .menu.acc-panel { width: 262px; max-width: calc(100vw - 24px); z-index: 43; padding: 5px 5px 6px; }
  .acc-list { max-height: 258px; overflow-y: auto; }

     选择器带 .menu 前缀是为了压过上面的 .menu button（width:100% / padding），否则图标会被撑宽。 */
  .acc-row .ops { display: flex; gap: 2px; flex: none; }

  .menu .acc-ico svg { width: 11px; height: 11px; display: block; }

  .acc-form { padding: 3px 8px 5px; }

  .acc-form-btns button.primary { background: var(--accent); color: #fff; }
  .acc-form-btns button.primary:hover { filter: brightness(1.07); color: #fff; }

  .boot { flex: 1; display: grid; place-items: center; text-align: center; color: var(--text-3); font-size: 12.5px; line-height: 1.9; }

  @media (max-width: 1100px) {

  /* ===== 左右分屏：左任务看板 / 右 GitHub 看板，中缝可拖 ===== */
  .view { min-width: 0; overflow-y: auto; padding: 12px 14px 40px; position: relative; }

  #viewGithub { flex: 1; }

  .split-divider::before { content: ''; width: 3px; height: 52px; border-radius: 3px; background: var(--border-strong); transition: background .15s, width .15s, height .15s; }
  .split-divider:hover::before, .split-divider.drag::before { background: var(--accent); width: 5px; height: 88px; }

  /* ===== 小标题：两栏对称；点击把本栏放到最大，再点还原 ===== */
  .sec-title {
    font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 0 10px;
    display: inline-flex; align-items: center; gap: 6px; letter-spacing: .02em;
    transition: color .15s;
  }

  .sec-title.on .mx { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  /* ===== KPI 条：概览先行，点击即过滤 ===== */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .kpi {

  }

  .kpi.alert .num { color: var(--danger); }
  .kpi.alert .hint { color: var(--danger); background: var(--danger-soft); }

  .kpi.good .hint { color: var(--ok); background: var(--ok-soft); }

  .tabs button { height: 27px; padding: 0 13px; border-radius: 7px; font-size: 12.5px; color: var(--text-2); transition: .15s; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { background: var(--accent); color: #fff; font-weight: 500; }
